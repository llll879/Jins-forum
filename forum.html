const KE=(()=>{
'use strict';
/* Редактор вложений: фото — рисование, обрезка, поворот; видео — рисование, обрезка кадра, обрезка длины.
   KE.edit(file,{limit}) -> Promise<{file,changed}|null>. Всё делается на устройстве, на сервер уходит готовый файл. */
const COLORS=['#ff3b30','#ffcc00','#34c759','#0a84ff','#ffffff','#000000'];
const RATIOS=[['free','Свободно',0],['1:1','1:1',1],['4:3','4:3',4/3],['3:4','3:4',3/4],['16:9','16:9',16/9],['9:16','9:16',9/16]];
const MAXIMG=2048,MAXVID=1280;
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(b,w)=>`<svg viewBox="0 0 24 24" width="${w||22}" height="${w||22}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
const I={
 x:ic('<path d="M6 6l12 12M18 6 6 18"/>'),ok:ic('<path d="m5 12.5 4.5 4.5L19 7.5"/>',24),undo:ic('<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'),
 rot:ic('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),
 pen:ic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
 mark:ic('<path d="m9 11-5 5v4h4l5-5"/><path d="m9 11 6-6 4 4-6 6z"/>'),
 arrow:ic('<path d="M5 19 19 5M9 5h10v10"/>'),rect:ic('<rect x="4" y="5" width="16" height="14" rx="2"/>'),
 text:ic('<path d="M5 6V4h14v2M12 4v16M9 20h6"/>'),
 draw:ic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',20),
 crop:ic('<path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/>',20),
 trim:ic('<path d="M7 4v16M17 4v16M7 12h10"/>',20),
 play:'<svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8.2 5.3v13.4a1 1 0 0 0 1.5.86l10.6-6.7a1 1 0 0 0 0-1.72L9.7 4.44a1 1 0 0 0-1.5.86z"/></svg>',
 pause:'<svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/></svg>'};
const fmtT=s=>{s=Math.max(0,s);const m=Math.floor(s/60),r=s-m*60;return m+':'+(r<10?'0':'')+r.toFixed(1)};
const once=(el,ev)=>new Promise((res,rej)=>{const ok=()=>{el.removeEventListener('error',er);res()},er=()=>{el.removeEventListener(ev,ok);rej(new Error('media'))};el.addEventListener(ev,ok,{once:true});el.addEventListener('error',er,{once:true})});
const toast=m=>{try{(KE.toast||(()=>{}))(m,1)}catch(e){}};

/* ---------- рисование (как в мини-аппе) ---------- */
function drawItem(cx,it){
  cx.save();cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle=cx.fillStyle=it.c;cx.lineWidth=it.w;const p=it.pts;
  if(it.t==='pen'||it.t==='marker'){if(it.t==='marker')cx.globalAlpha=.4;cx.beginPath();cx.moveTo(p[0].x,p[0].y);if(p.length===1)cx.lineTo(p[0].x+.01,p[0].y);else for(let i=1;i<p.length;i++)cx.lineTo(p[i].x,p[i].y);cx.stroke()}
  else if(it.t==='rect'&&p.length>1)cx.strokeRect(p[0].x,p[0].y,p[1].x-p[0].x,p[1].y-p[0].y);
  else if(it.t==='arrow'&&p.length>1){const a=Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x),hl=it.w*4.5;
    cx.beginPath();cx.moveTo(p[0].x,p[0].y);cx.lineTo(p[1].x-Math.cos(a)*hl*.6,p[1].y-Math.sin(a)*hl*.6);cx.stroke();
    cx.beginPath();cx.moveTo(p[1].x,p[1].y);cx.lineTo(p[1].x-hl*Math.cos(a-.45),p[1].y-hl*Math.sin(a-.45));cx.lineTo(p[1].x-hl*Math.cos(a+.45),p[1].y-hl*Math.sin(a+.45));cx.closePath();cx.fill()}
  else if(it.t==='text'){const fs=it.w*5;cx.font=`700 ${fs}px -apple-system,Segoe UI,Roboto,sans-serif`;cx.textAlign='center';cx.textBaseline='middle';
    cx.lineWidth=fs/6;cx.strokeStyle=it.c==='#000000'?'#fff':'#000';cx.globalAlpha=.85;
    const ls=it.s.split('\n');ls.forEach((l,i)=>cx.strokeText(l,p[0].x,p[0].y+(i-(ls.length-1)/2)*fs*1.15));cx.globalAlpha=1;
    ls.forEach((l,i)=>cx.fillText(l,p[0].x,p[0].y+(i-(ls.length-1)/2)*fs*1.15))}
  cx.restore()}

/* ---------- общая оболочка ---------- */
function edit(file,opt){
  opt=opt||{};
  const isVid=/^video\//.test(file.type)||(!file.type&&/\.(mp4|m4v|webm|mov)$/i.test(file.name||''));
  const ALPHA=/^image\/(png|webp|gif)$/i.test(file.type);      // у этих форматов бывает прозрачность — не заливаем её белым
  return new Promise(async resolve=>{
    const root=document.createElement('div');root.className='ke';
    root.innerHTML=`<div class="ke-top"><button class="ke-b" data-a="x" type="button" aria-label="Закрыть">${I.x}</button><span class="ke-sp"></span><button class="ke-b" data-a="undo" type="button" aria-label="Отменить">${I.undo}</button>${isVid?'':`<button class="ke-b" data-a="rot" type="button" aria-label="Повернуть">${I.rot}</button>`}<button class="ke-b ok" data-a="ok" type="button" aria-label="Готово">${I.ok}</button></div>
    <div class="ke-st"><div class="ke-box"><div class="ke-ld"><i class="ke-spin"></i></div></div></div>
    <div class="ke-pn" id="kePn"></div>
    <div class="ke-tabs"><button data-m="draw" class="on" type="button">${I.draw}<span>Рисовать</span></button><button data-m="crop" type="button">${I.crop}<span>Обрезать</span></button>${isVid?`<button data-m="trim" type="button">${I.trim}<span>Длина</span></button>`:''}</div>`;
    document.body.appendChild(root);
    const $=s=>root.querySelector(s),st=$('.ke-st'),box=$('.ke-box'),pn=$('#kePn');
    let W=0,H=0,media=null,vid=null,url='',closed=false;
    let mode='draw',tool='pen',color=COLORS[0],size=6,items=[],cur=null;
    let crop=null,ratio=0,rotated=false,dirty=false;
    let t0=0,t1=0,dur=0,playing=false;
    const cv=document.createElement('canvas');cv.className='ke-cv';let cx=cv.getContext('2d');
    const done=v=>{if(closed)return;closed=true;document.removeEventListener('keydown',onKey);window.removeEventListener('resize',layout);try{vid&&(vid.pause(),vid.removeAttribute('src'),vid.load())}catch(e){}if(url)URL.revokeObjectURL(url);root.remove();resolve(v)};
    const onKey=e=>{if(e.key==='Escape'&&!root.querySelector('.ke-txt')&&!root.querySelector('.ke-prog'))done(null)};
    document.addEventListener('keydown',onKey);

    /* --- загрузка --- */
    try{
      if(!isVid){
        let bmp;
        try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
        catch(e){bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad'))};im.src=u})}
        const bw=bmp.width||bmp.naturalWidth,bh=bmp.height||bmp.naturalHeight,k=Math.min(1,MAXIMG/Math.max(bw,bh));
        W=Math.round(bw*k);H=Math.round(bh*k);
        media=document.createElement('canvas');media.width=W;media.height=H;const c=media.getContext('2d');if(!ALPHA){c.fillStyle='#fff';c.fillRect(0,0,W,H)}c.drawImage(bmp,0,0,W,H);
        try{bmp.close&&bmp.close()}catch(e){}
      }else{
        url=URL.createObjectURL(file);vid=document.createElement('video');vid.className='ke-vid';vid.playsInline=true;vid.setAttribute('playsinline','');vid.preload='auto';vid.src=url;
        await once(vid,'loadedmetadata');
        if(!isFinite(vid.duration)||!vid.videoWidth)throw new Error('bad');
        W=vid.videoWidth;H=vid.videoHeight;dur=vid.duration;t0=0;t1=dur;media=vid;
        vid.currentTime=0.01;
      }
    }catch(e){toast(isVid?'Не удалось открыть видео в редакторе':'Не удалось открыть фото');done(null);return}
    crop={x:0,y:0,w:W,h:H};
    $('.ke-ld').remove();if(isVid){vid.style.cssText='position:absolute;max-width:none;max-height:none';box.appendChild(vid)}box.appendChild(cv);

    /* --- раскладка: видимая область = рамка обрезки (или весь кадр в режиме обрезки) --- */
    const region=()=>mode==='crop'?{x:0,y:0,w:W,h:H}:crop;
    let sc=1;
    function layout(){
      const r=region(),aw=st.clientWidth-16,ah=st.clientHeight-8;if(aw<=0||ah<=0)return;
      sc=Math.min(aw/r.w,ah/r.h);box.style.width=Math.round(r.w*sc)+'px';box.style.height=Math.round(r.h*sc)+'px';
      if(!isVid){cv.width=r.w;cv.height=r.h;cv.style.cssText='position:absolute;inset:0;width:100%;height:100%';}
      else{vid.style.width=Math.round(W*sc)+'px';vid.style.height=Math.round(H*sc)+'px';vid.style.left=Math.round(-r.x*sc)+'px';vid.style.top=Math.round(-r.y*sc)+'px';
        const k=Math.min(1,1600/Math.max(r.w,r.h));cv.width=Math.round(r.w*k);cv.height=Math.round(r.h*k);cv.style.cssText='position:absolute;inset:0;width:100%;height:100%';}
      render();if(mode==='crop')cropUI()}
    function render(){
      const r=region();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
      const k=cv.width/r.w;cx.setTransform(k,0,0,k,-r.x*k,-r.y*k);
      if(!isVid)cx.drawImage(media,0,0);
      items.forEach(it=>drawItem(cx,it));if(cur)drawItem(cx,cur);cx.setTransform(1,0,0,1,0,0)}
    window.addEventListener('resize',layout);

    /* --- рисование --- */
    const M=Math.max(W,H),lw=()=>size*M/900*(tool==='marker'?3.5:1);
    const pt=e=>{const r=cv.getBoundingClientRect(),g=region();return{x:g.x+(e.clientX-r.left)*g.w/r.width,y:g.y+(e.clientY-r.top)*g.h/r.height}};
    function askText(p){
      const b=document.createElement('div');b.className='ke-txt';b.innerHTML='<input maxlength="80" placeholder="Текст"><button type="button">OK</button>';st.appendChild(b);const inp=b.querySelector('input');inp.focus();
      const fin=ok=>{const v=inp.value.trim();b.remove();if(ok&&v){items.push({t:'text',c:color,w:size*M/900,pts:[p],s:v});dirty=true;render()}};
      b.querySelector('button').onclick=()=>fin(true);inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fin(true)}else if(e.key==='Escape'){e.stopPropagation();fin(false)}}}
    cv.addEventListener('pointerdown',e=>{if(mode!=='draw'||e.button>0)return;e.preventDefault();const p=pt(e);
      if(tool==='text'){if(!root.querySelector('.ke-txt'))askText(p);return}

  const st=g.querySelector('.gal-st'),nn=g.querySelector('.gal-n'),dl=g.querySelector('.gal-dl'),bp=g.querySelector('.gal-p'),bn=g.querySelector('.gal-nx');
  let tok=0;

      if(it.k==='video'){el=document.createElement('video');el.controls=true;el.autoplay=true;el.playsInline=true;el.setAttribute('playsinline','');el.src=u;el.onerror=()=>toast('Не удалось воспроизвести видео',1)}

      st.appendChild(el)}).catch(()=>{if(my===tok)st.innerHTML='<span style="color:#fff;opacity:.7">Не удалось загрузить</span>'})};
  dl.onclick=()=>saveBlob(items[i].u,items[i].n);
  const go=d=>{const j=i+d;if(j<0||j>=items.length)return;const v=st.querySelector('video');if(v)try{v.pause()}catch(e){}i=j;show()};

  document.addEventListener('keydown',key);document.body.appendChild(g);show()}

/* ----- подсказка при вводе @ ----- */
function mentionBox(ta,form,getList){
  let box=null,items=[],idx=0,tok=0,range=null;
  const close=()=>{tok++;if(box){box.remove();box=null}items=[];range=null};
  const pick=u=>{if(!u||!range)return close();const v=ta.value,ins='@'+u.username+' ';ta.value=v.slice(0,range[0])+ins+v.slice(range[1]);const p=range[0]+ins.length;close();try{ta.setSelectionRange(p,p)}catch(e){}ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus()};
  const draw=()=>{if(!items.length){if(box){box.remove();box=null}return}
    if(!box){box=document.createElement('div');box.className='mnp';form.appendChild(box);const h=e=>{const r=e.target.closest('[data-i]');if(r){e.preventDefault();pick(items[+r.dataset.i])}};box.addEventListener('mousedown',h);box.addEventListener('touchstart',h,{passive:false})}
    box.innerHTML=items.map((u,i)=>`<div class="mni${i===idx?' on':''}" data-i="${i}">${av(u,'s')}<span><b>${esc(u.name)}</b><small>@${esc(u.username)}</small></span></div>`).join('')};
  const sync=async()=>{const pos=ta.selectionStart==null?ta.value.length:ta.selectionStart;const m=/(^|[\s(])@([A-Za-z0-9_]{0,32})$/.exec(ta.value.slice(0,pos));
    if(!m){close();return}
    const q=m[2];range=[pos-q.length-1,pos];const my=++tok;await sleep_(110);if(my!==tok)return;
    let list=[];try{list=await getList(q)}catch(e){}
    if(my!==tok||!range)return;items=list.slice(0,8);idx=0;draw()};
  const key=e=>{if(!box||!items.length)return false;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){idx=(idx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;draw();e.preventDefault();return true}
    if(e.key==='Enter'||e.key==='Tab'){pick(items[idx]);e.preventDefault();return true}
    if(e.key==='Escape'){close();return true}return false};

function isAnimBytes(b){
  const s=(o,n)=>String.fromCharCode.apply(null,b.subarray(o,o+n));
  if(s(0,4)==='GIF8')return true;
  if(b[0]===0x1a&&b[1]===0x45&&b[2]===0xdf&&b[3]===0xa3)return true;
  if(s(0,4)==='RIFF'&&s(8,4)==='WEBP')return s(12,4)==='VP8X'&&!!(b[20]&2);
  if(b[0]===0x89&&s(1,3)==='PNG'){let p=8;while(p+8<=b.length){const n=((b[p]<<24)|(b[p+1]<<16)|(b[p+2]<<8)|b[p+3])>>>0,t=s(p+4,4);if(t==='acTL')return true;if(t==='IDAT'||t==='IEND')return false;p+=12+n}}
  return false}
async function fitImg(file,max,lim){
  try{if(file.type==='video/webm'||isAnimBytes(new Uint8Array(await file.slice(0,65536).arrayBuffer())))return file}catch(e){}
  return fitStatic(file,max,lim)}
function fitStatic(file,max,lim){return new Promise(res=>{
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{URL.revokeObjectURL(u);if(file.size<=lim&&Math.max(im.width,im.height)<=max&&/^image\/(png|webp)$/.test(file.type)){res(file);return}const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    const enc=q=>new Promise(r=>c.toBlob(b=>r(b),WEBP_OK?'image/webp':'image/png',q));
    (async()=>{let b=await enc(.92);if(b&&b.size>lim&&WEBP_OK)b=await enc(.7);if(b&&b.size>lim&&WEBP_OK)b=await enc(.45);
      res(b?new File([b],'s.'+(WEBP_OK?'webp':'png'),{type:b.type}):file)})()};
  im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})}

    if(!h)h=gif.ready?`<div class="none">${gif.web?'GIF не нашлось.':'Здесь будут ваши GIF.<br>Нажмите «+», чтобы загрузить свой, или сохраните GIF из чата: долгое нажатие на GIF → «Сохранить в мои GIF».'}</div>`:'<div class="spin"></div>';
    if(gif.web&&gif.items.length)h+='<div class="gpw">Powered by GIPHY</div>';
    sgr.innerHTML=h};
  const gifLoad=async()=>{const my=++gif.tk;gif.more=false;
    try{if(!gif.ready){const m=await api('/gifs/mine');if(my!==gif.tk)return;gif.mine=m.items;gif.web=!!m.web}
      if(gif.web){const d=await api('/gifs/search?q='+encodeURIComponent(gif.q));if(my!==gif.tk)return;gif.items=d.items;gif.next=d.next||'';if(d.off)gif.web=false}
      else{gif.items=[];gif.next=''}}
    catch(e){if(my!==gif.tk)return;toast(e.message,1)}
    gif.ready=true;if(tab==='g'&&bg.isConnected)drawGif()};
  const gifMore=async()=>{if(gif.more||!gif.next||gif.q!==$('#gq',bg).value.trim())return;gif.more=true;const my=gif.tk;
    try{const d=await api('/gifs/search?q='+encodeURIComponent(gif.q)+'&pos='+gif.next);if(my!==gif.tk)return;
      const have=new Set(gif.items.map(i=>i.id));gif.items=gif.items.concat(d.items.filter(i=>!have.has(i.id)));gif.next=d.next||'';if(tab==='g'&&bg.isConnected)drawGif()}
    catch(e){}finally{gif.more=false}};
  const draw=()=>{$$('.stkh .tab',bg).forEach(b=>b.classList.toggle('on',b.dataset.t===tab));

    if(tab==='s'){const rec=stkRecent(),known=new Set();packs.forEach(p=>p.items.forEach(i=>known.add(i.id)));const rl=rec.filter(x=>known.has(x));

        kp.map(p=>`<h4 data-s="${p.id}">${esc(p.title)}</h4><div class="g e">${p.items.map(i=>`<button type="button" data-e=":em${i.id}:"><img data-bsrc="/forum/api/stickers/img/${i.id}" alt=""></button>`).join('')}</div>`).join('')};
  bg.onclick=e=>{
    if(e.target===bg){close();return}
    const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;ls.set('stk_tab',tab);draw();return}

      if(ok){toast(ok>1?'GIF сохранены: '+ok:'GIF сохранён');gif.ready=false;if(bg.isConnected&&tab==='g')draw()}});return}
    const gi=e.target.closest('.gi[data-gif]');if(gi){if(gifLp){gifLp=false;return}close();o.gif(gi.dataset.gif);return}

  let gifLp=false,lpT=null;
  const gifMenu=async b=>{gifLp=true;try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
    const mine=b.dataset.m==='1',c=await sheet([mine?{ic:'trash',t:'Удалить из моих GIF',k:'d',bad:true}:{ic:'plus',t:'Сохранить в мои GIF',k:'s'}],'');setTimeout(()=>{gifLp=false},400);if(!c)return;
    try{if(c.k==='d')await post_('/gifs/delete',{id:b.dataset.gif});else await post_('/gifs/save',{ref:b.dataset.gif});toast(c.k==='d'?'Удалено':'GIF сохранён');gif.ready=false;draw()}catch(er){toast(er.message,1)}};
  sgr.addEventListener('pointerdown',e=>{const b=e.target.closest('.gi');clearTimeout(lpT);if(b){gifLp=false;lpT=setTimeout(()=>gifMenu(b),480)}});
  ['pointerup','pointercancel','scroll'].forEach(n=>sgr.addEventListener(n,()=>clearTimeout(lpT),{passive:true}));
  sgr.addEventListener('contextmenu',e=>{const b=e.target.closest('.gi');if(b){e.preventDefault();if(!gifLp)gifMenu(b)}});
  sgr.addEventListener('scroll',()=>{if(tab==='g'&&sgr.scrollTop+sgr.clientHeight>sgr.scrollHeight-260)gifMore()},{passive:true});
  let gqT;$('#gq',bg).oninput=e=>{clearTimeout(gqT);gqT=setTimeout(()=>{const v=e.target.value.trim();if(v===gif.q)return;gif.q=v;gif.next='';gif.items=[];sgr.innerHTML='<div class="spin"></div>';gifLoad()},350)};
  document.body.appendChild(bg);

  try{packs=(await api('/stickers/mine')).packs}catch(e){if(tab!=='g')toast(e.message,1)}
  if(bg.isConnected&&tab!=='g')draw()}

      <div style="padding:10px 16px 30px;display:flex;flex-direction:column;gap:10px"><button class="btn ghost" id="pRen" type="button">${sm('pencil',19)}Переименовать</button><button class="btn ghost" id="pLn" type="button">${sm('link',19)}Изменить ссылку</button><button class="btn bad" id="pDel" type="button">Удалить набор</button></div>`:''}`;

/* ===== Оформление чатов (обои, пузыри, текст) =====
   Настройки хранятся на устройстве: localStorage (параметры) + IndexedDB (своё фото-обои).
   Приоритет: настройки этого чата → настройки «для всех чатов» → стандартный вид.
   API: CS.attach(chatNode,key) → ctx;  CS.open(ctx);  CS.open({}) — настройки для всех чатов. */
const CS=(()=>{
  const uid=()=>S.me?S.me.id:0;
  const kAll=()=>'cs_'+uid()+'_all',kChat=k=>'cs_'+uid()+'_'+k;
  const DEF={wp:{t:'none',v:'',blur:0,dim:0,pat:'none',pop:20},out:{c:'',st:'grad'},inc:{c:''},rad:20,tail:1,fs:15,gap:7};
  const clone=o=>JSON.parse(JSON.stringify(o));
  const HEX=/^#[0-9a-f]{6}$/i,ST=['grad','solid','glass','outline'];
  const num=(v,a,b,d)=>typeof v==='number'&&isFinite(v)?Math.min(b,Math.max(a,Math.round(v))):d;
  /* любые данные из хранилища приводим к безопасному виду */
  function merge(o){
    const c=clone(DEF);if(!o||typeof o!=='object')return c;
    const w=o.wp||{},u=o.out||{},n=o.inc||{};
    if(['none','p','img','color'].includes(w.t))c.wp.t=w.t;
    c.wp.v=typeof w.v==='string'?w.v.slice(0,80):'';
    c.wp.blur=num(w.blur,0,20,0);c.wp.dim=num(w.dim,0,80,0);c.wp.pop=num(w.pop,5,50,20);
    c.wp.pat=['none','dots','grid','stars','waves','rhomb'].includes(w.pat)?w.pat:'none';
    if(c.wp.t==='color'&&!HEX.test(c.wp.v))c.wp.t='none';
    c.out.c=HEX.test(u.c||'')?u.c:'';c.out.st=ST.includes(u.st)?u.st:'grad';
    c.inc.c=HEX.test(n.c||'')?n.c:'';
    c.rad=num(o.rad,4,28,20);c.tail=o.tail===0?0:1;c.fs=num(o.fs,13,20,15);c.gap=num(o.gap,2,16,7);
    return c}
  const isDef=c=>JSON.stringify(c)===JSON.stringify(DEF);
  const load=k=>{try{const s=ls.get(k);return s?merge(JSON.parse(s)):null}catch(e){return null}};
  const eff=key=>(key&&load(kChat(key)))||load(kAll())||clone(DEF);

  /* ----- обои-пресеты и узоры ----- */
  const WPS=[
    {id:'night',n:'Ночь',bg:'linear-gradient(160deg,#0f0c29,#302b63 55%,#24243e)'},
    {id:'aurora',n:'Аврора',bg:'radial-gradient(120% 70% at 0% 0%,rgba(31,190,170,.75),transparent 60%),radial-gradient(100% 70% at 100% 100%,rgba(123,47,247,.8),transparent 62%)',c:'#0a0e1c'},
    {id:'sunset',n:'Закат',bg:'linear-gradient(170deg,#2a1b4d,#7a3f78 55%,#e9737f)'},
    {id:'ocean',n:'Океан',bg:'linear-gradient(170deg,#021b3a,#0b3d6e 55%,#1d78a8)'},
    {id:'forest',n:'Лес',bg:'linear-gradient(165deg,#07161a,#14463a 60%,#2a8a62)'},
    {id:'rose',n:'Роза',bg:'linear-gradient(160deg,#2a0f1d,#6b1f3f 60%,#c2456e)'},
    {id:'graphite',n:'Графит',bg:'linear-gradient(180deg,#141418,#2a2a33)'},
    {id:'cream',n:'Сливки',light:1,bg:'linear-gradient(160deg,#f8f0e3,#e6d8c1)'},
    {id:'mint',n:'Мята',light:1,bg:'linear-gradient(160deg,#e4f6ee,#c3e6d8)'},
    {id:'marble',n:'Мрамор',img:1},{id:'clouds',n:'Облака',img:1},{id:'city',n:'Город',img:1},{id:'temple',n:'Храм',img:1},{id:'colon',n:'Колоннада',img:1}
  ];
  const PRE={};WPS.forEach(p=>PRE[p.id]=p);
  const PATS={
    dots:{n:'Точки',s:"<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'><circle cx='3' cy='3' r='1.5' fill='white'/><circle cx='16' cy='16' r='1.5' fill='white'/></svg>"},
    grid:{n:'Сетка',s:"<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34'><path d='M34 0H0v34' fill='none' stroke='white' stroke-width='1'/></svg>"},
    stars:{n:'Звёзды',s:"<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><path d='M12 5l1.7 4.6L18 11.5l-4.3 1.9L12 18l-1.7-4.6L6 11.5l4.3-1.9z' fill='white'/><path d='M56 46l1 2.8 2.8 1.2-2.8 1.2-1 2.8-1-2.8-2.8-1.2 2.8-1.2z' fill='white'/><circle cx='64' cy='14' r='1.3' fill='white'/><circle cx='30' cy='62' r='1.3' fill='white'/></svg>"},
    waves:{n:'Волны',s:"<svg xmlns='http://www.w3.org/2000/svg' width='44' height='22'><path d='M0 11q11-11 22 0t22 0' fill='none' stroke='white' stroke-width='1.2'/></svg>"},
    rhomb:{n:'Ромбы',s:"<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><path d='M18 4l14 14-14 14L4 18z' fill='none' stroke='white' stroke-width='1.1'/></svg>"}
  };
  const patUrl=id=>'url("data:image/svg+xml,'+encodeURIComponent(PATS[id].s)+'")';
  const OUTC=['#4a90ff','#2fb5a2','#3fbf6a','#e8638b','#ef8a3c','#e0525f','#7a8296','#101014','#f2f0ea'];
  const INC=['#4a90ff','#2fb5a2','#3fbf6a','#e8638b','#ef8a3c','#9d92e6','#7a8296'];

  const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255)};

  /* ----- своё фото: IndexedDB (в памяти, если IndexedDB недоступна) ----- */
  const mem={},urls={};
  const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('kf_cs',1);r.onupgradeneeded=()=>r.result.createObjectStore('wp');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
  const idbDo=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{const q=fn(db.transaction('wp',mode).objectStore('wp'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
  const putImg=async(k,b)=>{try{await idbDo('readwrite',s=>s.put(b,k));delete mem[k];return true}catch(e){mem[k]=b;return false}};
  const delImg=k=>{delete mem[k];if(urls[k]){try{URL.revokeObjectURL(urls[k].u)}catch(e){}delete urls[k]}return idbDo('readwrite',s=>s.delete(k)).catch(()=>{})};
  async function imgUrl(k,rev){
    const c=urls[k];if(c&&c.rev===rev)return c.u;
    let b=mem[k];if(!b)try{b=await idbDo('readonly',s=>s.get(k))}catch(e){}

/* ---------- фоновое воспроизведение и управление из шторки/экрана блокировки ----------

   Приложение Android (WebView): тот же API там ничего не показывает, поэтому шлём состояние в мост

const MS='mediaSession' in navigator?navigator.mediaSession:null;

let natSig='',natPos=0,permAsked=0;

function artwork(t){if(!t||!t.img)return [];return [96,192,256,384,512].map(n=>({src:t.img,sizes:n+'x'+n}))}
function posState(){
  if(!MS||!MS.setPositionState)return;const t=cur(),d=durOf(t);
  try{if(t&&d&&isFinite(A.currentTime))MS.setPositionState({duration:d,playbackRate:A.playbackRate||1,position:Math.min(A.currentTime,d)});else MS.setPositionState()}catch(e){}}
/* состояние → в уведомление Android (только когда что-то изменилось: трек, пауза/игра, перемотка) */
function nat(force){
  const n=NM();if(!n)return;const t=cur();
  if(!t){try{n.mediaStop()}catch(e){}natSig='';return}
  const pl=!A.paused&&!A.ended,d=Math.round(durOf(t)*1000),pos=Math.round((A.currentTime||0)*1000);
  const sig=t.id+'|'+pl+'|'+d;
  if(!force&&sig===natSig&&Math.abs(pos-natPos)<2500)return;
  natSig=sig;natPos=pos;
  try{n.media(JSON.stringify({id:String(t.id),title:t.t||'',artist:t.a||'',img:t.img||'',playing:pl,pos:pos,dur:d}))}catch(e){}}

window.__exgMedia=function(a){
  try{
    if(a==='play'){if(qi>=0&&A.paused){const p=A.play();if(p&&p.catch)p.catch(()=>{})}}
    else if(a==='pause'){if(!A.paused)A.pause()}
    else if(a==='next')next(false);
    else if(a==='prev')prev();
    else if(a==='stop')stop();

function session(){
  const t=cur();if(!t||qi<0)return;
  if(MS){
    try{MS.metadata=new MediaMetadata({title:t.t,artist:t.a,album:'EXG Music',artwork:artwork(t)})}catch(e){}
    if(!sessionSet){sessionSet=1;
      const h=(n,f)=>{try{MS.setActionHandler(n,f)}catch(e){}};
      h('play',()=>{if(qi>=0&&A.paused){const p=A.play();if(p&&p.catch)p.catch(()=>{})}});
      h('pause',()=>{if(!A.paused)A.pause()});
      h('stop',()=>stop());
      h('nexttrack',()=>next(false));h('previoustrack',prev);
      h('seekbackward',d=>{A.currentTime=Math.max(0,A.currentTime-((d&&d.seekOffset)||10))});
      h('seekforward',d=>{const m=durOf(cur())||1e9;A.currentTime=Math.min(m,A.currentTime+((d&&d.seekOffset)||10))});
      h('seekto',d=>{if(d&&isFinite(d.seekTime)){if(d.fastSeek&&A.fastSeek)A.fastSeek(d.seekTime);else A.currentTime=d.seekTime;posState()}})}

/* ---------- тексты песен ---------- */
/* Сервер: /music/lyrics -> {sync:[[сек,строка]…], plain, src}. Показываем в двух местах одновременно:
   на обратной стороне перевёрнутой обложки и на второй «странице» полноэкранного плеера (листнуть вниз). Синхронный текст — как караоке:
   текущая строка подсвечивается и «заливается» по ходу пения, список сам едет за ней, тап по строке — перемотка. */
let LY={id:null,st:'',d:null},lyI=-2,lyUser=0,lyNeed=0,raf=0;
const lyCache=new Map();
const lySync=()=>LY.st==='ok'&&LY.d&&LY.d.sync&&LY.d.sync.length?LY.d.sync:null;
function lyBody(){
  if(LY.st==='load'||!LY.st)return '<div class="ly-in"><div class="ly-sk"><i></i><i></i><i></i><i></i><i></i></div></div>';
  if(LY.st==='none')return `<div class="ly-in"><div class="ly-msg">${MI.lyr}<b>Текста пока нет</b><small>Для этой песни мы его не нашли</small></div></div>`;
  if(LY.st==='err')return `<div class="ly-in"><div class="ly-msg">${MI.lyr}<b>Не удалось загрузить текст</b><button class="btn sm ghost" data-a="lyretry">Повторить</button></div></div>`;
  const s=lySync();
  if(s)return `<div class="ly-in">${s.map((l,i)=>l[1]?`<p class="ly-l" data-i="${i}" data-t="${l[0]}"><span data-tx="${esc(l[1])}">${esc(l[1])}</span></p>`:`<p class="ly-l ly-gap" data-i="${i}" data-t="${l[0]}"><span>• • •</span></p>`).join('')}</div>`;
  return `<div class="ly-in ly-pl">${String(LY.d.plain||'').split(/\n\s*\n/).map(b=>`<p>${esc(b.trim())}</p>`).join('')}<small class="ly-note">Текст без синхронизации — его можно листать вручную</small></div>`}
function lyRender(){
  const f=$('#muFull');if(!f)return;
  const h=lyBody(),src=LY.st==='ok'&&LY.d?(LY.d.src==='ym'?'Текст: Яндекс Музыка':'Текст: LRCLIB'):'';
  $$('.ly',f).forEach(b=>{b.innerHTML=h;b.classList.toggle('sync',!!lySync());b.scrollTop=0;b.style.setProperty('--pad',Math.round(b.clientHeight*.4)+'px')});
  const sr=$('.ly-src',f);if(sr)sr.textContent=src;
  lyI=-2;lyTick(true)}
function lyReset(){LY={id:null,st:'',d:null};lyI=-2;const f=$('#muFull');if(f){$$('.ly',f).forEach(b=>{b.innerHTML='';b.scrollTop=0});const s=$('.ly-src',f);if(s)s.textContent=''}}
async function ensureLy(){
  const t=cur();if(!t)return;
  if(LY.id===t.id&&LY.st&&LY.st!=='err')return;
  LY={id:t.id,st:'load',d:null};lyRender();
  const c=lyCache.get(t.id);
  if(c){LY.d=c;LY.st=(c.sync&&c.sync.length)||c.plain?'ok':'none';lyRender();lyRun();return}
  try{
    const d=await api('/music/lyrics?'+new URLSearchParams({id:t.id,t:t.t,a:t.a,d:t.d||0}));
    if(!cur()||cur().id!==t.id)return;
    const ok=d&&((d.sync&&d.sync.length)||d.plain);
    if(ok){lyCache.set(t.id,d);if(lyCache.size>40)lyCache.delete(lyCache.keys().next().value)}
    LY.d=ok?d:null;LY.st=ok?'ok':'none'}
  catch(e){if(!cur()||cur().id!==t.id)return;LY.st='err'}
  lyRender();lyRun()}
function flipTo(on){
  const f=$('#muFull');if(!f)return;const fl=$('.flip',f);
  fl.classList.toggle('on',!!on);fl.setAttribute('aria-label',on?'Вернуть обложку':'Показать текст песни');
  if(on){ensureLy();setTimeout(()=>{lyUser=0;lyI=-2;const b=$('.ly[data-ly="1"]',f);if(b)b.style.setProperty('--pad',Math.round(b.clientHeight*.4)+'px');lyTick(true)},520)}}
function lySeek(t){
  if(!isFinite(t))return;lyUser=0;A.currentTime=Math.max(0,t);
  if(A.paused){const p=A.play();if(p&&p.catch)p.catch(()=>{})}
  lyI=-2;lyTick(true)}
/* какая строка сейчас поётся — двоичный поиск по таймкодам */
function lyTick(force){
  const s=lySync(),f=$('#muFull');if(!s||!f)return;
  if(!force&&!f.classList.contains('open'))return;
  const T=A.currentTime+.18;
  let lo=0,hi=s.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(s[m][0]<=T){r=m;lo=m+1}else hi=m-1}
  if(r!==lyI){const first=lyI===-2;lyI=r;
    $$('.ly.sync',f).forEach(b=>{const ls=b.querySelectorAll('.ly-l');
      for(let j=0;j<ls.length;j++){ls[j].classList.toggle('lyon',j===r);ls[j].classList.toggle('lypast',j<r);if(j!==r)ls[j].style.removeProperty('--lp')}
      if(!lyCenter(b,r>=0?ls[r]:null,!first))lyNeed=1})}
  else if(lyNeed&&r>=0&&Date.now()-lyUser>=3500){lyNeed=0;$$('.ly.sync',f).forEach(b=>lyCenter(b,b.querySelectorAll('.ly-l')[r],true))}
  if(r>=0){
    const a=s[r][0],nx=s[r+1]?s[r+1][0]:a+6,len=s[r][1].length,span=Math.max(.8,Math.min(nx-a-.05,len*.085+1.1)),p=Math.max(0,Math.min(1,(T-a)/span));
    $$('.ly.sync .ly-l.lyon',f).forEach(l=>l.style.setProperty('--lp',(p*100).toFixed(1)+'%'))}}
function lyCenter(b,el,smooth){            /* false — пользователь сам листает, вернёмся к строке позже */
  if(!el)return true;
  if(Date.now()-lyUser<3500)return false;
  const f=$('#muFull'),beh=smooth?'smooth':'auto';
  if(b.dataset.ly==='1'){                       /* обратная сторона обложки: свой скролл */
    if(!$('.flip',f).classList.contains('on'))return true;
    b.scrollTo({top:el.offsetTop-b.clientHeight/2+el.offsetHeight/2,behavior:beh});return true}
  const sc=$('.mf-sc',f),p1=$('.mf-p1',f);       /* вторая страница: едет весь экран */
  if(sc.scrollTop<p1.clientHeight*.35)return true;
  const hh=$('.mf-p2h',f).offsetHeight,r=el.getBoundingClientRect(),sr=sc.getBoundingClientRect();
  sc.scrollTo({top:sc.scrollTop+(r.top+r.height/2)-(sr.top+hh+(sc.clientHeight-hh)/2),behavior:beh});return true}
function lyRun(){
  if(raf)return;
  const step=()=>{raf=0;const f=$('#muFull');if(!f||!f.classList.contains('open')||A.paused||!lySync())return;lyTick();raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step)}

/* ---------- таймер сна ---------- */
/* Через N минут музыка плавно затихает (последние 10 с) и ставится на паузу; «До конца трека» — остановка после текущей песни. */
let slp={end:0,eot:0,iv:0};
const sheetTop=(items,title)=>{const p=sheet(items,title);const b=[...document.querySelectorAll('.sheet-bg')].pop();if(b)b.style.zIndex=95;return p};
function slpPaint(){
  const on=!!(slp.end||slp.eot),f=$('#muFull');if(!f)return;const b=$('.sleep',f);if(!b)return;
  b.classList.toggle('on',on);
  $('i',b).textContent=slp.eot?'до конца':slp.end?fmt(Math.max(0,(slp.end-Date.now())/1000)):''}
function slpClear(msg){
  clearInterval(slp.iv);slp={end:0,eot:0,iv:0};A.volume=1;slpPaint();if(msg){try{A.pause()}catch(e){}toast(msg)}}
function slpTick(){
  const left=slp.end-Date.now();
  if(left<=0){slpClear('Таймер сна: музыка остановлена');return}
  A.volume=left<10000?Math.max(.03,left/10000):1;slpPaint()}
function slpSet(min){
  slpClear();
  if(min==='eot')slp.eot=1;
  else{slp.end=Date.now()+min*60000;slp.iv=setInterval(slpTick,500)}
  slpPaint();toast(min==='eot'?'Музыка остановится после этого трека':'Музыка остановится через '+min+' мин')}
async function sleepMenu(){
  const on=!!(slp.end||slp.eot),items=[15,30,45,60,90].map(m=>({ic:'moon',t:m+' минут',k:m}));
  items.push({ic:'music',t:'До конца трека',k:'eot'});
  if(on)items.push({t:'Выключить таймер',bad:true,k:'off'});
  const c=await sheetTop(items,on?'Таймер сна · '+(slp.eot?'до конца трека':'осталось '+fmt((slp.end-Date.now())/1000)):'Таймер сна');
  if(!c)return;
  if(c.k==='off')slpClear();else slpSet(c.k)}

const totalTxt=s=>{s=Math.round(s||0);if(!s)return '';const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' ч '+m+' мин':Math.max(1,m)+' мин'};

/* теги ID3 (название, исполнитель, обложка) — чтобы файл красиво заполнился сам */
function tdec(enc,d){
  if(!d.length)return '';
  try{
    if(enc===1||enc===2){let le=enc===1?true:false,o=0;
      if(d[0]===0xFF&&d[1]===0xFE){le=true;o=2}else if(d[0]===0xFE&&d[1]===0xFF){le=false;o=2}
      return new TextDecoder(le?'utf-16le':'utf-16be').decode(d.subarray(o)).replace(/\0+$/,'').trim()}
    if(enc===3)return new TextDecoder('utf-8').decode(d).replace(/\0+$/,'').trim();
    let ascii=true;for(let i=0;i<d.length;i++)if(d[i]>127){ascii=false;break}
    return new TextDecoder(ascii?'utf-8':'windows-1251').decode(d).replace(/\0+$/,'').trim()
  }catch(e){return ''}}
async function id3(file){
  const out={};
  try{
    const hb=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(hb[0]!==0x49||hb[1]!==0x44||hb[2]!==0x33)return out;
    const ver=hb[3],size=((hb[6]&127)<<21)|((hb[7]&127)<<14)|((hb[8]&127)<<7)|(hb[9]&127);
    if(ver<2||ver>4||size<=0)return out;
    const buf=new Uint8Array(await file.slice(10,10+Math.min(size,8*1048576)).arrayBuffer());
    const v2=ver===2,idl=v2?3:4,hl=v2?6:10;let p=0;
    if(hb[5]&0x40&&!v2)p=ver===4?(((buf[0]&127)<<21)|((buf[1]&127)<<14)|((buf[2]&127)<<7)|(buf[3]&127)):(((buf[0]<<24)|(buf[1]<<16)|(buf[2]<<8)|buf[3])>>>0)+4;
    let pic=null;
    while(p+hl<=buf.length){
      const id=String.fromCharCode(buf[p],buf[p+1],buf[p+2],v2?0:buf[p+3]).replace(/\0/g,'');
      if(!/^[A-Z0-9]+$/.test(id))break;
      let fs;
      if(v2)fs=(buf[p+3]<<16)|(buf[p+4]<<8)|buf[p+5];
      else if(ver===4)fs=((buf[p+4]&127)<<21)|((buf[p+5]&127)<<14)|((buf[p+6]&127)<<7)|(buf[p+7]&127);
      else fs=((buf[p+4]<<24)|(buf[p+5]<<16)|(buf[p+6]<<8)|buf[p+7])>>>0;
      if(!fs||p+hl+fs>buf.length)break;
      const d=buf.subarray(p+hl,p+hl+fs);
      if(id==='TIT2'||id==='TT2')out.title=tdec(d[0],d.subarray(1));
      else if(id==='TPE1'||id==='TP1')out.artist=tdec(d[0],d.subarray(1));
      else if((id==='APIC'||id==='PIC')&&!pic){
        const enc=d[0];let q=1;
        if(v2)q+=3;else{while(q<d.length&&d[q]!==0)q++;q++}
        q++; /* тип картинки */
        if(enc===1||enc===2){while(q+1<d.length&&!(d[q]===0&&d[q+1]===0))q+=2;q+=2}else{while(q<d.length&&d[q]!==0)q++;q++}
        const im=d.subarray(q),jpg=im[0]===0xFF&&im[1]===0xD8,png=im[0]===0x89&&im[1]===0x50;
        if((jpg||png)&&im.length<6*1048576)pic={bytes:im,mime:jpg?'image/jpeg':'image/png'}}
      p+=hl+fs}
    if(pic)out.cover=await coverBlob(pic.bytes,pic.mime)
  }catch(e){}
  return out}
function coverBlob(bytes,mime){return new Promise(res=>{
  const u=URL.createObjectURL(new Blob([bytes],{type:mime})),im=new Image();
  im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b&&b.size<=700000?b:null),'image/jpeg',.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
const fileDur=f=>new Promise(res=>{
  const a=new Audio(),u=URL.createObjectURL(f);let done=0;
  const fin=v=>{if(done)return;done=1;clearTimeout(tm);a.onloadedmetadata=a.onerror=null;URL.revokeObjectURL(u);res(v)};
  const tm=setTimeout(()=>fin(0),5000);a.preload='metadata';
  a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0);a.onerror=()=>fin(0);a.src=u});

function profile(box,list,o){

  const apply=r=>{arr=(r.tracks||[]).map(pmT);draw()};

    if(c.k==='f')pickFiles('audio/*,.mp3,.m4a,.aac,.ogg,.oga,.opus,.wav,.flac,.weba',addFiles);
    else pickExg(new Set(arr.map(t=>t.id)),async t=>{const r=await pmAdd(t);apply(r)})}
  async function addFiles(fs){
    let ok=0;const n=fs.length;
    for(let i=0;i<n;i++){const f=fs[i];
      if(arr.length>=max){toast('Достигнут лимит: '+max+' треков',1);break}
      if(f.size>fileMb*1048576){toast('«'+f.name+'» больше '+fileMb+' МБ',1);continue}
      toast(n>1?'Загружаю '+(i+1)+' из '+n+'…':'Загружаю трек…');

        const meta=await id3(f),du=await fileDur(f),fd=new FormData();

  async function manage(i){
    const t=arr[i];if(!t)return;
    const items=[];if(i>0)items.push({ic:'pin',t:'Поставить первым',k:'first'});

      $('[data-pm=add]',box).onclick=addMenu;return}

      <div class="pm-head"><span class="pm-ic">${MI.note}<i class="pm-eq"><u></u><u></u><u></u></i></span><div class="pm-ht"><b>${own?'Моя музыка':'Музыка'}</b><small>${arr.length} ${plural(arr.length,'трек','трека','треков')}${tot?' · '+tot:''}</small></div>${own?`<button class="pm-addb" data-pm="add" aria-label="Добавить музыку">${IC.plus}</button>`:''}</div>
      <div class="pm-hero"><button class="pm-disc" data-pm="hero" aria-label="Играть"><span class="mu-cv"></span><span class="pm-pp"></span></button><div class="pm-meta"><b></b><small></small><div class="pm-prog"><i></i></div></div></div>
      <div class="pm-act"><button class="btn sm" data-pm="all">${MI.play}Слушать</button><button class="btn ghost sm" data-pm="shuf">${MI.shuf}Вперемешку</button></div>
      <div class="mu-list pm-list">${arr.map(rowP).join('')}</div></section>`;
    const sec=$('.pm-live',box);sec._arr=arr;

  const soft=SOFTR;SOFTR=false;const my=++rid;clearInterval(chatT);applyTheme();LOCAL_URLS.splice(0).forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
  const h=(location.hash||'#/').replace(/^#\/?/,'');const [r,a,b]=h.split('/');
  if(!S.token&&r==='n'&&a)ls.set('pend_n',a);
  if(!S.token||r==='login'){MU.stop();if(S.token&&r==='login'){location.hash='#/';return}$('#app').innerHTML='<div id="view" style="padding:0"></div>';$('#app').dataset.page='login';await viewLogin($('#view'));return}
  if(!S.me){try{await boot()}catch(e){$('#app').innerHTML=`<div class="login"><div class="logo">KMBP <b>FORUM</b></div><p style="color:var(--bad)">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Повторить</button></div>`;return}}
  shell();const v=$('#view');
  const noNav=['c','g','p','post','edit','edit-profile','new'].includes(r);
  $('#nav').style.display=noNav?'none':'';$('#app').dataset.page=({'':'feed',feed:'feed',boards:'boards',chats:'chats',new:'new',edit:'new'})[r]||r;
  v.style.paddingBottom=noNav?'0':'';MU.mount(noNav);
  const nav=({'':'feed',boards:'boards',b:'boards',music:'boards',chats:'chats',me:'me',u:(a==S.me.id?'me':'')})[r];
  $$('#nav button[data-n]').forEach(x=>x.classList.toggle('on',x.dataset.n===nav));
  const st0=soft?v.scrollTop:0;if(!soft){v.scrollTop=0;v.innerHTML='<div class="spin"></div>'}
  try{
    const t=document.createElement('div');
    let fn;
    if(r===''||r==='feed')fn=()=>viewFeed(t);
    else if(r==='boards')fn=()=>viewBoards(t);
    else if(r==='music')fn=()=>viewMusic(t);
    else if(r==='b')fn=()=>viewBoard(t,a);
    else if(r==='p'||r==='post')fn=()=>viewPost(t,a);
    else if(r==='u')fn=()=>viewUser(t,a);
    else if(r==='me')fn=()=>viewUser(t,S.me.id);
    else if(r==='fl')fn=()=>viewFollows(t,a,b);
    else if(r==='new')fn=()=>viewCompose(t,a);
    else if(r==='edit')fn=()=>viewCompose(t,0,a);
    else if(r==='edit-profile')fn=()=>viewEditProfile(t);
    else if(r==='notif')fn=()=>viewNotifs(t);
    else if(r==='notif-set')fn=()=>viewNotifSettings(t);
    else if(r==='chats')fn=()=>viewChats(t);
    else if(r==='c')fn=()=>viewChat(t,+a);
    else if(r==='g')fn=()=>viewChat(t,+a,true);
    else if(r==='ginfo')fn=()=>viewGroupInfo(t,+a);
    else if(r==='gnew')fn=()=>viewGroupNew(t,a,b);
    else if(r==='gfind')fn=()=>viewGroupFind(t);
    else if(r==='stickers')fn=()=>viewStickers(t);
    else if(r==='pack')fn=()=>viewPack(t,+a,b?decodeURIComponent(b):'');
    else if(r==='n')fn=()=>viewResolve(t,decodeURIComponent(a||''));
    else if(r==='search')fn=()=>viewSearch(t,a);
    else if(r==='saved')fn=()=>viewSaved(t);
    else if(r==='settings')fn=()=>viewSettings(t);
    else if(r==='blocks')fn=()=>viewBlocks(t);
    else fn=()=>viewFeed(t);
    await fn();
    if(my!==rid)return;
    v.innerHTML='';if(!soft){v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter')}v.appendChild(t);if(soft)v.scrollTop=st0;
    paintAv('#hdrAv2');chrome();
    if(r==='c'||r==='g'){v.style.overflow='hidden';t.style.height='100%';const lg=$('#log',t);if(lg)lg.scrollTop=lg.scrollHeight}else v.style.overflow='';
  }catch(e){if(my===rid&&!soft)v.innerHTML=`<div class="empty"><div class="big">${IC.bellbig}</div>${esc(e.message)}<br><br><button class="btn ghost" onclick="render()">Повторить</button></div>`}
}
/* ripple на кнопках */
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.btn,.tab,.send');if(!el||el.disabled)return;const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2;const s=document.createElement('span');s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;el.appendChild(s);setTimeout(()=>s.remove(),650)},{passive:true});
window.addEventListener('hashchange',render);
let pingT=0;setInterval(()=>{CALL.ensure();if(!S.token)return;const gap=document.hidden?40000:8000;if(Date.now()-pingT>=gap-500){pingT=Date.now();ping()}},4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.token){pingT=Date.now();ping();EXGPush.init()}});
(async()=>{applyTheme();if(!location.hash)location.hash=S.token?'#/':'#/login';
  try{if(BASE)await boot()}catch(e){}render();setTimeout(()=>EXGPush.launch(),400)})();
</script>
