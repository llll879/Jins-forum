:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastIO{0%{opacity:0;transform:translate(-50%,18px) scale(.94)}9%{opacity:1;transform:translate(-50%,0) scale(1)}86%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,10px) scale(.96)}}
@keyframes lbIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.55) rotate(-8deg)}55%{transform:scale(.88) rotate(4deg)}80%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ring{from{opacity:.7;transform:scale(.4)}to{opacity:0;transform:scale(2.2)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1.02)}50%{transform:translate3d(-6px,-5px,0) scale(1.05)}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg) translateY(0)}50%{transform:rotate(1.2deg) translateY(-4px)}}
@keyframes twinkle{0%,100%{filter:drop-shadow(0 0 6px rgba(200,190,255,.55));transform:scale(1) rotate(0)}50%{filter:drop-shadow(0 0 14px rgba(220,212,255,.95));transform:scale(1.12) rotate(14deg)}}
@keyframes shine{0%{transform:translateX(-130%) skewX(-18deg)}60%,100%{transform:translateX(230%) skewX(-18deg)}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(157,146,230,.65)}70%{box-shadow:0 0 0 9px rgba(157,146,230,0)}100%{box-shadow:0 0 0 0 rgba(157,146,230,0)}}
@keyframes pulseOk{0%{box-shadow:0 0 0 0 rgba(76,214,160,.7)}70%{box-shadow:0 0 0 8px rgba(76,214,160,0)}100%{box-shadow:0 0 0 0 rgba(76,214,160,0)}}
@keyframes badgePop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes glowAv{0%,100%{box-shadow:0 0 0 6px rgba(157,146,230,.14),0 0 38px rgba(157,146,230,.28)}50%{box-shadow:0 0 0 10px rgba(157,146,230,.08),0 0 56px rgba(157,146,230,.5)}}
@keyframes gem{0%,100%{filter:drop-shadow(0 0 3px var(--g))}50%{filter:drop-shadow(0 0 9px var(--g))}}
@keyframes sparkle{0%,70%,100%{opacity:0;transform:scale(0) rotate(0)}80%{opacity:1;transform:scale(1) rotate(90deg)}90%{opacity:0;transform:scale(.4) rotate(180deg)}}
@keyframes crownTilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes gemSpin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.78)}}
@keyframes rippleA{to{transform:scale(1);opacity:0}}
@keyframes borderGlow{0%,100%{border-color:var(--line2)}50%{border-color:rgba(157,146,230,.55)}}
@keyframes logoGlow{0%,100%{text-shadow:0 0 18px rgba(157,146,230,.2)}50%{text-shadow:0 0 34px rgba(190,180,255,.6)}}
@keyframes underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* вход на экран: сам экран + каскад карточек */
#view.enter{animation:fadeIn .28s var(--ease) both}
#view .post,#view .grow,#view .crow,#view .tcard,#view .cmt,#view .row,#view .hero,#view .compose-row,#view .pills,#view .stitle,#view .pick,#view .pad>.glass,#view .stats3,#view .ph2,#view .search-box,#view .emos{animation:fadeUp .5s var(--ease) backwards}
#view .tcard{animation-name:slideR}
#view .cmt.rep{animation-name:slideR}
#view .post:nth-child(2),#view .grow:nth-child(2),#view .crow:nth-child(2),#view .tcard:nth-child(2),#view .cmt:nth-child(2),#view .row:nth-child(2){animation-delay:.05s}
#view .post:nth-child(3),#view .grow:nth-child(3),#view .crow:nth-child(3),#view .tcard:nth-child(3),#view .cmt:nth-child(3),#view .row:nth-child(3){animation-delay:.1s}
#view .post:nth-child(4),#view .grow:nth-child(4),#view .crow:nth-child(4),#view .tcard:nth-child(4),#view .cmt:nth-child(4),#view .row:nth-child(4){animation-delay:.15s}
#view .post:nth-child(5),#view .grow:nth-child(5),#view .crow:nth-child(5),#view .tcard:nth-child(5),#view .cmt:nth-child(5),#view .row:nth-child(5){animation-delay:.2s}
#view .post:nth-child(6),#view .grow:nth-child(6),#view .crow:nth-child(6),#view .tcard:nth-child(6),#view .cmt:nth-child(6),#view .row:nth-child(6){animation-delay:.25s}
#view .post:nth-child(7),#view .grow:nth-child(7),#view .crow:nth-child(7),#view .tcard:nth-child(7),#view .cmt:nth-child(7),#view .row:nth-child(7){animation-delay:.3s}
#view .post:nth-child(8),#view .grow:nth-child(8),#view .crow:nth-child(8),#view .tcard:nth-child(8),#view .cmt:nth-child(8),#view .row:nth-child(8){animation-delay:.35s}
#view .compose-row{animation-delay:.05s}#view .pills{animation-delay:.1s}#view .hero{animation-delay:.15s}
.post.full{animation-name:fadeIn!important}

/* профиль */
.pavrow .av.xl{animation:popIn .6s var(--spring) both,glowAv 4.5s ease-in-out .7s infinite}
.pname{animation:fadeUp .6s var(--ease) .12s both}
.puser,.pstat,.pbio{animation:fadeUp .6s var(--ease) .2s both}
.stats3>div{animation:fadeUp .6s var(--ease) backwards}
.stats3>div:nth-child(2){animation-delay:.08s}.stats3>div:nth-child(3){animation-delay:.16s}
.pcover{animation:drift 14s ease-in-out infinite;transform-origin:70% 20%}
.pstat i{animation:pulseOk 2.2s ease-out infinite}
.stats3>div,.stats3 b{transition:transform .25s var(--ease),color .25s}
.stats3>div:active{transform:scale(.94)}

/* шапка, статуя, розы */
.mast .st{animation:drift 12s ease-in-out infinite}
.mast::before{transform-origin:20% 100%;animation:sway 9s ease-in-out infinite}
.brand .star{animation:twinkle 3.6s ease-in-out infinite}
.brand h1{animation:fadeUp .7s var(--ease) both}
.mh .ib{transition:transform .25s var(--spring),background .2s}
.mh .ib:active{transform:scale(.86)}
.mh .badge,.nav .badge,nav.bar .badge,.pill .badge{animation:badgePop .4s var(--spring) both}
.badge:not([hidden]){animation:badgePop .4s var(--spring) both,pulseDot 2.4s ease-out 1s infinite}
#app::after{transition:opacity .6s var(--ease)}
#app[data-page=chats]::after,#app[data-page=new]::after,#app[data-page=boards]::after{animation:floatY 8s ease-in-out infinite}

/* нажатия и наведение */
.ib,.act,.pill,.tab,.btn,.grow,.crow,.row,.post,.tcard,.hero,.compose-row,.pick,.send,.thumbs div,.pal i,.av,.cm-h{transition:transform .28s var(--spring),background .22s,border-color .22s,box-shadow .28s,filter .22s,color .22s,opacity .22s}
.ib:active,.pill:active,.tab:active,.send:active,.pal i:active{transform:scale(.9)}
.act:active{transform:scale(.88)}
.grow:active,.pick:active,.compose-row:active,.hero:active,.tcard:active{transform:scale(.975)}
.crow:active,.row:active{transform:scale(.985)}
.av:active{transform:scale(.92)}
.post:not(.full):active{transform:scale(.992)}
@media (hover:hover){
  .post:not(.full):hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 22px 44px -24px #000,0 0 0 1px rgba(157,146,230,.12),inset 0 1px 0 rgba(255,255,255,.07)}
  .grow:hover,.pick:hover,.compose-row:hover{transform:translateY(-2px);border-color:var(--line2);filter:brightness(1.15)}
  .tcard:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 16px 30px -16px rgba(0,0,0,.9)}
  .tcard .bg{transition:transform .6s var(--ease)}.tcard:hover .bg{transform:scale(1.12)}
  .hero .bgph{transition:transform .8s var(--ease)}.hero:hover .bgph{transform:scale(1.06)}
  .crow:hover,.row:hover{background:var(--card)}
  .act:hover{background:var(--card2);color:#fff}
  .ib:hover{background:var(--card2)}
  .pill:hover,.tab:hover{transform:translateY(-1px);border-color:var(--line2)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(120,100,230,1),inset 0 1px 0 rgba(255,255,255,.25)}
  .btn.ghost:hover,.btn.bad:hover{box-shadow:none}
  .av:hover{transform:scale(1.07)}
  .imgs .mt img{transition:transform .6s var(--ease)}.imgs .mt img:hover{transform:scale(1.05)}
  .pal i:hover{transform:scale(1.15)}
  nav.bar button:hover:not(.on){color:#fff}
}
.imgs{isolation:isolate}
.btn:active{transform:scale(.95)!important}

/* лайк / закладка / комментарии */
.act svg{transition:transform .2s var(--spring),fill .2s,color .2s}
.act.pop svg{animation:heartPop .55s var(--spring)}
.act.pop{position:relative}
.act.pop::after{content:"";position:absolute;left:10px;top:50%;width:21px;height:21px;margin-top:-10.5px;border-radius:50%;border:2px solid currentColor;pointer-events:none;animation:ring .55s ease-out forwards}
.act.on.sv.pop svg{animation:popIn .5s var(--spring)}
.cb .ca button svg{transition:transform .2s var(--spring)}
.cb .ca button.pop svg{animation:heartPop .55s var(--spring)}
.cm-h svg{transition:transform .3s var(--spring)}
.act span,.cb .ca button{transition:color .2s}

/* вкладки и пилюли */
.tab.on,.pill.on{animation:popIn .35s var(--spring)}
.tabs .tab{position:relative;overflow:hidden}

/* кнопки: блик и ripple */
.btn{position:relative;overflow:hidden}
.btn:not(.ghost):not(.bad):not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 4.5s ease-in-out 1.2s infinite;pointer-events:none}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rippleA .6s ease-out forwards;pointer-events:none}
.send,.tab{position:relative;overflow:hidden}
.send:not(:disabled){animation:borderGlow 3.5s ease-in-out infinite}

/* значки разработчика и админа */
.bi{--g:rgba(255,200,80,.6);transform-origin:50% 80%}
.bi.dev{--g:rgba(255,200,80,.75);animation:gem 2.8s ease-in-out infinite,crownTilt 5s ease-in-out 1s infinite;filter:none}
.bi.adm{--g:rgba(90,208,255,.8);animation:gem 2.8s ease-in-out .6s infinite,gemSpin 3.6s ease-in-out infinite;filter:none}

/* нижняя панель */
nav.bar{animation:fadeUp .6s var(--ease) .1s backwards}
nav.bar button svg{transition:transform .3s var(--spring)}
nav.bar button.on svg{transform:translateY(-2px) scale(1.12)}
nav.bar button{transition:color .25s,background .3s,transform .25s var(--spring)}
nav.bar button:active{transform:scale(.88)}
nav.bar .plus{transition:transform .4s var(--spring),box-shadow .3s,background .3s}
nav.bar .plus:hover{transform:rotate(90deg) scale(1.06)}
nav.bar .plus:active{transform:rotate(90deg) scale(.9)}
nav.bar .plus.on{transform:rotate(135deg)}

/* всплывающие окна */
.sheet-bg{animation:fadeIn .25s ease both}
.sheet{animation:sheetUp .38s var(--ease) both}
.sheet .row{animation:fadeUp .4s var(--ease) backwards}
.sheet .row:nth-child(2){animation-delay:.04s}.sheet .row:nth-child(3){animation-delay:.08s}.sheet .row:nth-child(4){animation-delay:.12s}.sheet .row:nth-child(5){animation-delay:.16s}.sheet .row:nth-child(n+6){animation-delay:.2s}
.toast{animation:toastIO 2.6s var(--ease) both}
.lb{animation:fadeIn .25s ease both}
.lb img{animation:lbIn .4s var(--ease) both}

/* прочее */
.spin{animation:sp .8s linear infinite,fadeIn .3s .15s both}
.empty{animation:fadeUp .6s var(--ease) both}
.empty .big{animation:floatY 3.6s ease-in-out infinite}
.dot{animation:pulseDot 2s ease-out infinite}
.unr{animation:badgePop .4s var(--spring) both}
.tag{animation:fadeIn .4s both}
.tag.pin{animation:gem 3s ease-in-out infinite;--g:rgba(255,200,80,.5)}
.th b svg{animation:floatY 3.2s ease-in-out infinite}
.inp,.search-box,.cform textarea{transition:border-color .25s,box-shadow .3s,background .25s}
.inp:focus,.cform textarea:focus{box-shadow:0 0 0 4px var(--acc-soft)}
.search-box:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.code{animation:borderGlow 2.8s ease-in-out infinite}
.login .logo{animation:fadeUp .8s var(--ease) both,logoGlow 4s ease-in-out 1s infinite}
.login>*:nth-child(2){animation:fadeUp .8s var(--ease) .12s both}
.login>*:nth-child(3){animation:fadeUp .8s var(--ease) .24s both}
.login>*:nth-child(4){animation:fadeUp .8s var(--ease) .36s both}
.login::before{animation:drift 14s ease-in-out infinite}
.thumbs div{animation:popIn .4s var(--spring) both}
.vf{animation:popIn .5s var(--spring) both}
.pal i.on{animation:popIn .35s var(--spring)}
.hero .go{transition:transform .35s var(--spring)}
.hero:hover .go{transform:translateX(4px)}
.hero .go svg{animation:floatY 2.8s ease-in-out infinite}
.hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;z-index:1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:shine 7s ease-in-out 2s infinite;pointer-events:none}

/* кнопки и активные вкладки следуют акцентному цвету / теме профиля */
.btn:not(.ghost):not(.bad),.tab.on{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 88%,#000),color-mix(in srgb,var(--acc) 70%,#000))}
/* =================== ПРОФИЛЬ (как в мини-аппе) =================== */
.avw{position:relative;display:inline-block}
.avw.on::after{content:"";position:absolute;right:10px;bottom:10px;width:20px;height:20px;border-radius:50%;background:var(--ok);border:3px solid var(--bg);animation:pulseOk 2.2s ease-out infinite}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:#c9c4e0;font-size:12.5px;font-weight:600;transition:all .22s var(--spring)}
.chip svg{width:15px;height:15px}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--txt)}
.chip:active{transform:scale(.93)}
[data-theme=light] .chip{color:var(--dim)}
.chip.rpb{margin-top:10px;height:28px;font-size:12px;color:var(--dim)}
.bdgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bdg{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:13px;font-size:12px;font-weight:700;background:rgba(76,214,160,.14);color:var(--ok);animation:popIn .5s var(--spring) both}
.bdg.bad{background:rgba(255,92,108,.15);color:var(--bad)}
.bchip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:30px;padding:0 13px;border-radius:15px;font-size:12.5px;font-weight:700;background:var(--card2);border:1px solid var(--line2)}
.bchip[class*="t-"]{color:var(--txt)}
.blk-note{margin-top:12px;padding:9px 14px;border-radius:14px;background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.3);color:var(--bad);font-size:13.5px}
.stats3.alt{margin-top:0;border-top:1px solid var(--line);padding-top:14px}
.grow .gi.role{background:none;border:0;width:44px}
.grow .gi.role .bi{width:32px;height:32px;margin:0}
.ptabs{display:flex;gap:8px;padding:18px 14px 4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.ptabs::-webkit-scrollbar{display:none}
.ptabs .tab{flex:none}
.card-l{margin:0 14px;border-radius:20px;padding:4px 16px}
.hist{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hist b{text-align:right;font-weight:700}
.hist small{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:2px}
.rv-sum{display:flex;align-items:center;gap:18px;padding:18px;border-radius:24px;margin:10px 14px 12px}
.rv-big{text-align:center;flex:none}
.rv-big b{display:block;font-family:var(--serif);font-size:42px;line-height:1}
.rv-big small{display:block;color:var(--dim);font-size:12px;margin-top:4px}
.stars{color:#f1b94d;letter-spacing:1px;font-size:15px;flex:none}
.rv-bars{flex:1;min-width:0;display:grid;gap:5px}
.rv-bars div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.rv-bars div span:first-child{width:10px;text-align:right}
.rv-bars i{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.rv-bars i u{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f1b94d,#e4aa42);transform-origin:left;animation:underline .9s var(--ease) .2s backwards}
.rv-bars div span:last-child{width:18px}
.rcard{padding:14px 16px;margin:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--glass)}
.rcard-h{display:flex;align-items:center;gap:12px}
.rcard-h>div:not(.av):not(.stars){min-width:0;flex:1}
.rcard-h b{display:block;font-size:15px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard-h small{color:var(--dim);font-size:12px}
.rcard p{margin:10px 0 0;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.rcard .rv-photo{display:block;margin-top:10px;max-width:100%;max-height:260px;border-radius:16px;border:1px solid var(--line);cursor:zoom-in}
.mine-tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-size:11px;font-weight:700}
.rform{padding:20px 18px 18px;margin:10px 14px 12px;border-radius:26px;border:1px solid var(--line2);background:linear-gradient(160deg,var(--acc-soft),transparent 60%),var(--glass)}
.rform h3{margin:0 0 4px;font-size:19px;font-family:var(--serif)}
.rform .rsub{margin:0 0 14px;color:var(--dim);font-size:13.5px}
.rstars{display:flex;justify-content:center;gap:6px;margin:4px 0 6px}
.rstars button{border:0;background:transparent;padding:2px;font-size:40px;line-height:1;color:var(--line2);transition:transform .25s var(--spring),color .15s}
.rstars button.on{color:#f1b94d;text-shadow:0 4px 14px rgba(241,185,77,.5)}
.rstars button:active{transform:scale(.8)}
.rlabel{text-align:center;color:var(--dim);font-size:13.5px;margin-bottom:12px;min-height:20px}
.rcount{text-align:right;color:var(--dim);font-size:12px;margin:4px 4px 0}
.rshot{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;border-radius:16px;border:1px dashed var(--line2);color:var(--dim);cursor:pointer;font-size:14px}
.rshot small{display:block;font-size:12px;opacity:.8}
.rshot .ri svg{width:24px;height:24px}
.rshot img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.rshot .rx{margin-left:auto;border:0;background:var(--card2);color:var(--txt);width:28px;height:28px;border-radius:50%}
.sheet.rep{padding:18px 16px calc(16px + var(--safe-b))}
.sheet .sh-t{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 4px 14px}
.thumbs div img{display:block}
.ed-card{padding:16px;border-radius:22px;margin-bottom:6px}
.ed-av{display:flex;align-items:center;gap:16px}
.ed-btns{display:flex;gap:8px;flex-wrap:wrap}
.ed-ban{position:relative;overflow:hidden;margin-top:14px;height:110px;border-radius:16px;border:1px dashed var(--line2);background:var(--card) center/cover no-repeat;display:grid;place-items:center;color:var(--dim);font-size:13px}
.ed-ban span{display:flex;align-items:center;gap:8px}
.ed-ban span svg{width:20px;height:20px}
.ed-ban.has span{display:none}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 8px;border-radius:19px;border:1px solid var(--line);background:var(--glass);color:var(--txt);font-size:13.5px;font-weight:600;transition:all .22s var(--spring)}
.tchip span{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2)}
.tchip.on{border-color:var(--acc);background:var(--acc-soft)}
.tchip:active{transform:scale(.94)}
.pal input[type=color]{width:36px;height:36px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;cursor:pointer}
#view .rcard,#view .rform,#view .rv-sum,#view .card-l,#view .bdgs,#view .chips-row,#view .bchip,#view .blk-note{animation:fadeUp .5s var(--ease) backwards}
@media (hover:hover){.rcard:hover{border-color:var(--line2)}.chip:hover,.tchip:hover{border-color:var(--line2);transform:translateY(-1px)}}

/* уважаем настройку «уменьшить анимацию» */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/*KV-CSS:BEGIN*/
/* ===== голосовые сообщения (источник: tools/voice/voice.css) ===== */
.vm{display:flex!important;align-items:center;gap:11px;width:min(292px,78vw);min-width:220px;padding:9px 14px 7px 9px!important;white-space:normal!important;
  --vc:var(--acc,#9d92e6);--vd:rgba(255,255,255,.26)}
.vm[data-mine="1"]{--vc:#fff;--vd:rgba(255,255,255,.4)}
[data-theme=light] .vm:not([data-mine="1"]){--vd:rgba(20,16,10,.2)}
.vm .vp{flex:none;width:44px;height:44px;border-radius:50%;border:0;padding:0;margin:0;display:grid;place-items:center;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#9f95e4,#6d64b6);box-shadow:0 5px 14px -5px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.vm .vp:active{transform:scale(.88)}
.vm .vp svg{display:block;margin-left:1px}
.vm.playing .vp svg{margin-left:0}
.vm[data-mine="1"] .vp{background:#fff;color:var(--kv-mine-ink,#5d559c);box-shadow:0 5px 14px -6px rgba(0,0,0,.5)}
.vm.playing .vp{box-shadow:0 0 0 5px color-mix(in srgb,var(--vc) 22%,transparent),0 5px 14px -5px rgba(0,0,0,.5)}
.vm .vc{flex:1;min-width:0}
.vm .vw{position:relative;height:34px;cursor:pointer;touch-action:none;--p:0;-webkit-user-select:none;user-select:none}
.vm .vwv{display:block;width:100%;height:100%;
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:linear-gradient(90deg,var(--vc) calc(var(--p)*100%),var(--vd) calc(var(--p)*100%))}
.vm .vi{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1;margin-top:3px;min-height:16px}
.vm .vt{font-variant-numeric:tabular-nums;opacity:.88}
.vm .vi small{display:block;margin:0 0 0 auto!important;font-size:10.5px;opacity:.68;text-align:right;white-space:nowrap}
.vm .vdot{display:none;flex:none;width:7px;height:7px;border-radius:50%;background:var(--vc)}
.vm[data-heard="0"]:not([data-mine="1"]) .vdot{display:block}
.vm .vs{border:0;border-radius:9px;padding:3px 7px;font-weight:700;font-size:11px;line-height:1;font-family:inherit;color:inherit;background:rgba(255,255,255,.18);cursor:pointer;min-width:30px}
[data-theme=light] .vm:not([data-mine="1"]) .vs{background:rgba(20,16,10,.08)}
.vm .vs[hidden]{display:none}
.vm[data-pending]{opacity:.72}
.vm[data-pending] .vp{pointer-events:none}
.vm[data-pending] .vp svg{display:none}
.vm[data-pending] .vp::after{content:"";width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:kvspin .8s linear infinite}
@keyframes kvspin{to{transform:rotate(360deg)}}

/* кнопка микрофона вместо «отправить», когда поле пустое */
.kv-txt .kv-mic{display:none!important}
.kv-on:not(.kv-txt) .kv-sb{display:none!important}
.kv-mic{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;z-index:6;cursor:pointer;
  transition:transform .22s cubic-bezier(.22,1,.36,1),background .2s,box-shadow .25s}
.kv-mic svg{pointer-events:none}
.kv-mic.hold{background:linear-gradient(180deg,#ff7482,#e0394c)!important;box-shadow:0 0 0 12px rgba(255,92,108,.18),0 8px 22px -6px rgba(255,92,108,.65)!important;animation:none!important}
.kv-locked .kv-mic{animation:none}

/* панель записи поверх поля ввода */
.kv-rec{position:absolute;z-index:5;display:flex;align-items:center;gap:10px;padding:0 16px 0 12px;border-radius:26px;overflow:hidden;
  background:var(--solid,var(--bg,#12101a));border:1px solid var(--line2,rgba(255,255,255,.18));box-shadow:0 10px 30px -14px #000;
  opacity:0;transition:opacity .2s,transform .12s linear;transform:translateX(0)}
.kv-rec.in{opacity:1;animation:kvIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes kvIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.kv-rec[hidden],.kv-lock[hidden]{display:none!important}
.kv-rec .kv-x{display:none;flex:none;width:36px;height:36px;border-radius:50%;border:0;padding:0;place-items:center;color:var(--bad,#ff5c6c);background:rgba(255,92,108,.12);cursor:pointer}
.kv-rec.locked .kv-x{display:grid;margin-left:-4px}
.kv-rec .kv-dot{flex:none;width:11px;height:11px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 0 rgba(255,77,94,.55);animation:kvPulse 1.2s ease-out infinite}
.kv-rec.locked .kv-dot{width:9px;height:9px}
@keyframes kvPulse{0%{box-shadow:0 0 0 0 rgba(255,77,94,.55)}100%{box-shadow:0 0 0 10px rgba(255,77,94,0)}}
.kv-rec .kv-t{flex:none;font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:600;min-width:52px;color:var(--txt,#f4f2fb)}
.kv-rec .kv-cv{flex:1;min-width:30px;height:60%;display:block}
.kv-rec .kv-hint{flex:none;font-size:13.5px;color:var(--dim,#8f8aa6);white-space:nowrap;animation:kvHint 1.6s ease-in-out infinite;transition:color .15s}
.kv-rec .kv-hint.bad{color:var(--bad,#ff5c6c)}
.kv-rec.locked .kv-hint{display:none}
@keyframes kvHint{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.kv-lock{position:absolute;z-index:6;bottom:calc(100% + 6px);width:38px;height:62px;border-radius:19px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;
  color:var(--txt,#f4f2fb);background:var(--solid,#12101a);border:1px solid var(--line2,rgba(255,255,255,.18));box-shadow:0 10px 24px -10px #000;
  animation:kvLock .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes kvLock{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kv-recording textarea{visibility:hidden}
@media (prefers-reduced-motion:reduce){.kv-rec,.kv-rec *,.kv-lock{animation:none!important;transition:none!important}}

/* ===== кружки (видеосообщения) ===== */
.kn{display:block;position:relative;align-self:flex-start;margin:3px 0;-webkit-tap-highlight-color:transparent}
.kn.me{align-self:flex-end}
.kn .kn-c{position:relative;width:min(60vw,236px);aspect-ratio:1;border-radius:50%;cursor:pointer;--p:0;-webkit-user-select:none;user-select:none;
  box-shadow:0 16px 36px -16px rgba(0,0,0,.8);transition:transform .38s cubic-bezier(.34,1.56,.64,1)}
.kn.playing .kn-c{transform:scale(1.045)}
.kn .kn-v{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;box-sizing:border-box;border:2px solid rgba(255,255,255,.16);
  background:radial-gradient(circle at 35% 30%,#2e2a46,#12101a)}
.kn .kn-r{position:absolute;left:-6px;top:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none;opacity:0;transform:rotate(-90deg);transition:opacity .25s}
.kn.playing .kn-r{opacity:1}
.kn .kn-r circle{fill:none;stroke:var(--acc,#9d92e6);stroke-width:2.8;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:calc(289 - 289 * var(--p))}
.kn .kn-t,.kn .kn-tm{position:absolute;display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:12px;color:#fff;font-weight:600;
  background:rgba(10,8,18,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;pointer-events:none}
.kn .kn-t{left:10px;top:10px;font-size:12.5px}
.kn .kn-tm{right:12px;bottom:12px;font-size:11px;font-weight:500;padding:2px 8px}
.kn[data-heard="0"]:not([data-mine="1"]) .kn-t::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc,#9d92e6);box-shadow:0 0 0 2px rgba(255,255,255,.28)}
.kn .kn-pl{position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;pointer-events:none;
  background:rgba(10,8,18,.46);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.kn .kn-pl svg{margin-left:2px}
.kn.playing .kn-pl{opacity:0;transform:scale(.6)}
.kn[data-pending] .kn-c{opacity:.8;cursor:default}
.kn[data-pending] .kn-pl{background:transparent}
.kn[data-pending] .kn-pl svg{display:none}
.kn[data-pending] .kn-pl::after{content:"";width:30px;height:30px;border-radius:50%;border:3px solid #fff;border-top-color:transparent;animation:kvspin .8s linear infinite}

/* превью при записи кружка + кольцо времени */
.kv-circ{position:absolute;z-index:4;left:50%;bottom:calc(100% + 18px);width:min(66vw,264px);aspect-ratio:1;transform:translateX(-50%);animation:kvCirc .38s cubic-bezier(.34,1.56,.64,1)}
@keyframes kvCirc{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.kv-circ[hidden]{display:none!important}
.kv-circ video{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;transform:scaleX(-1);background:#0c0a14;box-shadow:0 22px 54px -14px #000,0 0 0 3px rgba(255,255,255,.08)}
.kv-circ svg{position:absolute;left:-7px;top:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);pointer-events:none}
.kv-circ circle{fill:none;stroke-width:2.6;stroke-linecap:round}
.kv-circ .bg{stroke:rgba(255,255,255,.16)}
.kv-circ .fg{stroke:#ff4d5e;stroke-dasharray:301.6;stroke-dashoffset:301.6}
.kv-mic.kv-swap svg{animation:kvSwap .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes kvSwap{from{transform:scale(.35) rotate(-70deg);opacity:0}to{transform:none;opacity:1}}
/* подсказка у кнопки записи (как в Telegram) */
.kv-tip{position:absolute;z-index:8;bottom:calc(100% + 10px);max-width:calc(100% - 16px);padding:10px 14px;border-radius:14px;pointer-events:none;
  display:flex;flex-direction:column;gap:2px;text-align:left;font-size:13px;line-height:1.3;color:#f4f2fb;
  background:rgba(28,25,42,.96);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px -10px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transform:translateY(6px) scale(.96);transform-origin:calc(100% - var(--ax,24px)) 100%;
  transition:opacity .22s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.kv-tip.in{opacity:1;transform:none}
.kv-tip[hidden]{display:none}
.kv-tip b{font-weight:650;font-size:13.5px;white-space:nowrap}
.kv-tip span{opacity:.72;white-space:nowrap}
.kv-tip::after{content:"";position:absolute;right:calc(var(--ax,24px) - 6px);bottom:-6px;width:12px;height:12px;background:inherit;border:inherit;border-width:0 1px 1px 0;border-radius:0 0 4px 0;transform:rotate(45deg)}
[data-theme=light] .kv-tip{background:rgba(32,28,44,.95)}
@media (prefers-reduced-motion:reduce){.kv-tip{transition:opacity .15s;transform:none}}
/*KV-CSS:END*/

/* ===== действия с сообщениями в личных чатах (как в мини-аппе) ===== */
.chat-log{position:relative}
.mrow{display:flex;flex-direction:column;align-items:flex-start;align-self:flex-start;max-width:80%;position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mrow.me{align-self:flex-end;align-items:flex-end}
.mrow.mm{max-width:min(310px,80%)}
.mrow>.msg.msg{align-self:auto;max-width:100%}
.mrow>.kn{align-self:auto}
.mrow.swp{transition:none}
.mrow.sb{transition:transform .32s cubic-bezier(.22,1,.36,1)}
.mrow.lp{transform:scale(.975);transition:transform .2s}
.mrow.hl>.msg,.mrow.hl>.kn{outline:2px solid var(--acc);outline-offset:1px}
.mrow.flash>.msg{animation:mFlash .9s ease}


/* ===== поиск, черновики, закреп / без звука / архив ===== */
mark.sm{background:rgba(255,214,90,.42);color:inherit;border-radius:4px;padding:0 1px}
mark.sm.cur{background:#ffd65a;color:#1b1630;box-shadow:0 0 0 2px rgba(255,214,90,.45)}
.sbar{display:flex;align-items:center;gap:2px;padding:8px 6px 8px 14px;border-bottom:1px solid var(--line);flex:none}
.sbar[hidden]{display:none}
.sbar input{flex:1;min-width:0;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line2);background:var(--glass);color:var(--txt);font:inherit;font-size:16px;outline:0}
.sbar input:focus{border-color:var(--acc)}
.sbar #sCnt{flex:none;min-width:48px;text-align:center;font-size:12.5px;color:var(--dim);white-space:nowrap;padding:0 4px}
.sbar .ib{width:38px;height:38px}
.sbar #sUp svg{transform:rotate(-90deg)}.sbar #sDn svg{transform:rotate(90deg)}
.chat.selmode .sbar{display:none}
.crow .dr{color:var(--bad);font-weight:550}
.crow .mu{display:inline-flex;color:var(--dim)}.crow .mu svg{width:15px;height:15px}
.crow .pn{display:inline-flex;margin-top:6px;color:var(--dim)}.crow .pn svg{width:16px;height:16px;transform:rotate(35deg)}
.dot.mute{background:var(--dim);box-shadow:none;animation:none}
.crow.arc .av{display:grid;place-items:center;background:var(--card2);color:var(--dim);width:52px;height:52px;border-radius:50%;flex:none}
.crow.arc .av svg{width:24px;height:24px}
.crow .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--card2);color:var(--dim);font-size:12px;line-height:20px;text-align:center}
.sec.sp{margin-top:6px}
.cl-empty{padding:28px 20px;text-align:center;color:var(--dim)}
/* ===== реакции на сообщения и выбор нескольких сообщений ===== */
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin:3px 2px 0;max-width:100%}
.mrow.me .rxs{justify-content:flex-end}
.rx{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);color:var(--txt);font:inherit;font-size:14px;line-height:1;cursor:pointer;animation:rxIn .35s var(--spring) both;-webkit-tap-highlight-color:transparent}
.rx b{font-size:12px;font-weight:650;color:var(--dim)}
.rx.on{border-color:var(--acc);background:rgba(125,116,194,.28);background:color-mix(in srgb,var(--acc) 24%,transparent)}
.rx.on b{color:var(--txt)}
@keyframes rxIn{from{transform:scale(.4);opacity:0}}
.rxbar{display:flex;gap:2px;justify-content:space-between;padding:2px 4px 10px;margin:0 2px 6px;border-bottom:1px solid var(--line2)}
.rxbar button{flex:1;min-width:0;height:48px;border:0;background:transparent;border-radius:14px;font-size:27px;line-height:1;cursor:pointer;transition:transform .2s var(--spring),background .15s;-webkit-tap-highlight-color:transparent}
.rxbar button:active{transform:scale(1.28)}
.rxbar button.on{background:rgba(125,116,194,.3);background:color-mix(in srgb,var(--acc) 26%,transparent)}
.rxpop{position:absolute;left:50%;top:50%;font-size:46px;line-height:1;pointer-events:none;z-index:3;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));animation:rxPop .8s ease-out forwards}
@keyframes rxPop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-62%) scale(1.25);opacity:1}60%{transform:translate(-50%,-72%) scale(1);opacity:1}100%{transform:translate(-50%,-115%) scale(1);opacity:0}}
.mrow>.ck{display:none;position:absolute;left:14px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:2px solid var(--dim);box-sizing:border-box;transition:background .15s,border-color .15s}
.selm .mrow>.ck{display:block}
.mrow.sl>.ck{background:var(--acc);border-color:var(--acc)}
.mrow.sl>.ck::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chat-log.selm .mrow{align-self:stretch;width:calc(100% + 28px);max-width:calc(100% + 28px);margin:0 -14px;box-sizing:border-box;padding:3px 14px 3px 50px;cursor:pointer;transform:none}
.chat-log.selm .mrow>*{pointer-events:none}
.chat-log.selm .mrow>.msg.msg{max-width:82%}
.chat-log.selm .mrow.sl{background:rgba(125,116,194,.16);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.selh,.sela{display:none}
.chat.selmode .chat-h,.chat.selmode .cform,.chat.selmode .rpbar{display:none!important}
.chat.selmode .selh{display:flex;flex:none;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 12px 10px;border-bottom:1px solid var(--line)}
.selh b{font-size:16.5px;font-weight:650}
.chat.selmode .sela{display:flex;flex:none;gap:10px;padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg)}
.sela .btn{flex:1;padding:0 12px}
.sela .btn:disabled{opacity:.45}
.sela .btn svg{width:19px;height:19px}
@keyframes mFlash{0%,100%{filter:none}30%{filter:brightness(1.4)}}
/* мгновенная отправка: пузырь появляется сразу, сервер догоняет в фоне */
@keyframes msgIn{from{opacity:0;transform:translateY(16px) scale(.9)}55%{opacity:1}to{opacity:1;transform:none}}
.mrow.in{animation:msgIn .28s cubic-bezier(.2,.9,.3,1.15);transform-origin:100% 100%}
.mrow.in:not(.me){transform-origin:0 100%}
.sti{display:inline-block;width:9px;height:9px;margin-left:3px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-1px;animation:sp .75s linear infinite;box-sizing:border-box}
.mrow.fail{cursor:pointer}
.mrow.fail>.msg,.mrow.fail>.stk{outline:1.5px solid #ff5a6a;outline-offset:1px}
.mrow.fail small{color:#ff9aa4;opacity:1}
.cmt{transition:opacity .25s}
.cmt.pend{opacity:.6}
.cmt.pend .ca{pointer-events:none}
@media (prefers-reduced-motion:reduce){.mrow.in{animation:none}}
.mrow.gone{transition:opacity .25s,transform .3s,max-height .3s .15s,margin .3s .15s;opacity:0;transform:scale(.85);max-height:0!important;margin:-4px 0;overflow:hidden;pointer-events:none}
.swr{position:absolute;right:12px;width:32px;height:32px;margin-top:-16px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--txt);opacity:0;transform:scale(.4);pointer-events:none;z-index:0;transition:background .15s,color .15s}
.swr svg{width:18px;height:18px}
.swr.hit{background:var(--acc);color:#fff}
.swr.pop{animation:swPop .26s var(--spring,ease)}
.swr.out{transition:opacity .22s,transform .22s;opacity:0!important;transform:scale(.4)!important}
@keyframes swPop{0%{scale:1}45%{scale:1.28}100%{scale:1}}
.rq{margin:0 0 4px;padding:3px 8px;border-left:3px solid var(--acc);border-radius:4px;background:rgba(127,127,127,.16);cursor:pointer;font-size:13.5px;line-height:1.3;max-width:100%;white-space:normal;text-align:left}
.rq b{display:block;font-size:13px;color:var(--acc)}
.rq span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.85}
.rq.gone{opacity:.6;font-style:italic}
.msg.me .rq{border-left-color:#fff;background:rgba(255,255,255,.2)}
.msg.me .rq b{color:#fff}
.msg.mm .rq{margin:4px 5px 6px}
.rq.solo{background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--acc);margin:0 0 3px;padding:4px 10px}
.fw{margin:0 0 3px;font-size:13px;color:var(--acc);text-align:left;white-space:normal}
.fw b{font-weight:700}
.msg.me .fw{color:#fff;opacity:.9}
.msg.mm .fw{margin:4px 8px 2px}
.fw.solo{margin:0 4px 2px}
/* предпросмотр ссылок в пузырях */
.lkp{display:none}
.lkp.on{display:block;width:min(290px,66vw);margin-top:6px;white-space:normal;text-align:left;line-height:1.3}
.lkc{display:block;color:inherit;text-decoration:none!important;border-left:3px solid var(--acc);border-radius:6px 12px 12px 6px;background:rgba(127,127,127,.16);overflow:hidden}
.lkt{display:block;padding:6px 10px 7px}
.lks{display:block;font-size:12px;font-weight:700;color:var(--acc);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lkt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.28;margin-top:1px}

<body>
<div id="app"><div class="login"><div class="logo">KMBP <b>FORUM</b></div></div></div>
<script>
"use strict";
/* ============ настройки сервера ============
   Адрес вписывается автоматически, когда файл скачан с вашего сайта (/forum/app.html?dl=1).
   Если файл открыт локально (в APK) и адрес пуст — приложение само спросит адрес сервера. */
const SERVER0="__BASE__";

/* ---------- хранилище (работает даже если localStorage недоступен) ---------- */
const mem={};
const ls={get(k){try{return localStorage.getItem('kf_'+k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem('kf_'+k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem('kf_'+k)}catch(e){delete mem[k]}}};
/* ---------- разрешения (в Android-приложении — системное окно; в браузере спрашивает сам браузер) ---------- */
const EXGPerm=window.EXGPerm={
  native(){return window.ExgNative||null},
  /* kinds: 'mic' | 'cam' | 'notif' → true, если всё выдано */
  async ensure(kinds){
    const N=window.ExgNative;if(!N)return true;
    kinds=[].concat(kinds||[]);
    try{
      if(kinds.every(k=>N.has(k)))return true;
      const ok=await new Promise(res=>{const id='p'+Date.now()+Math.random().toString(36).slice(2,6);
        (window.__exgPerm=window.__exgPerm||{})[id]=res;N.request(kinds.join(','),id);setTimeout(()=>{if(window.__exgPerm[id]){delete window.__exgPerm[id];res(kinds.every(k=>N.has(k)))}},60000)});
      return !!ok}catch(e){return true}},
  settings(){try{window.ExgNative&&window.ExgNative.openSettings()}catch(e){}}
};
window.__exgPermDone=(id,ok)=>{const m=window.__exgPerm||{};const f=m[id];if(f){delete m[id];f(!!ok)}};
/* ---------- системные push (Android, FCM): звонки и уведомления даже при ЗАКРЫТОМ приложении ----------
   Нативная часть — tools/android_patch.py (ExgMessagingService, IncomingCallActivity). Здесь: регистрация токена на сервере
   и обработка запуска из уведомления (открыть чат / принять звонок). */
const EXGPush=window.EXGPush={
  t:0,
  ok(){const N=window.ExgNative;return !!(N&&typeof N.fcmInit==='function')},
  on(){return ls.get('fcm')==='1'},
  async init(force){
    const N=window.ExgNative;if(!this.ok()||!S.token||!S.me)return;
    try{
      N.setAuth(BASE,S.token);                                   // чтобы «Отклонить» в уведомлении работало без открытия приложения
      if(ls.get('sys')==='0')return;                             // пользователь выключил системные уведомления
      if(!force&&Date.now()-this.t<600000)return;
      if(!N.has('notif')){
        if(!force&&ls.get('push_asked')==='1')return;ls.set('push_asked','1');
        if(!(await EXGPerm.ensure('notif')))return}
      if(ls.get('sys')===null)ls.set('sys','1');
      this.t=Date.now();N.fcmInit()}catch(e){}},
  reg(t){if(!t||!S.token)return;post_('/push/register',{token:t}).then(r=>{ls.set('fcm',r&&r.enabled?'1':'0')}).catch(()=>{})},
  off(){ls.set('fcm','0');if(S.token)post_('/push/unregister',{}).catch(()=>{})},
  /* открыли приложение из уведомления: {href, call, act:'accept', video} */
  launch(){
    const N=window.ExgNative;if(!N||typeof N.takeLaunch!=='function')return;
    let o=null;try{const j=N.takeLaunch();o=j?JSON.parse(j):null}catch(e){}
    if(!o)return;
    const go=()=>{if(o.href)location.hash=o.href;if(o.call&&o.act==='accept')CALL.joinCall(o.call,!!o.video)};
    if(S.token&&S.me)go();else{let n=0;const iv=setInterval(()=>{if(S.token&&S.me){clearInterval(iv);go()}else if(++n>80)clearInterval(iv)},250)}}
};
window.__exgFcm=t=>EXGPush.reg(t);
window.__exgLaunch=()=>{try{EXGPush.launch();EXGPush.init()}catch(e){}};
/*KV-JS:BEGIN*/
const KV=(()=>{
'use strict';
const CH='0123456789abcdefghijklmnopqrstuv',N=48,MIN_MS=700,MAX_MS=600000,SPEEDS=[1,1.5,2];
let cfg={heard(){},toast(){}};
const A=new Audio();A.preload='none';
let cur=null,raf=0,speed=1;
try{speed=parseFloat(localStorage.getItem('kv_speed'))||1}catch(e){}
if(SPEEDS.indexOf(speed)<0)speed=1;
const svg=(b,w)=>`<svg viewBox="0 0 24 24" width="${w||22}" height="${w||22}" aria-hidden="true">${b}</svg>`;
const st='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const IC_PLAY=svg('<path fill="currentColor" d="M8.2 5.3v13.4a1 1 0 0 0 1.5.86l10.6-6.7a1 1 0 0 0 0-1.72L9.7 4.44a1 1 0 0 0-1.5.86z"/>');
const IC_PAUSE=svg('<rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/>');
const IC_MIC=svg(`<g ${st}><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></g>`);
const IC_SEND=svg(`<g ${st} stroke-width="2.3"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></g>`);
const IC_TRASH=svg(`<g ${st}><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 1.8h6a2 2 0 0 0 2-1.8l1-12M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/></g>`,20);
const IC_CAM=svg(`<g ${st}><rect x="3" y="6.5" width="13" height="11" rx="3"/><path d="m16 11 5-3v8l-5-3z"/></g>`);
const IC_LOCK=svg(`<g ${st}><rect x="5" y="11" width="14" height="9.5" rx="2.4"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>`,17);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const spd=x=>(x===1?'1':String(x))+'×';
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ---------- волна ---------- */
const maskCache=new Map();
function decode(w){const a=[];for(const c of String(w||'')){const v=CH.indexOf(c);a.push(v<0?4:v)}return a.length>=4?a:new Array(N).fill(5)}
function maskUrl(w){let m=maskCache.get(w);if(m)return m;const a=decode(w),n=a.length;let r='';
  a.forEach((v,i)=>{const h=Math.max(3,Math.round(3+v/31*27));r+=`<rect x="${i*3}" y="${(32-h)/2}" width="2" height="${h}" rx="1"/>`});
  m='url("data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n*3-1} 32" preserveAspectRatio="none">${r}</svg>`)+'")';
  if(maskCache.size>300)maskCache.clear();maskCache.set(w,m);return m}
function waveStr(levels){ // levels: 0..1, любое число значений -> строка из N символов
  const n=levels.length;if(!n)return CH[3].repeat(N);const out=[];
  for(let i=0;i<N;i++){const a=i*n/N,b=Math.max(a+1,(i+1)*n/N);let s=0,c=0,mx=0;
    for(let j=Math.floor(a);j<Math.min(n,Math.ceil(b));j++){s+=levels[j];c++;mx=Math.max(mx,levels[j])}
    out.push(c?(s/c)*.55+mx*.45:levels[Math.min(n-1,Math.floor(a))])}
  const pk=Math.max.apply(null,out.concat([.06]));
  return out.map(v=>CH[Math.max(1,Math.min(31,Math.round(Math.pow(v/pk,.7)*31)))]).join('')}

/* ---------- разметка сообщения ---------- */
function inner(v){return `<button class="vp" type="button" aria-label="Воспроизвести">${IC_PLAY}</button><div class="vc"><div class="vw" data-w="${esc(v.wave||'')}"><i class="vwv"></i></div><div class="vi"><span class="vt">${fmtT(v.dur)}</span><i class="vdot"></i><button class="vs" type="button" hidden>${spd(speed)}</button>${v.meta?`<small>${v.meta}</small>`:''}</div></div>`}
function bubble(cls,v){return `<div class="${esc(cls)} vm" data-id="${esc(v.id)}" data-url="${esc(v.url||'')}" data-dur="${v.dur|0}" data-heard="${v.heard?1:0}" data-mine="${v.mine?1:0}"${v.pending?' data-pending="1"':''}>${inner(v)}</div>`}
const setP=(el,p)=>{const w=el.querySelector('.vw');if(w)w.style.setProperty('--p',p)};
const durOf=el=>Math.max(1,parseInt(el.dataset.dur,10)||1);

function paint(el,playing){
  if(!el)return;const b=el.querySelector('.vp');
  if(el._pl!==playing){el._pl=playing;b.innerHTML=playing?IC_PAUSE:IC_PLAY;b.setAttribute('aria-label',playing?'Пауза':'Воспроизвести')}
  el.classList.toggle('playing',playing);
  const s=el.querySelector('.vs');if(s){s.hidden=!(cur&&cur.el===el);s.textContent=spd(speed)}}
function bind(root){
  root.querySelectorAll('.vm').forEach(el=>{
    const w=el.querySelector('.vw');if(w&&!w.dataset.m){w.dataset.m=1;w.style.setProperty('--m',maskUrl(w.dataset.w))}
    if(cur&&cur.id===el.dataset.id){cur.el=el;el._pl=null;paint(el,!A.paused);const t=A.currentTime*1000;setP(el,Math.min(1,t/cur.dur));el.querySelector('.vt').textContent=fmtT(t)}});
  root.querySelectorAll('.kn').forEach(el=>{
    if(curN&&curN.id===el.dataset.id){const nv=el.querySelector('.kn-v');if(nv&&nv!==curN.v)nv.replaceWith(curN.v); // играющее видео переезжает в новый пузырь (в том же такте — не прерывается)
      curN.el=el;el.classList.toggle('playing',!curN.v.paused);const t=curN.v.currentTime*1000;nP(el,Math.min(1,t/curN.dur));el.querySelector('.kn-t').textContent=fmtT(t)}});
  listen(root)}

/* ---------- плеер ---------- */
function tick(){raf=0;if(!cur||A.paused)return;const t=A.currentTime*1000;setP(cur.el,Math.min(1,t/cur.dur));cur.el.querySelector('.vt').textContent=fmtT(t);raf=requestAnimationFrame(tick)}
function reset(el){if(!el)return;paint(el,false);setP(el,0);const t=el.querySelector('.vt');if(t)t.textContent=fmtT(durOf(el));const s=el.querySelector('.vs');if(s)s.hidden=true}
function stop(){if(!cur)return;const c=cur;cur=null;try{A.pause()}catch(e){}reset(c.el)}
function nextUnheard(el){const all=Array.prototype.slice.call(document.querySelectorAll('.vm')),i=all.indexOf(el);for(let k=i+1;k<all.length;k++){const n=all[k];if(n.dataset.mine!=='1'&&n.dataset.heard==='0'&&n.dataset.url)return n}return null}
function begin(el,r){
  nStop();

  cur={id:el.dataset.id,el,dur:durOf(el)};
  const seek=(r||0)*cur.dur/1000;
  const fail=()=>{cfg.toast('Не удалось воспроизвести запись',1);if(cur&&cur.el===el){paint(el,false);cur=null}};
  const go=u=>{if(!cur||cur.el!==el)return;A.src=u;A.defaultPlaybackRate=speed;
    if(seek>0.05)A.addEventListener('loadedmetadata',()=>{try{A.currentTime=seek}catch(e){}},{once:true});
    const p=A.play();if(p&&p.catch)p.catch(fail)};
  if(cfg.res)cfg.res(el.dataset.url).then(go).catch(fail);else go(el.dataset.url); // cfg.res: форум отдаёт blob, адрес сервера не светится
  markHeard(el)}
function markHeard(el){if(el.dataset.mine!=='1'&&el.dataset.heard==='0'){el.dataset.heard='1';try{cfg.heard(el.dataset.id)}catch(e){}}}
function toggle(el){
  if(!el||el.dataset.pending||!el.dataset.url)return;
  if(cur&&cur.id===el.dataset.id){if(A.paused){const p=A.play();if(p&&p.catch)p.catch(()=>{})}else A.pause();return}
  begin(el,0)}
A.addEventListener('play',()=>{A.playbackRate=speed;if(cur){paint(cur.el,true);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}});
A.addEventListener('pause',()=>{if(cur&&!A.ended)paint(cur.el,false)});
A.addEventListener('ended',()=>{const c=cur;if(!c)return;cur=null;reset(c.el);const nx=nextUnheard(c.el);if(nx)begin(nx,0)});
A.addEventListener('error',()=>{if(cur&&A.src){cfg.toast('Не удалось воспроизвести запись',1);paint(cur.el,false)}});

function listen(root){
  if(root._kv)return;root._kv=1;
  root.addEventListener('click',e=>{
    const sp=e.target.closest('.vs');
    if(sp){e.stopPropagation();speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];try{localStorage.setItem('kv_speed',speed)}catch(x){}
      A.playbackRate=speed;A.defaultPlaybackRate=speed;sp.textContent=spd(speed);return}
    const kc=e.target.closest('.kn-c');if(kc){e.stopPropagation();nToggle(kc.closest('.kn'));return}
    const b=e.target.closest('.vp');if(b){e.stopPropagation();toggle(b.closest('.vm'))}});
  root.addEventListener('pointerdown',e=>{
    const w=e.target.closest('.vw');if(!w)return;const el=w.closest('.vm');if(!el||el.dataset.pending||!el.dataset.url)return;
    const rc=w.getBoundingClientRect(),pid=e.pointerId,rt=ev=>Math.min(1,Math.max(0,(ev.clientX-rc.left)/Math.max(1,rc.width)));
    try{w.setPointerCapture(pid)}catch(x){}
    const isCur=cur&&cur.id===el.dataset.id;let r=rt(e);setP(el,r);
    const tx=el.querySelector('.vt');tx.textContent=fmtT(r*durOf(el));
    const mv=ev=>{if(ev.pointerId!==pid)return;r=rt(ev);setP(el,r);tx.textContent=fmtT(r*durOf(el))};
    const done=(ev,ok)=>{w.removeEventListener('pointermove',mv);w.removeEventListener('pointerup',up);w.removeEventListener('pointercancel',cn);
      if(!ok){if(isCur){const t=A.currentTime*1000;setP(el,Math.min(1,t/cur.dur));tx.textContent=fmtT(t)}else reset(el);return}
      if(isCur){try{A.currentTime=r*cur.dur/1000}catch(x){}if(A.paused){const p=A.play();if(p&&p.catch)p.catch(()=>{})}}else begin(el,r)};
    const up=ev=>done(ev,true),cn=ev=>done(ev,false);
    w.addEventListener('pointermove',mv);w.addEventListener('pointerup',up);w.addEventListener('pointercancel',cn)})}

/* ---------- кружки: разметка и плеер ---------- */
function knInner(v){return `<div class="kn-c"><video class="kn-v" playsinline webkit-playsinline muted preload="metadata" disablepictureinpicture${v.url?(cfg.res?` data-bsrc="${esc(v.url)}"`:` src="${esc(v.url)}#t=0.1"`):''}${v.poster?` poster="${esc(v.poster)}"`:''}></video><svg class="kn-r" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg><span class="kn-t">${fmtT(v.dur)}</span><span class="kn-pl">${IC_PLAY}</span>${v.meta?`<span class="kn-tm">${v.meta}</span>`:''}</div>`}
function knBubble(cls,v){return `<div class="${esc(cls)} kn" data-id="${esc(v.id)}" data-url="${esc(v.url||'')}" data-dur="${v.dur|0}" data-heard="${v.heard?1:0}" data-mine="${v.mine?1:0}"${v.pending?' data-pending="1"':''}>${knInner(v)}</div>`}
let curN=null,rafN=0;
const nP=(el,p)=>{const c=el.querySelector('.kn-c');if(c)c.style.setProperty('--p',p)};
function nTick(){rafN=0;if(!curN||curN.v.paused)return;const t=curN.v.currentTime*1000;nP(curN.el,Math.min(1,t/curN.dur));curN.el.querySelector('.kn-t').textContent=fmtT(t);rafN=requestAnimationFrame(nTick)}
function nReset(el){if(!el)return;el.classList.remove('playing');nP(el,0);const t=el.querySelector('.kn-t');if(t)t.textContent=fmtT(durOf(el))}
function nStop(){if(!curN)return;const c=curN;curN=null;try{c.v.pause();c.v.muted=true;c.v.currentTime=0.1}catch(e){}nReset(c.el)}
function stopAll(){stop();nStop()}
function nToggle(el){
  if(!el||el.dataset.pending||!el.dataset.url)return;
  const v=el.querySelector('.kn-v');if(!v)return;
  if(cfg.res&&!v.getAttribute('src')){cfg.res(el.dataset.url).then(u=>{v.src=u;nToggle(el)}).catch(()=>cfg.toast('Не удалось воспроизвести видео',1));return}
  if(curN&&curN.el===el){if(v.paused){const p=v.play();if(p&&p.catch)p.catch(()=>{})}else v.pause();return}
  stop();nStop();
  curN={id:el.dataset.id,el,v,dur:durOf(el)};
  if(!v._kn){v._kn=1;
    v.addEventListener('play',()=>{if(curN&&curN.v===v){curN.el.classList.add('playing');cancelAnimationFrame(rafN);rafN=requestAnimationFrame(nTick)}});
    v.addEventListener('pause',()=>{if(curN&&curN.v===v&&!v.ended)curN.el.classList.remove('playing')});
    v.addEventListener('ended',()=>{if(curN&&curN.v===v){const c=curN;curN=null;v.muted=true;try{v.currentTime=0.1}catch(e){}nReset(c.el)}});
    v.addEventListener('error',()=>{if(curN&&curN.v===v){cfg.toast('Не удалось воспроизвести видео',1);nStop()}})}
  v.muted=false;try{if(v.ended||(v.duration&&v.currentTime>v.duration-0.2))v.currentTime=0}catch(e){}
  const p=v.play();if(p&&p.catch)p.catch(()=>{cfg.toast('Не удалось воспроизвести видео',1);nStop()});
  markHeard(el)}

/* ---------- запись ---------- */
function pickMime(){
  if(typeof MediaRecorder==='undefined'||!MediaRecorder.isTypeSupported)return '';
  const l=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  for(const m of l){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return ''}
function pickVMime(){
  if(typeof MediaRecorder==='undefined'||!MediaRecorder.isTypeSupported)return '';
  const l=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const m of l){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return ''}

const MAX_V=60000,HOLD_MS=220;
const extOf=m=>/mp4|m4a|aac/.test(m)?'m4a':/ogg/.test(m)?'ogg':'webm';

function attach(o){
  const form=o.form,ta=o.ta,sb=o.sendBtn,log=o.log;

  form._kvOn=1;form.classList.add('kv-on');sb.classList.add('kv-sb');
  if(getComputedStyle(form).position==='static')form.style.position='relative';
  const mic=sb.cloneNode(false);['id','disabled','data-busy','title'].forEach(a=>mic.removeAttribute(a));
  let mode='voice',recMode='voice';try{if(localStorage.getItem('kv_mode')==='video')mode='video'}catch(e){}
  const modeIcon=()=>mode==='video'?IC_CAM:IC_MIC,modeLbl=()=>mode==='video'?'Записать видеосообщение (кружок)':'Записать голосовое сообщение';
  mic.type='button';mic.classList.add('kv-mic');mic.classList.remove('kv-sb');mic.innerHTML=modeIcon();mic.dataset.mode=mode;mic.setAttribute('aria-label',modeLbl());mic.title=mode==='video'?'Удерживайте — кружок, нажмите — голосовое':'Удерживайте — голосовое, нажмите — кружок';
  sb.after(mic);
  // первые разы показываем подсказку сами, потом — по тапу
  try{const n=+localStorage.getItem('kv_tip')||0;if(n<3){localStorage.setItem('kv_tip',String(n+1));setTimeout(()=>{if(form.isConnected)showTip(5200)},900)}}catch(e){}
  const ov=document.createElement('div');ov.className='kv-rec';ov.hidden=true;
  ov.innerHTML=`<button class="kv-x" type="button" aria-label="Удалить запись">${IC_TRASH}</button><i class="kv-dot"></i><b class="kv-t">0:00,0</b><canvas class="kv-cv"></canvas><span class="kv-hint">‹ Влево — отмена</span>`;
  const lock=document.createElement('div');lock.className='kv-lock';lock.hidden=true;lock.innerHTML=IC_LOCK;
  const circ=document.createElement('div');circ.className='kv-circ';circ.hidden=true;
  circ.innerHTML='<video muted playsinline></video><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="48"/><circle class="fg" cx="50" cy="50" r="48"/></svg>';
  const tip=document.createElement('div');tip.className='kv-tip';tip.hidden=true;tip.setAttribute('role','status');
  form.appendChild(ov);form.appendChild(lock);form.appendChild(circ);form.appendChild(tip);
  let tipT=0;
  /* подсказка у кнопки, как в Telegram: что делает тап и что — удержание */
  function tipText(){return mode==='video'
    ?'<b>Удерживайте — запись кружка</b><span>Нажмите — переключить на голосовое</span>'
    :'<b>Удерживайте — голосовое</b><span>Нажмите — переключить на кружок</span>'}
  function showTip(ms){

    const f=form.getBoundingClientRect(),m=mic.getBoundingClientRect();if(!m.width)return;
    tip.innerHTML=tipText();tip.hidden=false;tip.classList.remove('in');

    void tip.offsetWidth;tip.classList.add('in');clearTimeout(tipT);tipT=setTimeout(hideTip,ms||3800)}
  function hideTip(){clearTimeout(tipT);tip.classList.remove('in');tip.hidden=true}
  const cvid=circ.querySelector('video'),ringFg=circ.querySelector('.fg');
  const $x=ov.querySelector('.kv-x'),$t=ov.querySelector('.kv-t'),cv=ov.querySelector('.kv-cv'),hint=ov.querySelector('.kv-hint');

  const refresh=()=>{form.classList.toggle('kv-txt',!!ta.value.trim()&&state==='idle')};
  let state='idle',holding=false,gesture=false,holdT=0,pid=0,downAt=0,sx=0,sy=0,ignoreUntil=0,t0=0;
  let stream=null,rec=null,chunks=[],ac=null,an=null,buf=null,levels=[],live=[],timer=0,tping=0,mime='',gen=0;
  ta.addEventListener('input',refresh);refresh();
  const poll=setInterval(()=>{if(!form.isConnected){clearInterval(poll);if(state!=='idle')abort();return}refresh()},250);

  const accent=()=>(getComputedStyle(form).getPropertyValue('--acc').trim()||'#9d92e6');
  function place(){
    const f=form.getBoundingClientRect(),t=ta.getBoundingClientRect(),m=mic.getBoundingClientRect();let l=t.left;
    for(const c of form.children){if(c===ov||c===lock||c===mic||c===circ)continue;const r=c.getBoundingClientRect();if(r.width&&r.right<=t.left+1&&getComputedStyle(c).display!=='none')l=Math.min(l,r.left)}
    ov.style.left=(l-f.left)+'px';ov.style.top=(t.top-f.top)+'px';ov.style.width=Math.max(120,t.right-l)+'px';ov.style.height=t.height+'px';
    lock.style.right=(f.right-m.right+m.width/2-19)+'px'}
  function sizeCv(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d))}
  function draw(){
    const c=cv.getContext('2d'),W=cv.width,H=cv.height,d=window.devicePixelRatio||1,bw=3*d,gap=2.4*d,step=bw+gap,n=Math.floor(W/step);

    for(let i=0;i<n;i++){const v=live[live.length-1-i];if(v==null)break;const h=Math.max(3*d,v*H*.92),x=W-(i+1)*step+gap,y=(H-h)/2;
      c.globalAlpha=Math.max(.25,1-i/n*.75);c.beginPath();if(c.roundRect)c.roundRect(x,y,bw,h,bw/2);else c.rect(x,y,bw,h);c.fill()}
    c.globalAlpha=1}
  function tickRec(){
    if(!an)return;an.getByteTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;s+=v*v}
    const rms=Math.sqrt(s/buf.length);levels.push(rms);live.push(Math.min(1,Math.pow(rms*5,.72)));
    const ms=performance.now()-t0;$t.textContent=Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+','+Math.floor(ms%1000/100);
    draw();
    if(recMode==='video'){ringFg.style.strokeDashoffset=String(301.6*(1-Math.min(1,ms/MAX_V)));if(ms>=MAX_V){cfg.toast('Достигнут лимит — 1 минута');finish(true)}}
    else if(ms>=MAX_MS){cfg.toast('Достигнут лимит записи — 10 минут');finish(true)}}
  function cleanup(){
    clearInterval(timer);clearInterval(tping);timer=tping=0;
    try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}
    try{ac&&ac.close()}catch(e){}stream=ac=an=null;try{cvid.srcObject=null}catch(e){}}
  async function start(){
    const my=++gen;
    recMode=mode;const vid=recMode==='video',aud={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
    if(window.EXGPerm&&!(await EXGPerm.ensure(vid?['mic','cam']:['mic']))){const e=new Error('permission');e.name='NotAllowedError';throw e}
    stream=await navigator.mediaDevices.getUserMedia(vid?{audio:aud,video:{facingMode:'user',width:{ideal:480},height:{ideal:480},aspectRatio:{ideal:1},frameRate:{ideal:30}}}:{audio:aud});
    if(my!==gen){cleanup();return false}
    mime=vid?pickVMime():pickMime();
    rec=mime?new MediaRecorder(stream,vid?{mimeType:mime,videoBitsPerSecond:700000,audioBitsPerSecond:48000}:{mimeType:mime,audioBitsPerSecond:32000}):new MediaRecorder(stream);
    if(vid){cvid.srcObject=stream;const pp=cvid.play();if(pp&&pp.catch)pp.catch(()=>{})}
    chunks=[];levels=[];live=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const tr=stream.getAudioTracks()[0];if(tr)tr.onended=()=>{if(state!=='idle'){cfg.toast('Запись прервана',1);abort()}};
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){ac=new AC();if(ac.state==='suspended')ac.resume().catch(()=>{});const src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=512;src.connect(an);buf=new Uint8Array(an.fftSize)}
    rec.start(250);t0=performance.now();timer=setInterval(tickRec,60);
    if(o.typing){o.typing(recMode);tping=setInterval(()=>{try{o.typing(recMode)}catch(e){}},2500)}
    return true}
  function stopRec(){return new Promise(res=>{
    if(!rec||rec.state==='inactive'){res(null);return}
    const dur=performance.now()-t0,m=rec.mimeType||mime||(recMode==='video'?'video/webm':'audio/webm'),kind=recMode;
    rec.onstop=()=>res({kind,blob:new Blob(chunks,{type:m}),dur:Math.round(dur),mime:m,wave:kind==='video'?'':waveStr(levels),ext:kind==='video'?extOfV(m):extOf(m)});
    try{rec.stop()}catch(e){res(null)}})}
  function ui(on){
    if(on){place();ov.hidden=false;lock.hidden=false;if(recMode==='video'){ringFg.style.strokeDashoffset='301.6';circ.hidden=false}sizeCv();form.classList.add('kv-recording');requestAnimationFrame(()=>ov.classList.add('in'))}
    else{circ.hidden=true;ov.classList.remove('in','locked');ov.hidden=true;lock.hidden=true;lock.style.transform='';ov.style.transform='';form.classList.remove('kv-recording','kv-locked');mic.classList.remove('hold');mic.innerHTML=modeIcon();mic.style.transform='';refresh()}}
  function setLocked(){
    state='locked';holding=false;vib(14);lock.hidden=true;ov.classList.add('locked');form.classList.add('kv-locked');
    mic.classList.remove('hold');mic.innerHTML=IC_SEND;mic.style.transform='';mic.setAttribute('aria-label','Отправить');ov.style.transform=''}
  function abort(){clearTimeout(holdT);gen++;state='idle';holding=false;try{rec&&rec.state!=='inactive'&&(rec.onstop=null,rec.stop())}catch(e){}rec=null;cleanup();ui(false)}
  function snap(){try{const w=cvid.videoWidth,h=cvid.videoHeight;if(!w)return '';const q=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=240;c.getContext('2d').drawImage(cvid,(w-q)/2,(h-q)/2,q,q,0,0,240,240);return c.toDataURL('image/jpeg',.7)}catch(e){return ''}}
  async function finish(send){
    if(state==='idle')return;state='idle';holding=false;
    const poster=recMode==='video'?snap():'';ui(false);
    const r=await stopRec();rec=null;cleanup();gen++;
    if(!send||!r)return;
    const vidK=r.kind==='video';
    if(r.dur<(vidK?1000:MIN_MS)||!r.blob.size){cfg.toast('Слишком короткая запись');return}
    if(r.blob.size>7.6*1024*1024){cfg.toast('Видео получилось слишком большим — запишите короче',1);return}
    let tmp=null;
    if(log){const d=document.createElement('div'),meta=o.nowMeta?o.nowMeta():'';
      d.innerHTML=vidK?knBubble(o.clsN||'me',{id:'tmp'+Date.now(),url:'',dur:r.dur,poster,mine:true,heard:true,pending:true,meta})
        :bubble(o.cls||'msg me',{id:'tmp'+Date.now(),url:'',dur:r.dur,wave:r.wave,mine:true,heard:true,pending:true,meta});
      tmp=d.firstChild;log.appendChild(tmp);bind(log);log.scrollTop=log.scrollHeight}
    try{await o.send(r)}
    catch(e){if(tmp)tmp.remove();cfg.toast((e&&e.message)||'Не удалось отправить запись',1)}}

  mic.addEventListener('contextmenu',e=>e.preventDefault());
  function toggleMode(){
    mode=mode==='video'?'voice':'video';try{localStorage.setItem('kv_mode',mode)}catch(e){}
    mic.dataset.mode=mode;mic.innerHTML=modeIcon();mic.setAttribute('aria-label',modeLbl());mic.classList.remove('kv-swap');void mic.offsetWidth;mic.classList.add('kv-swap');vib(8);
    mic.title=mode==='video'?'Удерживайте — кружок, нажмите — голосовое':'Удерживайте — голосовое, нажмите — кружок';showTip(3800)}
  mic.addEventListener('pointerdown',e=>{
    if(state!=='idle')return;
    e.preventDefault();state='pending';holding=true;gesture=true;pid=e.pointerId;downAt=performance.now();sx=e.clientX;sy=e.clientY;
    try{mic.setPointerCapture(pid)}catch(x){}
    holdT=setTimeout(()=>{if(state==='pending')begin()},HOLD_MS)});
  async function begin(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){state='idle';holding=false;cfg.toast('Запись здесь недоступна. Откройте в браузере или в Telegram',1);return}
    state='starting';hideTip();stopAll();
    {
    try{
      const ok=await start();if(!ok)return;
      if(state!=='starting'){return}
      try{if(holding&&!mic.hasPointerCapture(pid))holding=false}catch(x){}
      ui(true);vib(10);
      if(holding){state='rec';mic.classList.add('hold');mic.style.transform='scale(1.35)'}else setLocked();
    }catch(err){
      state='idle';holding=false;cleanup();ui(false);
      const n=err&&err.name;
      const vd=mode==='video';
      cfg.toast(n==='NotAllowedError'||n==='SecurityError'?(vd?'Нет доступа к камере или микрофону. Разрешите их в настройках':'Нет доступа к микрофону. Разрешите его в настройках'):n==='NotFoundError'||n==='OverconstrainedError'?(vd?'Камера или микрофон не найдены':'Микрофон не найден'):(vd?'Не удалось включить камеру':'Не удалось включить микрофон'),1)}
    }}
  mic.addEventListener('pointermove',e=>{

    if(dy<-72){setLocked();return}

    const l=Math.max(0,Math.min(1,-dx/110));ov.style.transform=`translateX(${Math.min(0,dx)*.35}px)`;hint.style.opacity=String(1-l*.85);hint.classList.toggle('bad',l>.45);
    lock.style.transform=`translateY(${Math.max(dy,-80)*.7}px) scale(${1+Math.min(1,-dy/72)*.25})`});
  const release=cancelled=>{

/* ---------- ответ на пост из ленты прямо в личку ---------- */
function postSnip(p){return p.body.replace(/\s+/g,' ').trim().slice(0,140)}
function replyToPost(p){
  if(!p||p.mine)return;
  const old=$('.sheet-bg.rps');if(old)old.remove();
  const sn=postSnip(p),bg=document.createElement('div');bg.className='sheet-bg rps';
  bg.innerHTML=`<div class="sheet rep"><div class="sh-t">Ответить в личку</div>
    <div class="pq pqs">${p.imgs[0]?`<img data-bsrc="/forum/api/img/${p.imgs[0]}" alt="">`:''}<div class="pqt"><span class="pqa">Пост · ${esc(p.user.name)}</span><b>${esc(p.title||sn||'Пост')}</b>${p.title&&sn?`<span>${esc(sn)}</span>`:''}</div></div>
    <textarea class="inp" id="rpT" maxlength="3000" placeholder="Ваш ответ автору…"></textarea>
    <div class="rps-b"><button class="btn ghost" id="rpN" type="button">Отмена</button><button class="btn" id="rpS" type="button" disabled>${IC.send}Отправить</button></div></div>`;
  const T=$('#rpT',bg),S_=$('#rpS',bg),N=$('#rpN',bg);let busy=false;
  const close=()=>{document.removeEventListener('keydown',key,true);bg.remove()};
  const send=()=>{const t=T.value.trim();if(!t||busy)return;close();toast('Ответ отправлен в личные сообщения');      // окно закрывается сразу; если не дошло — откроется снова с вашим текстом
    retryTF(()=>post_('/messages',{peer:p.user.id,text:t,post_id:p.id})).catch(e=>{toast(e.message,1);replyToPost(p);const nt=$('.sheet-bg.rps #rpT');if(nt){nt.value=t;nt.dispatchEvent(new Event('input'))}})};
  function key(e){if(e.key==='Escape'&&!busy){e.stopPropagation();close()}else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}}
  document.addEventListener('keydown',key,true);
  T.oninput=()=>{if(!busy)S_.disabled=!T.value.trim()};
  S_.onclick=send;N.onclick=()=>{if(!busy)close()};
  bg.onclick=e=>{if(e.target===bg&&!busy)close()};
  document.body.appendChild(bg);setTimeout(()=>T.focus(),60)}

const LPD=new Map(),LPP=new Map();   // адрес -> готовая карточка / промис запроса
function lpUrl(t){const m=/https?:\/\/[^\s<]+[^\s<.,;:!?)]/.exec(t||'');return m&&m[0].length<=2000?m[0]:''}
function lpSlot(t){const u=lpUrl(t);return u?`<div class="lkp" data-lkp="${esc(u)}"></div>`:''}
function lpCard(d,u){return `<a class="lkc" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span class="lkt"><span class="lks">${esc(d.site||d.host||'')}</span>${d.title?`<b>${esc(d.title)}</b>`:''}${d.desc?`<span class="lkd">${esc(d.desc)}</span>`:''}</span>${d.img?`<span class="lki"><img data-bsrc="${esc(d.img)}" alt="" onerror="this.parentNode.remove()"></span>`:''}</a>`}
function lpFill(log){
  log.querySelectorAll('.lkp[data-lkp]:not([data-ok])').forEach(n=>{
    const u=n.dataset.lkp;n.dataset.ok='1';
    const put=d=>{if(!d||!d.ok||!n.isConnected)return false;n.innerHTML=lpCard(d,u);n.classList.add('on');return true};
    if(LPD.has(u)){put(LPD.get(u));return}                       // из кэша — сразу, без прыжка ленты
    let p=LPP.get(u);
    if(!p){p=api('/linkpreview?url='+encodeURIComponent(u)).catch(()=>({ok:false})).then(d=>{if(LPD.size>300)LPD.delete(LPD.keys().next().value);LPD.set(u,d);LPP.delete(u);return d});LPP.set(u,p)}
    p.then(d=>{const near=log.scrollHeight-log.scrollTop-log.clientHeight<160;if(put(d)&&near)log.scrollTop=log.scrollHeight})})}

/* ---------- создание / редактирование ---------- */
(function(){const kick=v=>{v.muted=true;const p=v.play&&v.play();if(p&&p.catch)p.catch(()=>{})};new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.tagName==='VIDEO')kick(n);else if(n.querySelectorAll)n.querySelectorAll('video[autoplay]').forEach(kick)}))).observe(document.documentElement,{childList:true,subtree:true})})();
function compress(file){return new Promise(res=>{if(file.type==='image/gif'||file.size<350000){res(file);return}const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const al=/^image\/(png|webp)$/i.test(file.type);c.toBlob(b=>{URL.revokeObjectURL(u);res(b?new File([b],al?'p.webp':'p.jpg',{type:b.type||'image/jpeg'}):file)},al?'image/webp':'image/jpeg',al?.88:.82)};im.onerror=()=>res(file);im.src=u})}

const PALS={violet:{n:'Фиолет',acc:'#8b5cf6'},green:{n:'Зелёный',acc:'#22c55e'},blue:{n:'Синяя ночь',acc:'#3b82f6'},pink:{n:'Розовый',acc:'#ec4899'},mono:{n:'Моно',acc:'#a1a1aa'},lilac:{n:'Сирень',light:1,acc:'#6d5ef0'},sky:{n:'Небо',light:1,acc:'#4f7cf0'}};
const LEGACY={dark:'violet',light:'lilac',midnight:'blue',ocean:'blue',forest:'green'};
const DEAL_ST={awaiting_fee:'Ожидание комиссии',awaiting_asset:'Ожидание подарка',in_progress:'В процессе',awaiting_seller:'Ожидание продавца',payout_pending:'Ожидание выдачи',refund_pending:'Ожидание возврата',disputed:'Спор',completed:'Завершена',cancelled:'Отменена',refunded:'Возвращена',pending_acceptance:'Ожидает принятия'};
const PK={bot:'Бот',channel:'Канал',group:'Группа',site:'Сайт',service:'Сервис',other:'Другое'};
const PMARK={green:'✅ Хороший проект',yellow:'🟡 Средний проект',blue:'🔷 Проект владельцев'};
const REP_REASONS=['Мошенничество','Спам или реклама','Оскорбления','Запрещённый контент','Другое'];

const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c};
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'Скопировано')}catch(e){prompt('Скопируйте',t)}}
function profileTheme(pt){const p=PALS[LEGACY[pt]||pt];if(!p)return;const r=document.documentElement;r.style.setProperty('--acc',p.acc);const m=p.acc.match(/\w\w/g).map(x=>parseInt(x,16));r.style.setProperty('--acc-soft',`rgba(${m[0]},${m[1]},${m[2]},.16)`);const t=ls.get('theme')||'dark';r.dataset.theme=p.light?'light':(t==='light'?'dark':t)}

function reportSheet(title,cats,send,photos){
  const bg=document.createElement('div');bg.className='sheet-bg';let cat='';const files=[];
  bg.innerHTML=`<div class="sheet rep"><div class="sh-t">${esc(title)}</div><div class="chips">${cats.map(c=>`<button type="button" class="chip" data-r="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <textarea class="inp" id="rpT" maxlength="400" placeholder="Подробности (необязательно)" style="min-height:84px;margin-top:12px"></textarea>
  ${photos?`<div class="thumbs" id="rpP"></div><button type="button" class="btn ghost sm" id="rpA" style="margin-top:10px">${IC.img}Добавить скриншоты (до 5)</button><input type="file" id="rpF" accept="image/*" multiple hidden>`:''}
  <button type="button" class="btn" id="rpS" disabled style="width:100%;margin-top:14px">Отправить жалобу</button></div>`;
  const close=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg)close()};
  const paint=()=>{const b=$('#rpP',bg);if(!b)return;b.innerHTML=files.map((f,i)=>`<div><img src="${f.url}" alt=""><button type="button" data-x="${i}">×</button></div>`).join('');$('#rpA',bg).style.display=files.length>=5?'none':''};
  $$('.chip',bg).forEach(c=>c.onclick=()=>{cat=c.dataset.r;$$('.chip',bg).forEach(x=>x.classList.toggle('on',x===c));$('#rpS',bg).disabled=false});
  if(photos){$('#rpA',bg).onclick=()=>$('#rpF',bg).click();
    $('#rpF',bg).onchange=async e=>{for(const f of [...e.target.files]){if(files.length>=5)break;const b=await compress(f);files.push({blob:b,url:URL.createObjectURL(b)})}e.target.value='';paint()};
    $('#rpP',bg).onclick=e=>{const x=e.target.closest('[data-x]');if(x){files.splice(+x.dataset.x,1);paint()}}}
  $('#rpS',bg).onclick=async()=>{const b=$('#rpS',bg);b.disabled=true;try{await send(cat,$('#rpT',bg).value.trim(),files.map(f=>f.blob));toast('Жалоба отправлена');close()}catch(e){toast(e.message,1);b.disabled=false}};
  document.body.appendChild(bg)}

async function profReviews(box,u,x,own){
  const rv=await api('/x/reviews?id='+u.id),list=rv.reviews,n=list.length,rating=x?x.rating:0;
  const c=[0,0,0,0,0,0];list.forEach(r=>c[r.rating]++);
  const stars=k=>'★'.repeat(k)+'☆'.repeat(5-k);
  const sum=n?`<div class="rv-sum glass"><div class="rv-big"><b>${rating||'—'}</b><span class="stars">${stars(Math.round(rating||0))}</span><small>${n} ${plural(n,'отзыв','отзыва','отзывов')}</small></div><div class="rv-bars">${[5,4,3,2,1].map(k=>`<div><span>${k}</span><i><u style="width:${Math.round(c[k]/n*100)}%"></u></i><span>${c[k]}</span></div>`).join('')}</div></div>`:'';
  const mine=list.find(r=>r.mine);
  const form=own?'':`<div class="rform"><h3>${mine?'Изменить отзыв':'Оставить отзыв'}</h3><p class="rsub">Оценка для ${esc(u.name)}. Отзыв доступен участникам завершённой сделки.</p>
    <div class="rstars" id="rStars">${[1,2,3,4,5].map(k=>`<button type="button" data-v="${k}" aria-label="${k}">★</button>`).join('')}</div><div class="rlabel" id="rLabel">Нажмите на звезду</div>
    <textarea class="inp" id="rvT" maxlength="1000" placeholder="Расскажите, как прошла сделка…"></textarea><div class="rcount"><span id="rCnt">0</span> / 1000</div>
    <input type="file" id="rvF" accept="image/*" hidden><div class="rshot" id="rShot"></div>
    <button class="btn" id="rvS" disabled style="width:100%;margin-top:12px">${mine?'Сохранить изменения':'Опубликовать отзыв'}</button></div>`;
  box.innerHTML=`${sum}${form}<div id="rvl">${n?list.map(r=>`<div class="rcard" data-rid="${r.id}"><div class="rcard-h">${av({id:r.author_id,name:r.author.replace('@',''),av:r.author_has_avatar||!!r.author_photo},'s')}<div><b data-href="#/u/${r.author_id}">${esc(r.author)}${tags(r.author_sb)}${r.mine?'<span class="mine-tag">ваш</span>':''}</b><small>${esc(r.created||'')}</small></div><span class="stars">${stars(r.rating)}</span></div>${r.text?`<p>${esc(r.text)}</p>`:''}${r.photo?`<img class="rv-photo" loading="lazy" data-lb="${esc(r.photo)}" data-bsrc="${esc(r.photo)}" alt="Скриншот">`:''}${r.mine?'':`<button class="chip rpb" data-reprv="${r.id}">${IC.flag}Жалоба</button>`}</div>`).join(''):emptyBox('comment','Отзывов пока нет')}</div>`;
  $$('[data-reprv]',box).forEach(b=>b.onclick=()=>reportSheet('Жалоба на отзыв',REP_REASONS,(cat,txt)=>post_('/x/report_any',{kind:'review',id:+b.dataset.reprv,reason:(cat?cat+(txt?': ':''):'')+txt||'Жалоба на отзыв'})));
  if(own)return;
  const LAB=['','Ужасно','Плохо','Нормально','Хорошо','Отлично'];let rate=mine?mine.rating:0,file=null;
  const st=$$('#rStars button',box),btn=$('#rvS',box),txt=$('#rvT',box),fi=$('#rvF',box),shot=$('#rShot',box);
  const paint=()=>{st.forEach(b=>b.classList.toggle('on',+b.dataset.v<=rate));$('#rLabel',box).textContent=rate?LAB[rate]:'Нажмите на звезду';btn.disabled=!rate};
  const drawShot=()=>{if(file){shot.classList.add('has');shot.innerHTML=`<img src="${URL.createObjectURL(file)}" alt=""><div>${esc(file.name||'скриншот')}<small>Нажмите, чтобы заменить</small></div><button type="button" class="rx" id="rRm">✕</button>`;$('#rRm',box).onclick=e=>{e.stopPropagation();file=null;fi.value='';drawShot()}}else{shot.classList.remove('has');shot.innerHTML=`<span class="ri">${IC.img}</span><div>Добавить скриншот<small>необязательно</small></div>`}};
  st.forEach(b=>b.onclick=()=>{rate=+b.dataset.v;paint();pop(b)});
  if(mine){txt.value=mine.text||'';$('#rCnt',box).textContent=txt.value.length}
  txt.oninput=()=>{$('#rCnt',box).textContent=txt.value.length};
  shot.onclick=()=>fi.click();fi.onchange=()=>{file=fi.files[0]||null;drawShot()};
  paint();drawShot();
  btn.onclick=async()=>{if(!rate)return;btn.disabled=true;try{const fd=new FormData();fd.append('target_id',u.id);fd.append('rating',rate);fd.append('text',txt.value);if(file)fd.append('photo',await compress(file),'review.jpg');await api('/x/review',{method:'POST',form:fd});toast('Отзыв сохранён');render()}catch(e){toast(e.message,1);btn.disabled=false}}}
