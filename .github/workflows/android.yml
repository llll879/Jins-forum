name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Адрес сервера форума (https://...). Если пусто — берётся переменная репозитория FORUM_URL'
        required: false
  push:
    paths: ['forum.src.html', 'tools/**', 'forum_assets/**', 'android-app/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ inputs.server_url || vars.FORUM_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Собрать forum.html
        run: python tools/build_forum.py

      - name: Установить Capacitor и подготовить веб-часть
        working-directory: android-app
        run: |
          npm install
          npm run prepare-web

      - name: Создать Android-проект
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Иконка приложения и название
        working-directory: android-app
        run: |
          res=android/app/src/main/res
          cp -r icons/mipmap-* $res/
          cp icons/values/ic_launcher_background.xml $res/values/
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">EXG FORUM</string>|; s|<string name="title_activity_main">.*</string>|<string name="title_activity_main">EXG FORUM</string>|' $res/values/strings.xml
          cat $res/values/strings.xml

      - name: Firebase (звонки и уведомления при закрытом приложении)
        working-directory: android-app
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            if printf '%s' "$GSJ" | head -c1 | grep -q '{'; then printf '%s' "$GSJ" > android/app/google-services.json
            else printf '%s' "$GSJ" | base64 -d > android/app/google-services.json; fi
            echo "google-services.json: OK"
          else
            echo "::warning::Секрет GOOGLE_SERVICES_JSON не задан — push при закрытом приложении в этой сборке работать не будут"
          fi

      - name: Разрешения и мост (камера, микрофон, уведомления, push)
        working-directory: android-app
        run: |
          python3 ../tools/android_patch.py android/app/src/main
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Собрать APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: exg-forum-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
