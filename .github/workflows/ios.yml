name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Адрес сервера форума (https://...). Если пусто — берётся переменная репозитория FORUM_URL'
        required: false

jobs:
  ipa:
    runs-on: macos-latest
    env:
      SERVER_URL: ${{ inputs.server_url || vars.FORUM_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Собрать forum.html
        run: python tools/build_forum.py

      - name: Capacitor iOS
        working-directory: android-app
        run: |
          npm install
          npm install @capacitor/ios@^6.1.2
          npm run prepare-web
          npx cap add ios
          npx cap sync ios

      - name: Иконка, название, разрешения
        working-directory: android-app
        run: |
          app=ios/App/App
          sips -z 1024 1024 icons/icon-512.png --out "$app/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          P=$app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'EXG FORUM'" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'EXG FORUM'" $P
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Камера нужна для видео-кружков и звонков'" $P
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Микрофон нужен для голосовых сообщений и звонков'" $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $P

      - name: Собрать без подписи
        working-directory: android-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -qr exg-forum.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: exg-forum-ipa
          path: android-app/ios/App/build/exg-forum.ipa
