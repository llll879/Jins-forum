<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050409">
<title>KMBP FORUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ===== KMBP FORUM · «Тёмный мрамор» =====
   Спрайты (статуя, луна, город, колонны, розы) вшиты как data-URI — файл по-прежнему один.
   Исходники лежат в forum_assets/, сборка: python tools/build_forum.py */
:root{--acc:#9d92e6;--acc-soft:rgba(157,146,230,.16);--bg:#050409;--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.075);--solid:#12101a;
  --glass:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.022));--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);
  --txt:#f4f2fb;--dim:#8f8aa6;--bad:#ff5c6c;--ok:#4cd6a0;--gold:#e3c47a;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --serif:'Playfair Display','Cormorant Garamond',Georgia,serif;--pill:linear-gradient(180deg,#4a4560,#2b2738)}
[data-theme=light]{--bg:#f1efe8;--card:#fff;--card2:#eceadf;--solid:#fff;--glass:linear-gradient(180deg,#fff,#faf8f2);--line:rgba(20,16,10,.1);--line2:rgba(20,16,10,.18);--txt:#1c1a22;--dim:#6b6677;--acc-soft:rgba(110,90,255,.12);--pill:linear-gradient(180deg,#e4e0f5,#d3cdee)}
[data-theme=amoled]{--bg:#000;--solid:#08070c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;position:relative}
#app{width:100%;max-width:680px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:radial-gradient(90% 38% at 100% 0,rgba(96,78,150,.16),transparent 70%),var(--bg)}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-weight:700}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}
.serif{font-family:var(--serif)}

/* розы на фоне отдельных экранов */
#app::after{content:"";position:absolute;right:0;bottom:0;width:78%;height:46%;pointer-events:none;z-index:0;opacity:0;transition:opacity .3s;
  background:url('{{img:rose}}') right bottom/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%),linear-gradient(0deg,#000 40%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 60%),linear-gradient(0deg,#000 40%,transparent);mask-composite:intersect}
#app[data-page=chats]::after,#app[data-page=new]::after,#app[data-page=boards]::after{opacity:.85}
[data-theme=light] #app::after{display:none}
#view{flex:1;position:relative;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:96px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}

/* кнопки-иконки */
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--txt);flex:none}
.ib:active{background:var(--card2)}
.ib.round{background:rgba(20,18,30,.55);border:1px solid var(--line2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.badge{position:absolute;top:2px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#ff3b4e;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.badge[hidden]{display:none}

/* стеклянные поверхности */
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 34px -22px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
[data-theme=light] .glass{box-shadow:0 6px 18px -12px rgba(0,0,0,.2)}

/* ---------- шапка со статуей ---------- */
.mast{position:relative;overflow:hidden;height:calc(176px + var(--safe-t))}
.mast.sm{height:calc(150px + var(--safe-t))}
.mast .st{position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,transparent 44%,#000 60%);mask-image:linear-gradient(90deg,transparent 44%,#000 60%);background:url('{{img:statue}}') right -52px top calc(6px + var(--safe-t))/auto 236px no-repeat}
.mast.sm .st{background-size:auto 244px;background-position:right -52px top calc(-6px + var(--safe-t))}
.mast::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0,rgba(5,4,9,.5) 30%,transparent 58%),linear-gradient(0deg,var(--bg) 0,transparent 30%)}
.mast::before{content:"";position:absolute;left:0;bottom:0;width:62%;height:78%;z-index:0;opacity:.55;background:url('{{img:rose}}') left -70px bottom -26px/auto 170px no-repeat;-webkit-mask-image:linear-gradient(90deg,#000 30%,transparent),linear-gradient(0deg,#000 50%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,#000 30%,transparent),linear-gradient(0deg,#000 50%,transparent);mask-composite:intersect}
.mast .st{z-index:0}
[data-theme=light] .mast .st,[data-theme=light] .mast::before{opacity:.2}
.mh{position:absolute;left:0;right:0;top:0;z-index:2;padding:calc(20px + var(--safe-t)) 16px 0;display:flex;align-items:center;gap:4px}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.brand .star{width:32px;height:32px;flex:none;filter:drop-shadow(0 0 8px rgba(200,190,255,.7))}
.brand h1{margin:0;font-family:var(--serif);font-weight:600;font-size:22px;line-height:1;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.brand h1 b{display:block;font-weight:500;font-size:22px;letter-spacing:.8px;color:#b3aed0}
.mast.sm .brand h1{font-size:30px}
.mast.sm .brand h1 b{font-size:30px}
.mh .ib{color:#fff;width:38px;height:38px}
.mh .ib svg{width:22px;height:22px}
.mh .av{width:38px;height:38px;font-size:15px;border-color:rgba(255,255,255,.55);margin-left:4px}
.mh .badge{top:3px;right:2px}
[data-theme=light] .mh .ib,[data-theme=light] .brand h1{color:#1c1a22}

/* ---------- аватары ---------- */
.av{position:relative;flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#4a4266,#1a1626 70%);color:#efe9ff;display:grid;place-items:center;font-weight:700;font-family:var(--serif);font-size:18px;overflow:hidden;border:1.5px solid rgba(255,255,255,.2);cursor:pointer}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s{width:34px;height:34px;font-size:14px}.av.m{width:50px;height:50px;font-size:20px}.av.l{width:64px;height:64px;font-size:24px}
.av.xl{width:124px;height:124px;font-size:46px;border:2px solid rgba(196,186,255,.75);box-shadow:0 0 0 6px rgba(157,146,230,.14),0 0 44px rgba(157,146,230,.32)}
.av.sup{font-size:12px;letter-spacing:.5px;background:radial-gradient(circle at 30% 25%,#1d1a28,#050409 72%);border-color:rgba(255,255,255,.3);color:#fff}
.av.xs{width:26px;height:26px;font-size:11px;border-width:1px}

/* ---------- «Создать пост» + пилюли ---------- */
.compose-row{position:relative;z-index:3;display:flex;align-items:center;gap:12px;margin:0 14px;height:46px;padding:0 18px;border-radius:23px;color:var(--dim);font-size:14.5px;cursor:pointer}
.compose-row span{flex:1}
.compose-row svg{width:21px;height:21px}
.pills{display:flex;gap:8px;margin:14px 14px 0;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:1 1 auto;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--glass);color:var(--txt);font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer}
.pill svg{width:19px;height:19px;color:#cfc9ee}
.pill.on{background:var(--pill);border-color:var(--line2);box-shadow:0 8px 20px -10px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.18)}
.pill.on svg{color:#fff}
.pill .badge{top:-5px;right:4px}

/* ---------- баннер ---------- */
.hero{position:relative;margin:14px 14px 0;border-radius:20px;overflow:hidden;min-height:96px;display:flex;align-items:center;padding:14px 18px;cursor:pointer;background:#08070d}
.hero .bgph{position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,transparent 44%,#000 62%);mask-image:linear-gradient(90deg,transparent 44%,#000 62%);background:url('{{img:statue}}') right -4px top -20px/auto 190% no-repeat;opacity:.95}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,rgba(5,4,9,.96) 0%,rgba(5,4,9,.82) 42%,rgba(5,4,9,.1) 74%)}
.hero .hc{position:relative;z-index:2;max-width:70%}
.hero .k{font-family:var(--serif);font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:#a8a3c2;display:flex;align-items:center;gap:7px}
.hero .k i{font-style:normal;font-size:14px;color:#888}
.hero .t{font-family:var(--serif);font-weight:500;font-size:17.5px;line-height:1.3;margin-top:5px;color:#ece9f7}
.hero .go{position:absolute;right:12px;bottom:12px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(20,18,30,.7);border:1px solid var(--line2);display:grid;place-items:center;color:#fff}
.hero .go svg{width:16px;height:16px}
[data-theme=light] .hero .t,[data-theme=light] .hero .k{color:#fff}

/* ---------- «Актуальное» ---------- */
.trend{padding:20px 0 0}
.trend[hidden]{display:none}
.th{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px}
.th b{font-family:var(--serif);font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px}
.th b svg{width:22px;height:22px;color:#d7d2ee}
.th a{font-size:13px;color:#aaa5c4;display:flex;align-items:center;gap:2px}
.th a svg{width:16px;height:16px}
.trend-row{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.trend-row::-webkit-scrollbar{display:none}
.tcard{flex:none;width:154px;height:106px;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:9px 10px 8px;cursor:pointer;color:#fff;background:#0b0912}
.tcard .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.8) brightness(.8)}
.tcard .bg.f0{background-image:url('{{img:city}}')}.tcard .bg.f1{background-image:url('{{img:clouds}}')}.tcard .bg.f2{background-image:url('{{img:temple}}')}.tcard .bg.f3{background-image:url('{{img:colon}}')}
.tcard::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,4,9,.88) 12%,rgba(5,4,9,.25) 70%,rgba(5,4,9,.45))}
.tcard>*:not(.bg){position:relative;z-index:1}
.tcard .tp{display:flex;align-items:center;gap:7px}
.tcard .cat{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);color:#fff;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.tcard .tt{font-size:13px;font-weight:700;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .st{display:flex;gap:11px;color:rgba(255,255,255,.85);font-size:11.5px;align-items:center}
.tcard .st span{display:flex;align-items:center;gap:4px}
.tcard .st svg{width:14px;height:14px}

/* ---------- вкладки ленты ---------- */
.tabs{display:flex;gap:8px;padding:16px 14px 4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:6;background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:34px;padding:0 16px;border-radius:17px;border:1px solid var(--line);background:var(--glass);color:#c9c4e0;font-weight:600;font-size:13px}
.tab.on{background:linear-gradient(180deg,#8b82cf,#665da8);border-color:rgba(255,255,255,.25);color:#fff;box-shadow:0 8px 18px -10px rgba(120,100,230,.9)}
[data-theme=light] .tab{color:var(--dim)}

/* ---------- пост ---------- */
.post{background:var(--glass);border:1px solid var(--line);border-radius:22px;margin:10px 14px;padding:12px 12px 8px;box-shadow:0 14px 34px -24px #000,inset 0 1px 0 rgba(255,255,255,.05)}
.post.full{background:none;border:0;box-shadow:none;border-radius:0;margin:0;padding:calc(10px + var(--safe-t)) 14px 6px}
.ph{display:flex;align-items:center;gap:12px}
.pn{min-width:0;flex:1}
.pn b{font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.pn small{display:block;color:var(--dim);font-size:12.5px;margin-top:1px}
.pn small a{color:var(--dim)}
.tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:9.5px;font-weight:800;letter-spacing:.4px;background:var(--acc-soft);color:var(--acc)}
.tag.bad{background:rgba(255,92,108,.16);color:var(--bad)}
.bi{width:16px;height:16px;flex:none;vertical-align:-3px;margin-left:4px}
.bi.dev{color:#ffc850;filter:drop-shadow(0 0 4px rgba(255,200,80,.45))}
.bi.adm{color:#5ad0ff;filter:drop-shadow(0 0 4px rgba(90,208,255,.45))}
.pname .bi{width:24px;height:24px;margin-left:0}
.tag.pin{background:rgba(255,200,80,.16);color:#ffc850}
.pt{font-family:var(--serif);font-size:20px;font-weight:700;margin:12px 0 2px;cursor:pointer}
.pb{margin:8px 0 0;font-size:15px;word-wrap:break-word;overflow-wrap:anywhere}
.pb.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--acc);font-weight:600;margin-top:4px;display:inline-block}
.imgs{display:grid;gap:4px;margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.imgs.n1{grid-template-columns:1fr}.imgs.n2,.imgs.n4{grid-template-columns:1fr 1fr}.imgs.n3{grid-template-columns:2fr 1fr}
.imgs .mt{position:relative;min-height:0;overflow:hidden;background:#0b0912;cursor:zoom-in;line-height:0}
.imgs .mt img,.imgs .mt video{width:100%;height:100%;object-fit:cover;max-height:300px;display:block;background:#0b0912}
.imgs.n1 .mt img,.imgs.n1 .mt video{max-height:320px}
.full .imgs.n1 .mt img,.full .imgs.n1 .mt video{max-height:70vh}
.imgs.n2 .mt,.imgs.n4 .mt,.imgs.n3 .mt:not(:first-child),.imgs.big .mt{aspect-ratio:1}
.imgs.n3 .mt:first-child{grid-row:span 2}
.imgs.big{grid-template-columns:1fr 1fr}.imgs.big.odd .mt:first-child{grid-column:span 2;aspect-ratio:16/10}
.imgs .mt.vid video:not([src]){height:100%;min-height:150px}.imgs.n1 .mt.vid video:not([src]){min-height:220px}
.imgs .mp{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none}.imgs .mp svg{width:24px;height:24px;margin-left:2px}
.imgs .mvs{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;line-height:1.2}
.imgs .mmore{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-size:26px;font-weight:700;line-height:1}
.acts{display:flex;align-items:center;gap:6px;margin-top:8px;margin-left:-6px}
.act{border:0;background:none;display:flex;align-items:center;gap:7px;color:#aaa5c4;padding:8px 10px;border-radius:14px;font-size:14px}
.act svg{width:21px;height:21px}
.act:active{background:var(--card2)}
.act.on{color:var(--bad)}.act.on.sv{color:var(--acc)}
.act.on svg{fill:currentColor}
.empty{text-align:center;color:var(--dim);padding:50px 24px}
.empty .big{width:54px;height:54px;margin:0 auto 12px;color:#6f6a88}
.empty .big svg{width:54px;height:54px;stroke-width:1.2}

/* ---------- кнопки / поля ---------- */
.btn{border:0;border-radius:22px;height:44px;padding:0 22px;font-weight:600;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#8b82cf,#665da8);border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 22px -12px rgba(120,100,230,.9),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);border:1px solid var(--line2);color:var(--txt);box-shadow:none}
.btn.bad{background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.3);color:var(--bad);box-shadow:none}
.btn.sm{height:38px;padding:0 17px;font-size:14px;border-radius:19px}
.btn svg{width:19px;height:19px}
.btn:disabled{opacity:.5;box-shadow:none}
.inp{width:100%;border:1px solid var(--line);background:var(--glass);color:var(--txt);border-radius:18px;padding:14px 16px;font:inherit;outline:0;height:52px}
.inp::placeholder{color:#6f6a88}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:none;min-height:130px;height:auto}
.lbl{display:block;font-size:15px;color:#cfcae6;margin:20px 2px 8px;font-weight:500}
.pad{padding:12px 14px}

/* ---------- шапка внутренних экранов ---------- */
.ph2{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--safe-t)) 14px 8px;position:relative;z-index:2}
.ph2 h2{margin:0;font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1}
.ph2 .ib.round{width:44px;height:44px}
.stitle{font-family:var(--serif);font-size:23px;font-weight:600;margin:6px 16px 12px}
.search-box{display:flex;align-items:center;gap:10px;margin:10px 14px 4px;height:52px;padding:0 16px;border-radius:26px;color:var(--dim)}
.search-box input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:inherit;min-width:0}
.search-box input::placeholder{color:#6f6a88}

/* ---------- строки списков ---------- */
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
.row:active{background:var(--card2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t small{color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.grow{display:flex;align-items:center;gap:14px;margin:8px 14px;padding:0 16px;min-height:64px;border-radius:20px;cursor:pointer;color:var(--txt)}
.grow:active{filter:brightness(1.3)}
.grow .gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#d6d1ee;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.grow .gi svg{width:25px;height:25px}
.grow .gi.gold{color:var(--gold);background:none;border:0}
.grow .gi.gold svg{width:30px;height:30px}
.grow .t{flex:1;min-width:0;padding:10px 0}
.grow .t b{display:block;font-weight:600;font-size:15.5px}
.grow .t small{display:block;color:var(--dim);font-size:13px}
.grow>svg{width:20px;height:20px;color:#7e7a96}
.unr{min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--acc);display:block;margin:6px 4px 0 auto;box-shadow:0 0 10px rgba(157,146,230,.6)}
.sec{padding:6px 16px;color:var(--dim);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-top:10px}

/* ---------- комментарии ---------- */
.cm-h{display:flex;align-items:center;justify-content:space-between;margin:10px 14px 4px;height:50px;padding:0 18px;border-radius:25px;cursor:pointer;font-weight:500;font-size:15.5px}
.cm-h svg{width:20px;height:20px;transition:transform .2s;color:#aaa5c4}
.cm-h.shut svg{transform:rotate(-90deg)}
.cmt{display:flex;gap:10px;padding:10px 16px}
.cmt.rep{padding-left:58px}
.cb{flex:1;min-width:0}
.cb .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cb .h b{font-size:14.5px;font-weight:600}.cb .h small{color:var(--dim);font-size:12px}
.cb p{margin:2px 0;overflow-wrap:anywhere}
.cb .ca{display:flex;gap:16px;color:var(--dim);font-size:13px;margin-top:2px}
.cb .ca button{border:0;background:none;color:inherit;padding:2px 0;display:flex;align-items:center;gap:4px}
.cb .ca button.on{color:var(--bad)}
.cedit textarea{width:100%;box-sizing:border-box;min-height:52px;max-height:200px;resize:none;border:1px solid var(--line,rgba(255,255,255,.14));border-radius:14px;background:transparent;color:inherit;font:inherit;padding:10px 12px;margin:4px 0}
.cedit-b{display:flex;gap:8px;justify-content:flex-end;margin-bottom:2px}
.cedit-b .btn{height:34px;padding:0 14px;font-size:13px}
.cb .ca button.on svg{fill:currentColor}
.del{color:var(--dim);font-style:italic}
.cform{position:sticky;bottom:0;z-index:7;padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:10px;align-items:center;background:linear-gradient(0deg,var(--bg) 70%,transparent)}
.cform textarea{flex:1;border:1px solid var(--line);background:var(--glass);color:var(--txt);border-radius:26px;padding:14px 18px;font:inherit;resize:none;max-height:120px;height:52px;outline:0;line-height:1.3}
.cform textarea::placeholder{color:#6f6a88}
.send{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:linear-gradient(180deg,#8b82cf,#665da8);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:22px;height:22px}
.send:disabled{opacity:.45}
.reply-to[hidden]{display:none}
.reply-to{padding:6px 18px;background:var(--card2);font-size:13px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}

/* ---------- профиль ---------- */
.pcover{position:absolute;left:0;right:0;top:0;height:calc(400px + var(--safe-t));background:url('{{img:statue}}') right -80px top -10px/auto 100% no-repeat;z-index:0}
.pcover.own{background-size:cover;background-position:center}
.pcover video,.ed-ban video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pcover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,4,9,.7) 0,transparent 55%),linear-gradient(0deg,var(--bg) 4%,rgba(5,4,9,.35) 55%,transparent)}
[data-theme=light] .pcover{opacity:.25}
.pwrap{position:relative;z-index:1}
.ptop{display:flex;justify-content:space-between;padding:calc(14px + var(--safe-t)) 14px 0}
.ptop .ib{width:46px;height:46px}
.pmain{padding:60px 18px 0}
.pavrow{display:flex;align-items:flex-end;justify-content:space-between}
.pname{font-family:var(--serif);font-size:34px;font-weight:600;margin:16px 0 0;display:flex;align-items:center;gap:10px;line-height:1.1;flex-wrap:wrap}
.pname svg{width:26px;height:26px;color:var(--gold)}
.puser{color:#b5b0cf;margin-top:2px;font-size:16px}
.pstat{display:flex;align-items:center;gap:8px;color:#aaa5c4;font-size:13.5px;margin-top:8px}
.pstat i{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pbio{margin:10px 0 0;color:#d7d3e8}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 10px}
.stats3>div{text-align:center;cursor:pointer;padding:2px 0;border-left:1px solid var(--line)}
.stats3>div:first-child{border-left:0}
.stats3 b{display:block;font-size:24px;font-weight:700}
.stats3 small{color:#aaa5c4;font-size:13.5px}

/* ---------- чаты ---------- */
.chead{display:flex;align-items:center;justify-content:space-between;padding:calc(20px + var(--safe-t)) 16px 6px}
.chead h2{margin:0;font-family:var(--serif);font-size:34px;font-weight:600}
.chead .ib.round{border-radius:15px;width:46px;height:46px}
.crow{display:flex;align-items:center;gap:14px;padding:11px 16px;cursor:pointer}
.crow:active{background:var(--card2)}
.crow .t{flex:1;min-width:0}
.crow .t b{display:flex;align-items:center;gap:6px;font-size:16.5px;font-weight:600}
.crow .t small{display:block;color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.crow .r{text-align:right;flex:none;color:var(--dim);font-size:13.5px}
.vf{width:18px;height:18px;flex:none}
.chat{display:flex;flex-direction:column;height:100%}
.chat-h{flex:none;display:flex;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 12px 10px;border-bottom:1px solid var(--line)}
.chat-log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:80%;padding:9px 14px;border-radius:20px 20px 20px 6px;background:var(--glass);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,#7d74c2,#5d559c);border-color:rgba(255,255,255,.2);color:#fff;border-radius:20px 20px 6px 20px}
.msg small{display:block;font-size:10.5px;opacity:.65;text-align:right;margin-top:2px}
/* вложения в чате: меню, пузыри, просмотрщик */
.attb{flex:none;width:44px;height:50px;border:0;background:transparent;color:var(--dim);display:grid;place-items:center;cursor:pointer;margin-right:-6px;border-radius:50%;transition:color .2s,transform .25s var(--spring)}
.attb:active{transform:scale(.88);color:var(--acc)}
.attb svg{width:24px;height:24px}
.cform.kv-recording .attb{visibility:hidden}
.am-row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;color:var(--txt);font:inherit;font-weight:600;padding:12px 14px;border-radius:16px;cursor:pointer;text-align:left}
.am-row:active{background:var(--card2)}
.am-row .am-i{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff}
.am-row .am-i svg{width:23px;height:23px}
.am-row small{display:block;font-weight:400;color:var(--dim);font-size:12.5px;margin-top:1px}
.am-i.p{background:linear-gradient(180deg,#58c4a4,#2f9d80)}.am-i.v{background:linear-gradient(180deg,#ee8c6b,#d0623f)}.am-i.f{background:linear-gradient(180deg,#8b82cf,#5d559c)}
.msg.mm{padding:4px;max-width:min(310px,80%);white-space:normal}
.msg.mm .mi{position:relative;display:block;border-radius:17px 17px 17px 5px;overflow:hidden;cursor:pointer;background:#0c0a14;line-height:0;min-width:150px}
.msg.me.mm .mi{border-radius:17px 17px 5px 17px}
.msg.mm .mi img,.msg.mm .mi video{display:block;width:100%;max-height:340px;min-height:110px;object-fit:cover;background:#0c0a14}
.msg.mm .mplay{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none}
.msg.mm .mplay svg{width:24px;height:24px;margin-left:2px}
.msg.mm .mc{padding:7px 9px 0;white-space:pre-wrap;line-height:1.35}
.msg.mm small{padding:0 8px 2px}
.msg.mf-b{padding:10px 12px 7px;min-width:210px;white-space:normal}
.mf{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.mf .mf-i{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#9f95e4,#6d64b6);color:#fff;box-shadow:0 5px 14px -5px rgba(0,0,0,.5)}
.msg.me .mf .mf-i{background:#fff;color:#5d559c}
.mf .mf-i svg{width:22px;height:22px}
.mf .mf-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.mf .mf-t b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.mf .mf-t span{font-size:12px;opacity:.7}
.msg.mf-b .mc{padding-top:7px;white-space:pre-wrap}
.sx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin:0 4px 12px}
.sx-it{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;font-size:11px;color:var(--dim);line-height:1.25}
.sx-it img,.sx-it video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sx-it .sx-n{position:relative;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sx-it .sx-ic{position:relative;color:var(--acc)}.sx-it .sx-ic svg{width:26px;height:26px}
.sx-it .sx-vb{position:absolute;left:6px;bottom:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}.sx-vb svg{width:12px;height:12px}
.sx-it .sx-x{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer;z-index:2}.sx-x svg{width:13px;height:13px}
.sx-it.ed{cursor:pointer}
.sx-pe{position:absolute;right:6px;bottom:6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}.sx-pe svg{width:13px;height:13px}
.sx-pe.big{background:var(--bad)}
.sx-h{margin:-4px 6px 12px;font-size:12.5px;color:var(--dim);text-align:center}.sx-h[hidden]{display:none}
button.mf{border:0;background:none;padding:0;font:inherit;text-align:left;width:100%;cursor:pointer}
.msg.mm .mi video:not([src]){height:190px;min-height:0}
.msg.mm .mvs{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;line-height:1.2}
.gal-ld{width:34px;height:34px;border-width:4px}
.gal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.96);display:flex;flex-direction:column;animation:fadeIn .22s ease both;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.gal-top{flex:none;display:flex;align-items:center;gap:6px;padding:calc(8px + var(--safe-t)) 10px 8px;color:#fff;z-index:2}
.gal-top .ib{color:#fff}.gal-n{font-weight:600;padding-left:8px;font-variant-numeric:tabular-nums}.gal-sp{flex:1}
.gal-st{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal-st img,.gal-st video{max-width:100%;max-height:100%;object-fit:contain;animation:lbIn .3s var(--ease) both;-webkit-user-drag:none}
.gal-st video{width:100%;height:100%;background:#000}
.gal-p,.gal-nx{position:absolute;top:50%;margin-top:-23px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:3;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.gal-p{left:10px}.gal-nx{right:10px}.gal-p[hidden],.gal-nx[hidden]{display:none}
@media (hover:none){.gal-p,.gal-nx{display:none}}

{{inc:music/music.css}}
.supbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}

/* ---------- новый пост ---------- */
.pick{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border-radius:18px;cursor:pointer}
.pick .gi{width:30px;height:30px;display:grid;place-items:center;color:#d6d1ee}
.pick .gi svg{width:26px;height:26px}
.pick span:not(.gi){flex:1;font-weight:500}
.pick .gi{flex:none}
.pick>svg{width:20px;height:20px;color:#7e7a96}
.tools{display:flex;gap:6px;margin-top:10px;padding:0 2px}
.tools .ib{width:46px;height:46px;border-radius:14px;color:#cfcae6;border:1px solid var(--line);background:var(--glass)}
.emos{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding:8px;border-radius:16px}
.emos button{border:0;background:none;font-size:23px;padding:4px 6px;border-radius:10px}
.emos[hidden]{display:none}
.addph{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;height:54px;border-radius:27px;color:#d6d1ee;font-weight:500}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thumbs div{position:relative;width:78px;height:78px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:cover;display:block}
.thumbs div.ed{cursor:pointer}.thumbs div.old{cursor:default}
.thumbs .tv{position:absolute;left:5px;bottom:5px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;pointer-events:none}.thumbs .tv svg{width:11px;height:11px;margin-left:1px}
.thumbs .tvbig{position:absolute;inset:0;display:grid;place-items:center;align-content:center;background:var(--card2);color:var(--dim);font-size:11px;text-align:center;line-height:1.3;padding:4px}.thumbs .tvbig svg{width:22px;height:22px;color:var(--acc);display:block;margin:0 auto 2px}
.thumbs .sx-pe{right:4px;bottom:4px;pointer-events:none}
.mhint{margin:8px 2px 0;font-size:12.5px;color:var(--dim)}.mhint[hidden]{display:none}
.thumbs button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1}

/* ---------- нижняя панель ---------- */
nav.bar{position:absolute;left:14px;right:14px;bottom:calc(10px + var(--safe-b));z-index:20;height:58px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;border-radius:32px;
  background:linear-gradient(180deg,rgba(34,30,46,.94),rgba(14,12,22,.96));border:1px solid var(--line2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px -14px #000,inset 0 1px 0 rgba(255,255,255,.08)}
[data-theme=light] nav.bar{background:rgba(255,255,255,.95)}
nav.bar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#8f8aa6;height:48px;border-radius:20px;position:relative}
nav.bar button svg{width:23px;height:23px}
nav.bar button.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02));box-shadow:inset 0 -2px 0 rgba(157,146,230,.5)}
[data-theme=light] nav.bar button.on{color:#1c1a22}
nav.bar .plus{flex:none;width:52px;height:52px;border-radius:50%;margin:0 4px;color:#fff;background:radial-gradient(circle at 50% 22%,#3b3650,#171420 72%);border:1px solid var(--line2);box-shadow:0 8px 20px -8px #000,inset 0 1px 0 rgba(255,255,255,.15);justify-content:center}
nav.bar .plus.on{background:radial-gradient(circle at 50% 22%,#3b3650,#171420 72%)}
nav.bar .plus svg{width:26px;height:26px;stroke-width:1.5}
nav.bar .badge{top:0;right:calc(50% - 20px)}

/* ---------- всплывающие ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:680px;background:var(--solid);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;padding:14px 8px calc(14px + var(--safe-b));max-height:80%;overflow:auto}
.sheet .row{border-radius:14px;min-height:50px}
.sheet .row.bad{color:var(--bad)}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid var(--line2);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}
.sw.on{background:var(--acc);border-color:transparent}.sw.on::after{transform:translateX(18px)}
.nbn{position:fixed;left:12px;right:12px;top:calc(10px + var(--safe-t));z-index:120;max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center;padding:13px 16px;border-radius:20px;background:var(--solid);color:var(--txt);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.65);cursor:pointer;animation:nbnIn .38s var(--ease) both}
.nbn.out{animation:nbnOut .25s var(--ease) both}
.nbn svg{width:24px;height:24px;color:var(--acc);flex:none}.nbn b{display:block;font-size:14.5px}.nbn small{display:block;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbn .t{min-width:0;flex:1}
@keyframes nbnIn{from{opacity:0;transform:translateY(-24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes nbnOut{to{opacity:0;transform:translateY(-18px)}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--solid);color:var(--txt);border:1px solid var(--line2);padding:12px 18px;border-radius:18px;z-index:99;max-width:86%;box-shadow:0 12px 34px rgba(0,0,0,.6)}
.toast.err{border-color:var(--bad);color:var(--bad)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:80;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%}
.spin{width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pal{display:flex;gap:12px;flex-wrap:wrap}
.pal i{width:36px;height:36px;border-radius:50%;display:block;border:3px solid transparent;cursor:pointer}
.pal i.on{border-color:var(--txt)}

/* ---------- вход ---------- */
.login{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:36px 26px calc(46px + var(--safe-b));min-height:100%;gap:12px;overflow:hidden}
.login::before{content:"";position:absolute;inset:0;background:url('{{img:statue}}') 70% 0/auto 62% no-repeat}
.login::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 24%,rgba(5,4,9,.5) 58%,rgba(5,4,9,.1) 80%)}
.login>*{position:relative;z-index:1}
.login .logo{font-family:var(--serif);font-size:44px;font-weight:600;letter-spacing:3px;line-height:1;text-transform:uppercase}.login .logo b{display:block;font-weight:500;color:#b3aed0;font-size:42px;letter-spacing:2px}
.code{font:700 26px/1 ui-monospace,Menlo,monospace;letter-spacing:3px;background:var(--glass);border:1px dashed var(--acc);border-radius:18px;padding:16px 20px;color:var(--acc)}

/* =================== АНИМАЦИИ =================== */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastIO{0%{opacity:0;transform:translate(-50%,18px) scale(.94)}9%{opacity:1;transform:translate(-50%,0) scale(1)}86%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,10px) scale(.96)}}
@keyframes lbIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.55) rotate(-8deg)}55%{transform:scale(.88) rotate(4deg)}80%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ring{from{opacity:.7;transform:scale(.4)}to{opacity:0;transform:scale(2.2)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1.02)}50%{transform:translate3d(-6px,-5px,0) scale(1.05)}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg) translateY(0)}50%{transform:rotate(1.2deg) translateY(-4px)}}
@keyframes twinkle{0%,100%{filter:drop-shadow(0 0 6px rgba(200,190,255,.55));transform:scale(1) rotate(0)}50%{filter:drop-shadow(0 0 14px rgba(220,212,255,.95));transform:scale(1.12) rotate(14deg)}}
@keyframes shine{0%{transform:translateX(-130%) skewX(-18deg)}60%,100%{transform:translateX(230%) skewX(-18deg)}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(157,146,230,.65)}70%{box-shadow:0 0 0 9px rgba(157,146,230,0)}100%{box-shadow:0 0 0 0 rgba(157,146,230,0)}}
@keyframes pulseOk{0%{box-shadow:0 0 0 0 rgba(76,214,160,.7)}70%{box-shadow:0 0 0 8px rgba(76,214,160,0)}100%{box-shadow:0 0 0 0 rgba(76,214,160,0)}}
@keyframes badgePop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes glowAv{0%,100%{box-shadow:0 0 0 6px rgba(157,146,230,.14),0 0 38px rgba(157,146,230,.28)}50%{box-shadow:0 0 0 10px rgba(157,146,230,.08),0 0 56px rgba(157,146,230,.5)}}
@keyframes gem{0%,100%{filter:drop-shadow(0 0 3px var(--g))}50%{filter:drop-shadow(0 0 9px var(--g))}}
@keyframes sparkle{0%,70%,100%{opacity:0;transform:scale(0) rotate(0)}80%{opacity:1;transform:scale(1) rotate(90deg)}90%{opacity:0;transform:scale(.4) rotate(180deg)}}
@keyframes crownTilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes gemSpin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.78)}}
@keyframes rippleA{to{transform:scale(1);opacity:0}}
@keyframes borderGlow{0%,100%{border-color:var(--line2)}50%{border-color:rgba(157,146,230,.55)}}
@keyframes logoGlow{0%,100%{text-shadow:0 0 18px rgba(157,146,230,.2)}50%{text-shadow:0 0 34px rgba(190,180,255,.6)}}
@keyframes underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* вход на экран: сам экран + каскад карточек */
#view.enter{animation:fadeIn .28s var(--ease) both}
#view .post,#view .grow,#view .crow,#view .tcard,#view .cmt,#view .row,#view .hero,#view .compose-row,#view .pills,#view .stitle,#view .pick,#view .pad>.glass,#view .stats3,#view .ph2,#view .search-box,#view .emos{animation:fadeUp .5s var(--ease) backwards}
#view .tcard{animation-name:slideR}
#view .cmt.rep{animation-name:slideR}
#view .post:nth-child(2),#view .grow:nth-child(2),#view .crow:nth-child(2),#view .tcard:nth-child(2),#view .cmt:nth-child(2),#view .row:nth-child(2){animation-delay:.05s}
#view .post:nth-child(3),#view .grow:nth-child(3),#view .crow:nth-child(3),#view .tcard:nth-child(3),#view .cmt:nth-child(3),#view .row:nth-child(3){animation-delay:.1s}
#view .post:nth-child(4),#view .grow:nth-child(4),#view .crow:nth-child(4),#view .tcard:nth-child(4),#view .cmt:nth-child(4),#view .row:nth-child(4){animation-delay:.15s}
#view .post:nth-child(5),#view .grow:nth-child(5),#view .crow:nth-child(5),#view .tcard:nth-child(5),#view .cmt:nth-child(5),#view .row:nth-child(5){animation-delay:.2s}
#view .post:nth-child(6),#view .grow:nth-child(6),#view .crow:nth-child(6),#view .tcard:nth-child(6),#view .cmt:nth-child(6),#view .row:nth-child(6){animation-delay:.25s}
#view .post:nth-child(7),#view .grow:nth-child(7),#view .crow:nth-child(7),#view .tcard:nth-child(7),#view .cmt:nth-child(7),#view .row:nth-child(7){animation-delay:.3s}
#view .post:nth-child(8),#view .grow:nth-child(8),#view .crow:nth-child(8),#view .tcard:nth-child(8),#view .cmt:nth-child(8),#view .row:nth-child(8){animation-delay:.35s}
#view .compose-row{animation-delay:.05s}#view .pills{animation-delay:.1s}#view .hero{animation-delay:.15s}
.post.full{animation-name:fadeIn!important}

/* профиль */
.pavrow .av.xl{animation:popIn .6s var(--spring) both,glowAv 4.5s ease-in-out .7s infinite}
.pname{animation:fadeUp .6s var(--ease) .12s both}
.puser,.pstat,.pbio{animation:fadeUp .6s var(--ease) .2s both}
.stats3>div{animation:fadeUp .6s var(--ease) backwards}
.stats3>div:nth-child(2){animation-delay:.08s}.stats3>div:nth-child(3){animation-delay:.16s}
.pcover{animation:drift 14s ease-in-out infinite;transform-origin:70% 20%}
.pstat i{animation:pulseOk 2.2s ease-out infinite}
.stats3>div,.stats3 b{transition:transform .25s var(--ease),color .25s}
.stats3>div:active{transform:scale(.94)}

/* шапка, статуя, розы */
.mast .st{animation:drift 12s ease-in-out infinite}
.mast::before{transform-origin:20% 100%;animation:sway 9s ease-in-out infinite}
.brand .star{animation:twinkle 3.6s ease-in-out infinite}
.brand h1{animation:fadeUp .7s var(--ease) both}
.mh .ib{transition:transform .25s var(--spring),background .2s}
.mh .ib:active{transform:scale(.86)}
.mh .badge,.nav .badge,nav.bar .badge,.pill .badge{animation:badgePop .4s var(--spring) both}
.badge:not([hidden]){animation:badgePop .4s var(--spring) both,pulseDot 2.4s ease-out 1s infinite}
#app::after{transition:opacity .6s var(--ease)}
#app[data-page=chats]::after,#app[data-page=new]::after,#app[data-page=boards]::after{animation:floatY 8s ease-in-out infinite}

/* нажатия и наведение */
.ib,.act,.pill,.tab,.btn,.grow,.crow,.row,.post,.tcard,.hero,.compose-row,.pick,.send,.thumbs div,.pal i,.av,.cm-h{transition:transform .28s var(--spring),background .22s,border-color .22s,box-shadow .28s,filter .22s,color .22s,opacity .22s}
.ib:active,.pill:active,.tab:active,.send:active,.pal i:active{transform:scale(.9)}
.act:active{transform:scale(.88)}
.grow:active,.pick:active,.compose-row:active,.hero:active,.tcard:active{transform:scale(.975)}
.crow:active,.row:active{transform:scale(.985)}
.av:active{transform:scale(.92)}
.post:not(.full):active{transform:scale(.992)}
@media (hover:hover){
  .post:not(.full):hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 22px 44px -24px #000,0 0 0 1px rgba(157,146,230,.12),inset 0 1px 0 rgba(255,255,255,.07)}
  .grow:hover,.pick:hover,.compose-row:hover{transform:translateY(-2px);border-color:var(--line2);filter:brightness(1.15)}
  .tcard:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 16px 30px -16px rgba(0,0,0,.9)}
  .tcard .bg{transition:transform .6s var(--ease)}.tcard:hover .bg{transform:scale(1.12)}
  .hero .bgph{transition:transform .8s var(--ease)}.hero:hover .bgph{transform:scale(1.06)}
  .crow:hover,.row:hover{background:var(--card)}
  .act:hover{background:var(--card2);color:#fff}
  .ib:hover{background:var(--card2)}
  .pill:hover,.tab:hover{transform:translateY(-1px);border-color:var(--line2)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(120,100,230,1),inset 0 1px 0 rgba(255,255,255,.25)}
  .btn.ghost:hover,.btn.bad:hover{box-shadow:none}
  .av:hover{transform:scale(1.07)}
  .imgs .mt img{transition:transform .6s var(--ease)}.imgs .mt img:hover{transform:scale(1.05)}
  .pal i:hover{transform:scale(1.15)}
  nav.bar button:hover:not(.on){color:#fff}
}
.imgs{isolation:isolate}
.btn:active{transform:scale(.95)!important}

/* лайк / закладка / комментарии */
.act svg{transition:transform .2s var(--spring),fill .2s,color .2s}
.act.pop svg{animation:heartPop .55s var(--spring)}
.act.pop{position:relative}
.act.pop::after{content:"";position:absolute;left:10px;top:50%;width:21px;height:21px;margin-top:-10.5px;border-radius:50%;border:2px solid currentColor;pointer-events:none;animation:ring .55s ease-out forwards}
.act.on.sv.pop svg{animation:popIn .5s var(--spring)}
.cb .ca button svg{transition:transform .2s var(--spring)}
.cb .ca button.pop svg{animation:heartPop .55s var(--spring)}
.cm-h svg{transition:transform .3s var(--spring)}
.act span,.cb .ca button{transition:color .2s}

/* вкладки и пилюли */
.tab.on,.pill.on{animation:popIn .35s var(--spring)}
.tabs .tab{position:relative;overflow:hidden}

/* кнопки: блик и ripple */
.btn{position:relative;overflow:hidden}
.btn:not(.ghost):not(.bad):not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 4.5s ease-in-out 1.2s infinite;pointer-events:none}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rippleA .6s ease-out forwards;pointer-events:none}
.send,.tab{position:relative;overflow:hidden}
.send:not(:disabled){animation:borderGlow 3.5s ease-in-out infinite}

/* значки разработчика и админа */
.bi{--g:rgba(255,200,80,.6);transform-origin:50% 80%}
.bi.dev{--g:rgba(255,200,80,.75);animation:gem 2.8s ease-in-out infinite,crownTilt 5s ease-in-out 1s infinite;filter:none}
.bi.adm{--g:rgba(90,208,255,.8);animation:gem 2.8s ease-in-out .6s infinite,gemSpin 3.6s ease-in-out infinite;filter:none}

/* нижняя панель */
nav.bar{animation:fadeUp .6s var(--ease) .1s backwards}
nav.bar button svg{transition:transform .3s var(--spring)}
nav.bar button.on svg{transform:translateY(-2px) scale(1.12)}
nav.bar button{transition:color .25s,background .3s,transform .25s var(--spring)}
nav.bar button:active{transform:scale(.88)}
nav.bar .plus{transition:transform .4s var(--spring),box-shadow .3s,background .3s}
nav.bar .plus:hover{transform:rotate(90deg) scale(1.06)}
nav.bar .plus:active{transform:rotate(90deg) scale(.9)}
nav.bar .plus.on{transform:rotate(135deg)}

/* всплывающие окна */
.sheet-bg{animation:fadeIn .25s ease both}
.sheet{animation:sheetUp .38s var(--ease) both}
.sheet .row{animation:fadeUp .4s var(--ease) backwards}
.sheet .row:nth-child(2){animation-delay:.04s}.sheet .row:nth-child(3){animation-delay:.08s}.sheet .row:nth-child(4){animation-delay:.12s}.sheet .row:nth-child(5){animation-delay:.16s}.sheet .row:nth-child(n+6){animation-delay:.2s}
.toast{animation:toastIO 2.6s var(--ease) both}
.lb{animation:fadeIn .25s ease both}
.lb img{animation:lbIn .4s var(--ease) both}

/* прочее */
.spin{animation:sp .8s linear infinite,fadeIn .3s .15s both}
.empty{animation:fadeUp .6s var(--ease) both}
.empty .big{animation:floatY 3.6s ease-in-out infinite}
.dot{animation:pulseDot 2s ease-out infinite}
.unr{animation:badgePop .4s var(--spring) both}
.tag{animation:fadeIn .4s both}
.tag.pin{animation:gem 3s ease-in-out infinite;--g:rgba(255,200,80,.5)}
.th b svg{animation:floatY 3.2s ease-in-out infinite}
.inp,.search-box,.cform textarea{transition:border-color .25s,box-shadow .3s,background .25s}
.inp:focus,.cform textarea:focus{box-shadow:0 0 0 4px var(--acc-soft)}
.search-box:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.code{animation:borderGlow 2.8s ease-in-out infinite}
.login .logo{animation:fadeUp .8s var(--ease) both,logoGlow 4s ease-in-out 1s infinite}
.login>*:nth-child(2){animation:fadeUp .8s var(--ease) .12s both}
.login>*:nth-child(3){animation:fadeUp .8s var(--ease) .24s both}
.login>*:nth-child(4){animation:fadeUp .8s var(--ease) .36s both}
.login::before{animation:drift 14s ease-in-out infinite}
.thumbs div{animation:popIn .4s var(--spring) both}
.vf{animation:popIn .5s var(--spring) both}
.pal i.on{animation:popIn .35s var(--spring)}
.hero .go{transition:transform .35s var(--spring)}
.hero:hover .go{transform:translateX(4px)}
.hero .go svg{animation:floatY 2.8s ease-in-out infinite}
.hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;z-index:1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:shine 7s ease-in-out 2s infinite;pointer-events:none}

/* кнопки и активные вкладки следуют акцентному цвету / теме профиля */
.btn:not(.ghost):not(.bad),.tab.on{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 88%,#000),color-mix(in srgb,var(--acc) 70%,#000))}
/* =================== ПРОФИЛЬ (как в мини-аппе) =================== */
.avw{position:relative;display:inline-block}
.avw.on::after{content:"";position:absolute;right:10px;bottom:10px;width:20px;height:20px;border-radius:50%;background:var(--ok);border:3px solid var(--bg);animation:pulseOk 2.2s ease-out infinite}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:#c9c4e0;font-size:12.5px;font-weight:600;transition:all .22s var(--spring)}
.chip svg{width:15px;height:15px}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--txt)}
.chip:active{transform:scale(.93)}
[data-theme=light] .chip{color:var(--dim)}
.chip.rpb{margin-top:10px;height:28px;font-size:12px;color:var(--dim)}
.bdgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bdg{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:13px;font-size:12px;font-weight:700;background:rgba(76,214,160,.14);color:var(--ok);animation:popIn .5s var(--spring) both}
.bdg.bad{background:rgba(255,92,108,.15);color:var(--bad)}
.bchip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:30px;padding:0 13px;border-radius:15px;font-size:12.5px;font-weight:700;background:var(--card2);border:1px solid var(--line2)}
.bchip[class*="t-"]{color:var(--txt)}
.blk-note{margin-top:12px;padding:9px 14px;border-radius:14px;background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.3);color:var(--bad);font-size:13.5px}
.stats3.alt{margin-top:0;border-top:1px solid var(--line);padding-top:14px}
.grow .gi.role{background:none;border:0;width:44px}
.grow .gi.role .bi{width:32px;height:32px;margin:0}
.ptabs{display:flex;gap:8px;padding:18px 14px 4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.ptabs::-webkit-scrollbar{display:none}
.ptabs .tab{flex:none}
.card-l{margin:0 14px;border-radius:20px;padding:4px 16px}
.hist{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hist b{text-align:right;font-weight:700}
.hist small{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:2px}
.rv-sum{display:flex;align-items:center;gap:18px;padding:18px;border-radius:24px;margin:10px 14px 12px}
.rv-big{text-align:center;flex:none}
.rv-big b{display:block;font-family:var(--serif);font-size:42px;line-height:1}
.rv-big small{display:block;color:var(--dim);font-size:12px;margin-top:4px}
.stars{color:#f1b94d;letter-spacing:1px;font-size:15px;flex:none}
.rv-bars{flex:1;min-width:0;display:grid;gap:5px}
.rv-bars div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.rv-bars div span:first-child{width:10px;text-align:right}
.rv-bars i{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.rv-bars i u{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f1b94d,#e4aa42);transform-origin:left;animation:underline .9s var(--ease) .2s backwards}
.rv-bars div span:last-child{width:18px}
.rcard{padding:14px 16px;margin:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--glass)}
.rcard-h{display:flex;align-items:center;gap:12px}
.rcard-h>div:not(.av):not(.stars){min-width:0;flex:1}
.rcard-h b{display:block;font-size:15px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard-h small{color:var(--dim);font-size:12px}
.rcard p{margin:10px 0 0;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.rcard .rv-photo{display:block;margin-top:10px;max-width:100%;max-height:260px;border-radius:16px;border:1px solid var(--line);cursor:zoom-in}
.mine-tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-size:11px;font-weight:700}
.rform{padding:20px 18px 18px;margin:10px 14px 12px;border-radius:26px;border:1px solid var(--line2);background:linear-gradient(160deg,var(--acc-soft),transparent 60%),var(--glass)}
.rform h3{margin:0 0 4px;font-size:19px;font-family:var(--serif)}
.rform .rsub{margin:0 0 14px;color:var(--dim);font-size:13.5px}
.rstars{display:flex;justify-content:center;gap:6px;margin:4px 0 6px}
.rstars button{border:0;background:transparent;padding:2px;font-size:40px;line-height:1;color:var(--line2);transition:transform .25s var(--spring),color .15s}
.rstars button.on{color:#f1b94d;text-shadow:0 4px 14px rgba(241,185,77,.5)}
.rstars button:active{transform:scale(.8)}
.rlabel{text-align:center;color:var(--dim);font-size:13.5px;margin-bottom:12px;min-height:20px}
.rcount{text-align:right;color:var(--dim);font-size:12px;margin:4px 4px 0}
.rshot{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;border-radius:16px;border:1px dashed var(--line2);color:var(--dim);cursor:pointer;font-size:14px}
.rshot small{display:block;font-size:12px;opacity:.8}
.rshot .ri svg{width:24px;height:24px}
.rshot img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.rshot .rx{margin-left:auto;border:0;background:var(--card2);color:var(--txt);width:28px;height:28px;border-radius:50%}
.sheet.rep{padding:18px 16px calc(16px + var(--safe-b))}
.sheet .sh-t{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 4px 14px}
.thumbs div img{display:block}
.ed-card{padding:16px;border-radius:22px;margin-bottom:6px}
.ed-av{display:flex;align-items:center;gap:16px}
.ed-btns{display:flex;gap:8px;flex-wrap:wrap}
.ed-ban{position:relative;overflow:hidden;margin-top:14px;height:110px;border-radius:16px;border:1px dashed var(--line2);background:var(--card) center/cover no-repeat;display:grid;place-items:center;color:var(--dim);font-size:13px}
.ed-ban span{display:flex;align-items:center;gap:8px}
.ed-ban span svg{width:20px;height:20px}
.ed-ban.has span{display:none}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 8px;border-radius:19px;border:1px solid var(--line);background:var(--glass);color:var(--txt);font-size:13.5px;font-weight:600;transition:all .22s var(--spring)}
.tchip span{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2)}
.tchip.on{border-color:var(--acc);background:var(--acc-soft)}
.tchip:active{transform:scale(.94)}
.pal input[type=color]{width:36px;height:36px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;cursor:pointer}
#view .rcard,#view .rform,#view .rv-sum,#view .card-l,#view .bdgs,#view .chips-row,#view .bchip,#view .blk-note{animation:fadeUp .5s var(--ease) backwards}
@media (hover:hover){.rcard:hover{border-color:var(--line2)}.chip:hover,.tchip:hover{border-color:var(--line2);transform:translateY(-1px)}}

/* уважаем настройку «уменьшить анимацию» */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/*KV-CSS:BEGIN*/
/* ===== голосовые сообщения (источник: tools/voice/voice.css) ===== */
.vm{display:flex!important;align-items:center;gap:11px;width:min(292px,78vw);min-width:220px;padding:9px 14px 7px 9px!important;white-space:normal!important;
  --vc:var(--acc,#9d92e6);--vd:rgba(255,255,255,.26)}
.vm[data-mine="1"]{--vc:#fff;--vd:rgba(255,255,255,.4)}
[data-theme=light] .vm:not([data-mine="1"]){--vd:rgba(20,16,10,.2)}
.vm .vp{flex:none;width:44px;height:44px;border-radius:50%;border:0;padding:0;margin:0;display:grid;place-items:center;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#9f95e4,#6d64b6);box-shadow:0 5px 14px -5px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.vm .vp:active{transform:scale(.88)}
.vm .vp svg{display:block;margin-left:1px}
.vm.playing .vp svg{margin-left:0}
.vm[data-mine="1"] .vp{background:#fff;color:var(--kv-mine-ink,#5d559c);box-shadow:0 5px 14px -6px rgba(0,0,0,.5)}
.vm.playing .vp{box-shadow:0 0 0 5px color-mix(in srgb,var(--vc) 22%,transparent),0 5px 14px -5px rgba(0,0,0,.5)}
.vm .vc{flex:1;min-width:0}
.vm .vw{position:relative;height:34px;cursor:pointer;touch-action:none;--p:0;-webkit-user-select:none;user-select:none}
.vm .vwv{display:block;width:100%;height:100%;
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:linear-gradient(90deg,var(--vc) calc(var(--p)*100%),var(--vd) calc(var(--p)*100%))}
.vm .vi{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1;margin-top:3px;min-height:16px}
.vm .vt{font-variant-numeric:tabular-nums;opacity:.88}
.vm .vi small{display:block;margin:0 0 0 auto!important;font-size:10.5px;opacity:.68;text-align:right;white-space:nowrap}
.vm .vdot{display:none;flex:none;width:7px;height:7px;border-radius:50%;background:var(--vc)}
.vm[data-heard="0"]:not([data-mine="1"]) .vdot{display:block}
.vm .vs{border:0;border-radius:9px;padding:3px 7px;font-weight:700;font-size:11px;line-height:1;font-family:inherit;color:inherit;background:rgba(255,255,255,.18);cursor:pointer;min-width:30px}
[data-theme=light] .vm:not([data-mine="1"]) .vs{background:rgba(20,16,10,.08)}
.vm .vs[hidden]{display:none}
.vm[data-pending]{opacity:.72}
.vm[data-pending] .vp{pointer-events:none}
.vm[data-pending] .vp svg{display:none}
.vm[data-pending] .vp::after{content:"";width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:kvspin .8s linear infinite}
@keyframes kvspin{to{transform:rotate(360deg)}}

/* кнопка микрофона вместо «отправить», когда поле пустое */
.kv-txt .kv-mic{display:none!important}
.kv-on:not(.kv-txt) .kv-sb{display:none!important}
.kv-mic{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;z-index:6;cursor:pointer;
  transition:transform .22s cubic-bezier(.22,1,.36,1),background .2s,box-shadow .25s}
.kv-mic svg{pointer-events:none}
.kv-mic.hold{background:linear-gradient(180deg,#ff7482,#e0394c)!important;box-shadow:0 0 0 12px rgba(255,92,108,.18),0 8px 22px -6px rgba(255,92,108,.65)!important;animation:none!important}
.kv-locked .kv-mic{animation:none}

/* панель записи поверх поля ввода */
.kv-rec{position:absolute;z-index:5;display:flex;align-items:center;gap:10px;padding:0 16px 0 12px;border-radius:26px;overflow:hidden;
  background:var(--solid,var(--bg,#12101a));border:1px solid var(--line2,rgba(255,255,255,.18));box-shadow:0 10px 30px -14px #000;
  opacity:0;transition:opacity .2s,transform .12s linear;transform:translateX(0)}
.kv-rec.in{opacity:1;animation:kvIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes kvIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.kv-rec[hidden],.kv-lock[hidden]{display:none!important}
.kv-rec .kv-x{display:none;flex:none;width:36px;height:36px;border-radius:50%;border:0;padding:0;place-items:center;color:var(--bad,#ff5c6c);background:rgba(255,92,108,.12);cursor:pointer}
.kv-rec.locked .kv-x{display:grid;margin-left:-4px}
.kv-rec .kv-dot{flex:none;width:11px;height:11px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 0 rgba(255,77,94,.55);animation:kvPulse 1.2s ease-out infinite}
.kv-rec.locked .kv-dot{width:9px;height:9px}
@keyframes kvPulse{0%{box-shadow:0 0 0 0 rgba(255,77,94,.55)}100%{box-shadow:0 0 0 10px rgba(255,77,94,0)}}
.kv-rec .kv-t{flex:none;font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:600;min-width:52px;color:var(--txt,#f4f2fb)}
.kv-rec .kv-cv{flex:1;min-width:30px;height:60%;display:block}
.kv-rec .kv-hint{flex:none;font-size:13.5px;color:var(--dim,#8f8aa6);white-space:nowrap;animation:kvHint 1.6s ease-in-out infinite;transition:color .15s}
.kv-rec .kv-hint.bad{color:var(--bad,#ff5c6c)}
.kv-rec.locked .kv-hint{display:none}
@keyframes kvHint{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.kv-lock{position:absolute;z-index:6;bottom:calc(100% + 6px);width:38px;height:62px;border-radius:19px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;
  color:var(--txt,#f4f2fb);background:var(--solid,#12101a);border:1px solid var(--line2,rgba(255,255,255,.18));box-shadow:0 10px 24px -10px #000;
  animation:kvLock .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes kvLock{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kv-recording textarea{visibility:hidden}
@media (prefers-reduced-motion:reduce){.kv-rec,.kv-rec *,.kv-lock{animation:none!important;transition:none!important}}

/* ===== кружки (видеосообщения) ===== */
.kn{display:block;position:relative;align-self:flex-start;margin:3px 0;-webkit-tap-highlight-color:transparent}
.kn.me{align-self:flex-end}
.kn .kn-c{position:relative;width:min(60vw,236px);aspect-ratio:1;border-radius:50%;cursor:pointer;--p:0;-webkit-user-select:none;user-select:none;
  box-shadow:0 16px 36px -16px rgba(0,0,0,.8);transition:transform .38s cubic-bezier(.34,1.56,.64,1)}
.kn.playing .kn-c{transform:scale(1.045)}
.kn .kn-v{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;box-sizing:border-box;border:2px solid rgba(255,255,255,.16);
  background:radial-gradient(circle at 35% 30%,#2e2a46,#12101a)}
.kn .kn-r{position:absolute;left:-6px;top:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none;opacity:0;transform:rotate(-90deg);transition:opacity .25s}
.kn.playing .kn-r{opacity:1}
.kn .kn-r circle{fill:none;stroke:var(--acc,#9d92e6);stroke-width:2.8;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:calc(289 - 289 * var(--p))}
.kn .kn-t,.kn .kn-tm{position:absolute;display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:12px;color:#fff;font-weight:600;
  background:rgba(10,8,18,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;pointer-events:none}
.kn .kn-t{left:10px;top:10px;font-size:12.5px}
.kn .kn-tm{right:12px;bottom:12px;font-size:11px;font-weight:500;padding:2px 8px}
.kn[data-heard="0"]:not([data-mine="1"]) .kn-t::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc,#9d92e6);box-shadow:0 0 0 2px rgba(255,255,255,.28)}
.kn .kn-pl{position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;pointer-events:none;
  background:rgba(10,8,18,.46);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.kn .kn-pl svg{margin-left:2px}
.kn.playing .kn-pl{opacity:0;transform:scale(.6)}
.kn[data-pending] .kn-c{opacity:.8;cursor:default}
.kn[data-pending] .kn-pl{background:transparent}
.kn[data-pending] .kn-pl svg{display:none}
.kn[data-pending] .kn-pl::after{content:"";width:30px;height:30px;border-radius:50%;border:3px solid #fff;border-top-color:transparent;animation:kvspin .8s linear infinite}

/* превью при записи кружка + кольцо времени */
.kv-circ{position:absolute;z-index:4;left:50%;bottom:calc(100% + 18px);width:min(66vw,264px);aspect-ratio:1;transform:translateX(-50%);animation:kvCirc .38s cubic-bezier(.34,1.56,.64,1)}
@keyframes kvCirc{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.kv-circ[hidden]{display:none!important}
.kv-circ video{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;transform:scaleX(-1);background:#0c0a14;box-shadow:0 22px 54px -14px #000,0 0 0 3px rgba(255,255,255,.08)}
.kv-circ svg{position:absolute;left:-7px;top:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);pointer-events:none}
.kv-circ circle{fill:none;stroke-width:2.6;stroke-linecap:round}
.kv-circ .bg{stroke:rgba(255,255,255,.16)}
.kv-circ .fg{stroke:#ff4d5e;stroke-dasharray:301.6;stroke-dashoffset:301.6}
.kv-mic.kv-swap svg{animation:kvSwap .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes kvSwap{from{transform:scale(.35) rotate(-70deg);opacity:0}to{transform:none;opacity:1}}
/* подсказка у кнопки записи (как в Telegram) */
.kv-tip{position:absolute;z-index:8;bottom:calc(100% + 10px);max-width:calc(100% - 16px);padding:10px 14px;border-radius:14px;pointer-events:none;
  display:flex;flex-direction:column;gap:2px;text-align:left;font-size:13px;line-height:1.3;color:#f4f2fb;
  background:rgba(28,25,42,.96);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px -10px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transform:translateY(6px) scale(.96);transform-origin:calc(100% - var(--ax,24px)) 100%;
  transition:opacity .22s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.kv-tip.in{opacity:1;transform:none}
.kv-tip[hidden]{display:none}
.kv-tip b{font-weight:650;font-size:13.5px;white-space:nowrap}
.kv-tip span{opacity:.72;white-space:nowrap}
.kv-tip::after{content:"";position:absolute;right:calc(var(--ax,24px) - 6px);bottom:-6px;width:12px;height:12px;background:inherit;border:inherit;border-width:0 1px 1px 0;border-radius:0 0 4px 0;transform:rotate(45deg)}
[data-theme=light] .kv-tip{background:rgba(32,28,44,.95)}
@media (prefers-reduced-motion:reduce){.kv-tip{transition:opacity .15s;transform:none}}
/*KV-CSS:END*/

/* ===== действия с сообщениями в личных чатах (как в мини-аппе) ===== */
.chat-log{position:relative}
.mrow{display:flex;flex-direction:column;align-items:flex-start;align-self:flex-start;max-width:80%;position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mrow.me{align-self:flex-end;align-items:flex-end}
.mrow.mm{max-width:min(310px,80%)}
.mrow>.msg.msg{align-self:auto;max-width:100%}
.mrow>.kn{align-self:auto}
.mrow.swp{transition:none}
.mrow.sb{transition:transform .32s cubic-bezier(.22,1,.36,1)}
.mrow.lp{transform:scale(.975);transition:transform .2s}
.mrow.hl>.msg,.mrow.hl>.kn{outline:2px solid var(--acc);outline-offset:1px}
.mrow.flash>.msg{animation:mFlash .9s ease}


/* ===== поиск, черновики, закреп / без звука / архив ===== */
mark.sm{background:rgba(255,214,90,.42);color:inherit;border-radius:4px;padding:0 1px}
mark.sm.cur{background:#ffd65a;color:#1b1630;box-shadow:0 0 0 2px rgba(255,214,90,.45)}
.sbar{display:flex;align-items:center;gap:2px;padding:8px 6px 8px 14px;border-bottom:1px solid var(--line);flex:none}
.sbar[hidden]{display:none}
.sbar input{flex:1;min-width:0;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line2);background:var(--glass);color:var(--txt);font:inherit;font-size:16px;outline:0}
.sbar input:focus{border-color:var(--acc)}
.sbar #sCnt{flex:none;min-width:48px;text-align:center;font-size:12.5px;color:var(--dim);white-space:nowrap;padding:0 4px}
.sbar .ib{width:38px;height:38px}
.sbar #sUp svg{transform:rotate(-90deg)}.sbar #sDn svg{transform:rotate(90deg)}
.chat.selmode .sbar{display:none}
.crow .dr{color:var(--bad);font-weight:550}
.crow .mu{display:inline-flex;color:var(--dim)}.crow .mu svg{width:15px;height:15px}
.crow .pn{display:inline-flex;margin-top:6px;color:var(--dim)}.crow .pn svg{width:16px;height:16px;transform:rotate(35deg)}
.dot.mute{background:var(--dim);box-shadow:none;animation:none}
.crow.arc .av{display:grid;place-items:center;background:var(--card2);color:var(--dim);width:52px;height:52px;border-radius:50%;flex:none}
.crow.arc .av svg{width:24px;height:24px}
.crow .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--card2);color:var(--dim);font-size:12px;line-height:20px;text-align:center}
.sec.sp{margin-top:6px}
.cl-empty{padding:28px 20px;text-align:center;color:var(--dim)}
/* ===== реакции на сообщения и выбор нескольких сообщений ===== */
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin:3px 2px 0;max-width:100%}
.mrow.me .rxs{justify-content:flex-end}
.rx{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);color:var(--txt);font:inherit;font-size:14px;line-height:1;cursor:pointer;animation:rxIn .35s var(--spring) both;-webkit-tap-highlight-color:transparent}
.rx b{font-size:12px;font-weight:650;color:var(--dim)}
.rx.on{border-color:var(--acc);background:rgba(125,116,194,.28);background:color-mix(in srgb,var(--acc) 24%,transparent)}
.rx.on b{color:var(--txt)}
@keyframes rxIn{from{transform:scale(.4);opacity:0}}
.rxbar{display:flex;gap:2px;justify-content:space-between;padding:2px 4px 10px;margin:0 2px 6px;border-bottom:1px solid var(--line2)}
.rxbar button{flex:1;min-width:0;height:48px;border:0;background:transparent;border-radius:14px;font-size:27px;line-height:1;cursor:pointer;transition:transform .2s var(--spring),background .15s;-webkit-tap-highlight-color:transparent}
.rxbar button:active{transform:scale(1.28)}
.rxbar button.on{background:rgba(125,116,194,.3);background:color-mix(in srgb,var(--acc) 26%,transparent)}
.rxpop{position:absolute;left:50%;top:50%;font-size:46px;line-height:1;pointer-events:none;z-index:3;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));animation:rxPop .8s ease-out forwards}
@keyframes rxPop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-62%) scale(1.25);opacity:1}60%{transform:translate(-50%,-72%) scale(1);opacity:1}100%{transform:translate(-50%,-115%) scale(1);opacity:0}}
.mrow>.ck{display:none;position:absolute;left:14px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:2px solid var(--dim);box-sizing:border-box;transition:background .15s,border-color .15s}
.selm .mrow>.ck{display:block}
.mrow.sl>.ck{background:var(--acc);border-color:var(--acc)}
.mrow.sl>.ck::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chat-log.selm .mrow{align-self:stretch;width:calc(100% + 28px);max-width:calc(100% + 28px);margin:0 -14px;box-sizing:border-box;padding:3px 14px 3px 50px;cursor:pointer;transform:none}
.chat-log.selm .mrow>*{pointer-events:none}
.chat-log.selm .mrow>.msg.msg{max-width:82%}
.chat-log.selm .mrow.sl{background:rgba(125,116,194,.16);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.selh,.sela{display:none}
.chat.selmode .chat-h,.chat.selmode .cform,.chat.selmode .rpbar{display:none!important}
.chat.selmode .selh{display:flex;flex:none;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 12px 10px;border-bottom:1px solid var(--line)}
.selh b{font-size:16.5px;font-weight:650}
.chat.selmode .sela{display:flex;flex:none;gap:10px;padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg)}
.sela .btn{flex:1;padding:0 12px}
.sela .btn:disabled{opacity:.45}
.sela .btn svg{width:19px;height:19px}
@keyframes mFlash{0%,100%{filter:none}30%{filter:brightness(1.4)}}
/* мгновенная отправка: пузырь появляется сразу, сервер догоняет в фоне */
@keyframes msgIn{from{opacity:0;transform:translateY(16px) scale(.9)}55%{opacity:1}to{opacity:1;transform:none}}
.mrow.in{animation:msgIn .28s cubic-bezier(.2,.9,.3,1.15);transform-origin:100% 100%}
.mrow.in:not(.me){transform-origin:0 100%}
.sti{display:inline-block;width:9px;height:9px;margin-left:3px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-1px;animation:sp .75s linear infinite;box-sizing:border-box}
.mrow.fail{cursor:pointer}
.mrow.fail>.msg,.mrow.fail>.stk{outline:1.5px solid #ff5a6a;outline-offset:1px}
.mrow.fail small{color:#ff9aa4;opacity:1}
.cmt{transition:opacity .25s}
.cmt.pend{opacity:.6}
.cmt.pend .ca{pointer-events:none}
@media (prefers-reduced-motion:reduce){.mrow.in{animation:none}}
.mrow.gone{transition:opacity .25s,transform .3s,max-height .3s .15s,margin .3s .15s;opacity:0;transform:scale(.85);max-height:0!important;margin:-4px 0;overflow:hidden;pointer-events:none}
.swr{position:absolute;right:12px;width:32px;height:32px;margin-top:-16px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--txt);opacity:0;transform:scale(.4);pointer-events:none;z-index:0;transition:background .15s,color .15s}
.swr svg{width:18px;height:18px}
.swr.hit{background:var(--acc);color:#fff}
.swr.pop{animation:swPop .26s var(--spring,ease)}
.swr.out{transition:opacity .22s,transform .22s;opacity:0!important;transform:scale(.4)!important}
@keyframes swPop{0%{scale:1}45%{scale:1.28}100%{scale:1}}
.rq{margin:0 0 4px;padding:3px 8px;border-left:3px solid var(--acc);border-radius:4px;background:rgba(127,127,127,.16);cursor:pointer;font-size:13.5px;line-height:1.3;max-width:100%;white-space:normal;text-align:left}
.rq b{display:block;font-size:13px;color:var(--acc)}
.rq span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.85}
.rq.gone{opacity:.6;font-style:italic}
.msg.me .rq{border-left-color:#fff;background:rgba(255,255,255,.2)}
.msg.me .rq b{color:#fff}
.msg.mm .rq{margin:4px 5px 6px}
.rq.solo{background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--acc);margin:0 0 3px;padding:4px 10px}
.fw{margin:0 0 3px;font-size:13px;color:var(--acc);text-align:left;white-space:normal}
.fw b{font-weight:700}
.msg.me .fw{color:#fff;opacity:.9}
.msg.mm .fw{margin:4px 8px 2px}
.fw.solo{margin:0 4px 2px}
/* предпросмотр ссылок в пузырях */
.lkp{display:none}
.lkp.on{display:block;width:min(290px,66vw);margin-top:6px;white-space:normal;text-align:left;line-height:1.3}
.lkc{display:block;color:inherit;text-decoration:none!important;border-left:3px solid var(--acc);border-radius:6px 12px 12px 6px;background:rgba(127,127,127,.16);overflow:hidden}
.lkt{display:block;padding:6px 10px 7px}
.lks{display:block;font-size:12px;font-weight:700;color:var(--acc);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lkt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.28;margin-top:1px}
.lkd{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;opacity:.85;margin-top:2px}
.lki{display:block;line-height:0;background:#0c0a14}
.lki img{display:block;width:100%;min-height:90px;max-height:170px;object-fit:cover}
.msg.me .lkc{border-left-color:#fff;background:rgba(255,255,255,.18)}
.msg.me .lks{color:#fff}
.msg.mm .lkp.on{margin:6px 0 0}
/* ответ на пост из ленты: карточка поста в пузыре и окно ответа */
.pq{display:flex;gap:9px;align-items:center;margin:0 0 5px;padding:5px 9px 5px 8px;border-left:3px solid var(--acc);border-radius:6px 12px 12px 6px;background:rgba(127,127,127,.16);cursor:pointer;max-width:100%;white-space:normal;text-align:left;overflow:hidden}
.pq img{flex:none;width:44px;height:44px;border-radius:8px;object-fit:cover;background:#0c0a14}
.pqt{display:block;min-width:0;flex:1}
.pqt .pqa{display:block;font-size:11.5px;font-weight:700;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pqt b{display:block;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pqt span:not(.pqa){display:block;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq.gone{opacity:.6;font-style:italic;cursor:default}
.msg.me .pq{border-left-color:#fff;background:rgba(255,255,255,.2)}
.msg.me .pqa{color:#fff}
.msg.mm .pq{margin:4px 5px 6px}
.pq.pqs{margin:0 0 12px;cursor:default;color:var(--txt)}
.rps .inp{height:96px;min-height:96px;resize:none;line-height:1.35}
.rps-b{display:flex;gap:10px;margin-top:12px}
.rps-b .btn{flex:1}
.cday{align-self:center;font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);padding:3px 12px;border-radius:12px;margin:8px 0 3px}
