<body>
<div id="app"></div>
<script>
"use strict";
/* ============ настройки сервера ============
   Адрес вписывается автоматически, когда файл скачан с вашего сайта (/forum/app.html?dl=1).
   Если файл открыт локально (в APK) и адрес пуст — приложение само спросит адрес сервера. */
const SERVER0="__BASE__";

/* ---------- хранилище (работает даже если localStorage недоступен) ---------- */
const mem={};
const ls={get(k){try{return localStorage.getItem('kf_'+k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem('kf_'+k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem('kf_'+k)}catch(e){delete mem[k]}}};
/*KV-JS:BEGIN*/
const KV=(()=>{
'use strict';
const CH='0123456789abcdefghijklmnopqrstuv',N=48,MIN_MS=700,MAX_MS=600000,SPEEDS=[1,1.5,2];
let cfg={heard(){},toast(){}};
const A=new Audio();A.preload='none';
let cur=null,raf=0,speed=1;
try{speed=parseFloat(localStorage.getItem('kv_speed'))||1}catch(e){}
if(SPEEDS.indexOf(speed)<0)speed=1;
const svg=(b,w)=>`<svg viewBox="0 0 24 24" width="${w||22}" height="${w||22}" aria-hidden="true">${b}</svg>`;
const st='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const IC_PLAY=svg('<path fill="currentColor" d="M8.2 5.3v13.4a1 1 0 0 0 1.5.86l10.6-6.7a1 1 0 0 0 0-1.72L9.7 4.44a1 1 0 0 0-1.5.86z"/>');
const IC_PAUSE=svg('<rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/>');
const IC_MIC=svg(`<g ${st}><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></g>`);
const IC_SEND=svg(`<g ${st} stroke-width="2.3"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></g>`);
const IC_TRASH=svg(`<g ${st}><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 1.8h6a2 2 0 0 0 2-1.8l1-12M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/></g>`,20);
const IC_CAM=svg(`<g ${st}><rect x="3" y="6.5" width="13" height="11" rx="3"/><path d="m16 11 5-3v8l-5-3z"/></g>`);
const IC_LOCK=svg(`<g ${st}><rect x="5" y="11" width="14" height="9.5" rx="2.4"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>`,17);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const spd=x=>(x===1?'1':String(x))+'×';
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ---------- волна ---------- */
const maskCache=new Map();
function decode(w){const a=[];for(const c of String(w||'')){const v=CH.indexOf(c);a.push(v<0?4:v)}return a.length>=4?a:new Array(N).fill(5)}
function maskUrl(w){let m=maskCache.get(w);if(m)return m;const a=decode(w),n=a.length;let r='';
  a.forEach((v,i)=>{const h=Math.max(3,Math.round(3+v/31*27));r+=`<rect x="${i*3}" y="${(32-h)/2}" width="2" height="${h}" rx="1"/>`});
  m='url("data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n*3-1} 32" preserveAspectRatio="none">${r}</svg>`)+'")';
  if(maskCache.size>300)maskCache.clear();maskCache.set(w,m);return m}
function waveStr(levels){ // levels: 0..1, любое число значений -> строка из N символов
  const n=levels.length;if(!n)return CH[3].repeat(N);const out=[];
  for(let i=0;i<N;i++){const a=i*n/N,b=Math.max(a+1,(i+1)*n/N);let s=0,c=0,mx=0;
    for(let j=Math.floor(a);j<Math.min(n,Math.ceil(b));j++){s+=levels[j];c++;mx=Math.max(mx,levels[j])}
    out.push(c?(s/c)*.55+mx*.45:levels[Math.min(n-1,Math.floor(a))])}
  const pk=Math.max.apply(null,out.concat([.06]));
  return out.map(v=>CH[Math.max(1,Math.min(31,Math.round(Math.pow(v/pk,.7)*31)))]).join('')}

/* ---------- разметка сообщения ---------- */
function inner(v){return `<button class="vp" type="button" aria-label="Воспроизвести">${IC_PLAY}</button><div class="vc"><div class="vw" data-w="${esc(v.wave||'')}"><i class="vwv"></i></div><div class="vi"><span class="vt">${fmtT(v.dur)}</span><i class="vdot"></i><button class="vs" type="button" hidden>${spd(speed)}</button>${v.meta?`<small>${v.meta}</small>`:''}</div></div>`}
function bubble(cls,v){return `<div class="${esc(cls)} vm" data-id="${esc(v.id)}" data-url="${esc(v.url||'')}" data-dur="${v.dur|0}" data-heard="${v.heard?1:0}" data-mine="${v.mine?1:0}"${v.pending?' data-pending="1"':''}>${inner(v)}</div>`}
const setP=(el,p)=>{const w=el.querySelector('.vw');if(w)w.style.setProperty('--p',p)};
const durOf=el=>Math.max(1,parseInt(el.dataset.dur,10)||1);

function paint(el,playing){
  if(!el)return;const b=el.querySelector('.vp');
  if(el._pl!==playing){el._pl=playing;b.innerHTML=playing?IC_PAUSE:IC_PLAY;b.setAttribute('aria-label',playing?'Пауза':'Воспроизвести')}
  el.classList.toggle('playing',playing);
  const s=el.querySelector('.vs');if(s){s.hidden=!(cur&&cur.el===el);s.textContent=spd(speed)}}
function bind(root){
  root.querySelectorAll('.vm').forEach(el=>{
    const w=el.querySelector('.vw');if(w&&!w.dataset.m){w.dataset.m=1;w.style.setProperty('--m',maskUrl(w.dataset.w))}
    if(cur&&cur.id===el.dataset.id){cur.el=el;el._pl=null;paint(el,!A.paused);const t=A.currentTime*1000;setP(el,Math.min(1,t/cur.dur));el.querySelector('.vt').textContent=fmtT(t)}});
  root.querySelectorAll('.kn').forEach(el=>{
    if(curN&&curN.id===el.dataset.id){const nv=el.querySelector('.kn-v');if(nv&&nv!==curN.v)nv.replaceWith(curN.v); // играющее видео переезжает в новый пузырь (в том же такте — не прерывается)
      curN.el=el;el.classList.toggle('playing',!curN.v.paused);const t=curN.v.currentTime*1000;nP(el,Math.min(1,t/curN.dur));el.querySelector('.kn-t').textContent=fmtT(t)}});
  listen(root)}

/* ---------- плеер ---------- */
function tick(){raf=0;if(!cur||A.paused)return;const t=A.currentTime*1000;setP(cur.el,Math.min(1,t/cur.dur));cur.el.querySelector('.vt').textContent=fmtT(t);raf=requestAnimationFrame(tick)}
function reset(el){if(!el)return;paint(el,false);setP(el,0);const t=el.querySelector('.vt');if(t)t.textContent=fmtT(durOf(el));const s=el.querySelector('.vs');if(s)s.hidden=true}
function stop(){if(!cur)return;const c=cur;cur=null;try{A.pause()}catch(e){}reset(c.el)}
function nextUnheard(el){const all=Array.prototype.slice.call(document.querySelectorAll('.vm')),i=all.indexOf(el);for(let k=i+1;k<all.length;k++){const n=all[k];if(n.dataset.mine!=='1'&&n.dataset.heard==='0'&&n.dataset.url)return n}return null}
function begin(el,r){
  nStop();
  if(cur&&cur.el!==el)reset(cur.el);
  cur={id:el.dataset.id,el,dur:durOf(el)};
  const seek=(r||0)*cur.dur/1000;
  const fail=()=>{cfg.toast('Не удалось воспроизвести запись',1);if(cur&&cur.el===el){paint(el,false);cur=null}};
  const go=u=>{if(!cur||cur.el!==el)return;A.src=u;A.defaultPlaybackRate=speed;
    if(seek>0.05)A.addEventListener('loadedmetadata',()=>{try{A.currentTime=seek}catch(e){}},{once:true});
    const p=A.play();if(p&&p.catch)p.catch(fail)};
  if(cfg.res)cfg.res(el.dataset.url).then(go).catch(fail);else go(el.dataset.url); // cfg.res: форум отдаёт blob, адрес сервера не светится
  markHeard(el)}
function markHeard(el){if(el.dataset.mine!=='1'&&el.dataset.heard==='0'){el.dataset.heard='1';try{cfg.heard(el.dataset.id)}catch(e){}}}
function toggle(el){
  if(!el||el.dataset.pending||!el.dataset.url)return;
  if(cur&&cur.id===el.dataset.id){if(A.paused){const p=A.play();if(p&&p.catch)p.catch(()=>{})}else A.pause();return}
  begin(el,0)}
A.addEventListener('play',()=>{A.playbackRate=speed;if(cur){paint(cur.el,true);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}});
A.addEventListener('pause',()=>{if(cur&&!A.ended)paint(cur.el,false)});
A.addEventListener('ended',()=>{const c=cur;if(!c)return;cur=null;reset(c.el);const nx=nextUnheard(c.el);if(nx)begin(nx,0)});
A.addEventListener('error',()=>{if(cur&&A.src){cfg.toast('Не удалось воспроизвести запись',1);paint(cur.el,false)}});

function listen(root){
  if(root._kv)return;root._kv=1;
  root.addEventListener('click',e=>{
    const sp=e.target.closest('.vs');
    if(sp){e.stopPropagation();speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];try{localStorage.setItem('kv_speed',speed)}catch(x){}
      A.playbackRate=speed;A.defaultPlaybackRate=speed;sp.textContent=spd(speed);return}
    const kc=e.target.closest('.kn-c');if(kc){e.stopPropagation();nToggle(kc.closest('.kn'));return}
    const b=e.target.closest('.vp');if(b){e.stopPropagation();toggle(b.closest('.vm'))}});
  root.addEventListener('pointerdown',e=>{
    const w=e.target.closest('.vw');if(!w)return;const el=w.closest('.vm');if(!el||el.dataset.pending||!el.dataset.url)return;
    const rc=w.getBoundingClientRect(),pid=e.pointerId,rt=ev=>Math.min(1,Math.max(0,(ev.clientX-rc.left)/Math.max(1,rc.width)));
    try{w.setPointerCapture(pid)}catch(x){}
    const isCur=cur&&cur.id===el.dataset.id;let r=rt(e);setP(el,r);
    const tx=el.querySelector('.vt');tx.textContent=fmtT(r*durOf(el));
    const mv=ev=>{if(ev.pointerId!==pid)return;r=rt(ev);setP(el,r);tx.textContent=fmtT(r*durOf(el))};
    const done=(ev,ok)=>{w.removeEventListener('pointermove',mv);w.removeEventListener('pointerup',up);w.removeEventListener('pointercancel',cn);
      if(!ok){if(isCur){const t=A.currentTime*1000;setP(el,Math.min(1,t/cur.dur));tx.textContent=fmtT(t)}else reset(el);return}
      if(isCur){try{A.currentTime=r*cur.dur/1000}catch(x){}if(A.paused){const p=A.play();if(p&&p.catch)p.catch(()=>{})}}else begin(el,r)};
    const up=ev=>done(ev,true),cn=ev=>done(ev,false);
    w.addEventListener('pointermove',mv);w.addEventListener('pointerup',up);w.addEventListener('pointercancel',cn)})}

/* ---------- кружки: разметка и плеер ---------- */
function knInner(v){return `<div class="kn-c"><video class="kn-v" playsinline webkit-playsinline muted preload="metadata" disablepictureinpicture${v.url?(cfg.res?` data-bsrc="${esc(v.url)}"`:` src="${esc(v.url)}#t=0.1"`):''}${v.poster?` poster="${esc(v.poster)}"`:''}></video><svg class="kn-r" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg><span class="kn-t">${fmtT(v.dur)}</span><span class="kn-pl">${IC_PLAY}</span>${v.meta?`<span class="kn-tm">${v.meta}</span>`:''}</div>`}
function knBubble(cls,v){return `<div class="${esc(cls)} kn" data-id="${esc(v.id)}" data-url="${esc(v.url||'')}" data-dur="${v.dur|0}" data-heard="${v.heard?1:0}" data-mine="${v.mine?1:0}"${v.pending?' data-pending="1"':''}>${knInner(v)}</div>`}
let curN=null,rafN=0;
const nP=(el,p)=>{const c=el.querySelector('.kn-c');if(c)c.style.setProperty('--p',p)};
function nTick(){rafN=0;if(!curN||curN.v.paused)return;const t=curN.v.currentTime*1000;nP(curN.el,Math.min(1,t/curN.dur));curN.el.querySelector('.kn-t').textContent=fmtT(t);rafN=requestAnimationFrame(nTick)}
function nReset(el){if(!el)return;el.classList.remove('playing');nP(el,0);const t=el.querySelector('.kn-t');if(t)t.textContent=fmtT(durOf(el))}
function nStop(){if(!curN)return;const c=curN;curN=null;try{c.v.pause();c.v.muted=true;c.v.currentTime=0.1}catch(e){}nReset(c.el)}
function stopAll(){stop();nStop()}
function nToggle(el){
  if(!el||el.dataset.pending||!el.dataset.url)return;
  const v=el.querySelector('.kn-v');if(!v)return;

  if(m.k==='video'){const big=m.size>VID_INLINE;return `<div class="mt vid" data-alb="${p.id}" data-i="${j}"><video muted playsinline preload="metadata"${big?'':` data-bsrc="${u}"`}></video><span class="mp">${IC.play}</span>${big?`<span class="mvs">${fsize(m.size)}</span>`:''}${more?`<span class="mmore">+${more}</span>`:''}</div>`}
  return `<div class="mt" data-alb="${p.id}" data-i="${j}"><img data-bsrc="${u}" alt="">${more?`<span class="mmore">+${more}</span>`:''}</div>`}
function albumHtml(p,full){const m=mediaOf(p),n=m.length;if(!n)return '';ALB.set(p.id,m);
  const cap=full?10:4,shown=m.slice(0,cap),extra=n-shown.length;
  const cls=full&&n>4?' big'+(n%2?' odd':''):' n'+Math.min(shown.length,4);
  return `<div class="imgs${cls}">${shown.map((x,j)=>tileHtml(p,x,j,j===shown.length-1?extra:0)).join('')}</div>`}
/* просмотрщик альбома: те же свайпы/стрелки/видеоплеер, что и в чате */
function openAlbum(pid,i){const m=ALB.get(pid);if(!m||!m.length)return;
  const host=document.createElement('div');
  m.forEach(x=>{const d=document.createElement('i');d.dataset.gal=x.k;d.dataset.u='/forum/api/img/'+x.id;d.dataset.n=(x.k==='video'?'video-':'photo-')+x.id+(x.k==='video'?'.mp4':'.jpg');host.appendChild(d)});
  openGal(host,host.children[Math.min(i,m.length-1)])}

/* ---------- карточка поста ---------- */
function postCard(p,full){
  const body=p.body?`<div class="pb ${!full&&p.body.length>380?'clamp':''}">${fmt(p.body)}</div>${!full&&p.body.length>380?'<span class="more">Читать далее</span>':''}`:'';
  const imgs=albumHtml(p,full);
  return `<article class="post ${full?'full':''}" data-id="${p.id}">
    <div class="ph">${full?`<button class="ib" onclick="history.back()" style="margin-left:-8px">${IC.back}</button>`:''}${av(p.user,full?'s':'m')}<div class="pn"><b data-href="#/u/${p.user.id}">${esc(p.user.name)}${tags(p.user.sb)}</b><small>${ago(p.ts)}${p.edited?' · изменено':''}${p.board?` · <a href="#/b/${p.board.id}">${esc(p.board.name)}</a>`:''}</small></div>${p.pinned?'<span class="tag pin">ЗАКРЕП</span>':''}${full&&!p.mine?'<span id="fbtn"></span>':''}<button class="ib" data-act="menu" style="width:36px;height:36px;color:#aaa5c4">${IC.more}</button></div>

    <div ${full?'':`data-href="#/p/${p.id}"`}>${body}</div>${imgs}
    <div class="acts"><button class="act ${p.liked?'on':''}" data-act="like">${IC.heart}<span>${num(p.likes)}</span></button><button class="act" data-href="#/p/${p.id}">${IC.comment}<span>${num(p.comments)}</span></button>${p.mine?'':`<button class="act" data-act="dm" aria-label="Ответить автору в личку">${IC.dm}</button>`}<span class="sp"></span><button class="act sv ${p.saved?'on':''}" data-act="save">${IC.mark}</button></div></article>`}

async function loadPosts(box,params,state){

  if(state.off===0&&!d.posts.length){box.innerHTML=emptyBox('inbox',state.empty||'Здесь пока пусто')}
  else{box.insertAdjacentHTML('beforeend',d.posts.map(p=>postCard(p)).join(''));}
  $$('.more-btn',box).forEach(x=>x.remove());state.off+=d.posts.length;
  if(d.more)box.insertAdjacentHTML('beforeend','<div class="pad" style="text-align:center"><button class="btn ghost more-btn">Показать ещё</button></div>');
  const mb=$('.more-btn',box);if(mb)mb.onclick=()=>loadPosts(box,params,state).catch(e=>toast(e.message,1))}

  <div class="trend" id="trend" hidden><div class="th"><b>${IC.crown}Актуальное</b><a href="#" data-tab2="top">Смотреть всё ${IC.chev}</a></div><div class="trend-row" id="trendRow"></div></div>

/* ---------- пост + комментарии ---------- */
let replyTo=null;
async function viewPost(el,id){
  const d=await api('/post?id='+id);const p=d.post;replyTo=null;
  const top=d.comments.filter(c=>!c.parent),kids={};d.comments.filter(c=>c.parent).forEach(c=>(kids[c.parent]=kids[c.parent]||[]).push(c));

  <div style="position:sticky;bottom:0;z-index:7"><div class="reply-to" id="rpl" hidden><span></span><button class="ib" style="width:28px;height:28px" id="rplX">✕</button></div><div class="cform">${av(S.me,'m').replace('m"','m" style="width:48px;height:48px"')}<textarea id="cTxt" rows="1" maxlength="2000" placeholder="Написать комментарий…"></textarea><button class="send" id="cSend" disabled>${IC.send}</button></div></div></div>`;
  $('#cmH',el).onclick=()=>{const l=$('#cmL',el),h=$('#cmH',el);l.hidden=!l.hidden;h.classList.toggle('shut',l.hidden)};
  const fb=$('#fbtn',el);if(fb)api('/user?id='+p.user.id).then(u=>{let f=u.is_following;fb.innerHTML=`<button class="btn ghost sm" style="height:34px;padding:0 14px;font-size:13px">${f?'Вы подписаны':'Подписаться'}</button>`;const b=fb.firstElementChild;b.onclick=async()=>{const was=f;f=!f;b.textContent=f?'Вы подписаны':'Подписаться';try{const r=await post_('/follow',{user_id:p.user.id});f=r.following;b.textContent=f?'Вы подписаны':'Подписаться'}catch(e){f=was;b.textContent=f?'Вы подписаны':'Подписаться';toast(e.message,1)}}}).catch(()=>{});
  const ta=$('#cTxt',el),sb=$('#cSend',el);ta.oninput=()=>{sb.disabled=!ta.value.trim();ta.style.height='52px';ta.style.height=Math.min(Math.max(ta.scrollHeight,52),120)+'px'};
  let cc=p.comments;const setCc=()=>{const h=$('#cmH span',el);if(h)h.textContent='Комментарии ('+cc+')'};
  sb.onclick=()=>{const body=ta.value.trim();if(!body)return;const parent=replyTo,cmL=$('#cmL',el);
    const c={id:'t'+Date.now(),user:S.me,parent:parent||null,body,ts:Date.now()/1000,likes:0,liked:false,mine:true,can_delete:true,can_edit:true,deleted:false,edited:false};
    const emp=cmL.querySelector('.empty');if(emp)emp.remove();
    const pr=parent?cmL.querySelector('[data-cid="'+parent+'"]'):null;
    const tmp=document.createElement('div');tmp.innerHTML=cm(c,!!pr);const row=tmp.firstElementChild;row.classList.add('pend');      // комментарий виден сразу, сервер догоняет

    else cmL.appendChild(row);
    d.comments.push(c);cc++;setCc();
    ta.value='';replyTo=null;$('#rpl',el).hidden=true;ta.oninput();
    try{row.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
    retryTF(()=>post_('/comment',{post_id:p.id,body,parent_id:parent})).then(r=>{c.id=r.id;row.dataset.cid=r.id;row.classList.remove('pend')})
      .catch(er=>{row.remove();const i=d.comments.indexOf(c);if(i>=0)d.comments.splice(i,1);cc--;setCc();if(!cmL.querySelector('.cmt'))cmL.innerHTML='<div class="empty" style="padding:24px">Комментариев пока нет — будьте первым</div>';if(!ta.value){ta.value=body;ta.oninput()}toast(er.message,1)})};

    if(b.dataset.act==='creply'){replyTo=cid;const r=$('#rpl',el);r.hidden=false;r.firstElementChild.textContent='Ответ для '+b.dataset.n;ta.value='@'+b.dataset.n.replace(/\s/g,'_')+' ';ta.focus();$('#rplX',el).onclick=()=>{replyTo=null;r.hidden=true};ta.oninput()}
    else if(b.dataset.act==='clike'){const was=b.classList.contains('on'),sp=b.lastElementChild,n0=parseInt(sp.textContent)||0;
      b.classList.toggle('on',!was);if(!was)pop(b);sp.textContent=(was?Math.max(0,n0-1):n0+1)||'';        // сердечко и счётчик меняются сразу
      try{const r=await post_('/like',{kind:'c',id:cid});b.classList.toggle('on',r.liked);sp.textContent=r.count||''}catch(x){b.classList.toggle('on',was);sp.textContent=n0||'';toast(x.message,1)}}
    else if(b.dataset.act==='cedit'){const row=b.closest('.cmt'),cbd=row.querySelector('.cb'),pe=cbd.querySelector(':scope>p'),ca=cbd.querySelector('.ca');if(cbd.querySelector('.cedit'))return;

        const ob=c.body;c.body=v;c.edited=true;pe.innerHTML=fmt(v);const sm_=row.querySelector('.h small');if(sm_)sm_.textContent=ago(c.ts)+' · изм.';close();
        post_('/comment/edit',{id:cid,body:v}).catch(x=>{c.body=ob;pe.innerHTML=fmt(ob);toast(x.message,1)})}}
    else if(b.dataset.act==='cdel'){if(await confirmBox('Удалить комментарий?')){const row=b.closest('.cmt'),c=d.comments.find(x=>x.id===cid),html=row.outerHTML;
      const nr=document.createElement('div');nr.innerHTML=cm(Object.assign({},c,{deleted:true}),row.classList.contains('rep'));const nn=nr.firstElementChild;nn.style.animation='none';row.replaceWith(nn);if(c)c.deleted=true;      // сразу «Комментарий удалён»
      try{await post_('/comment/delete',{id:cid})}catch(x){const bk=document.createElement('div');bk.innerHTML=html;const bb=bk.firstElementChild;bb.style.animation='none';nn.replaceWith(bb);if(c)c.deleted=false;toast(x.message,1)}}}}}

/* ---------- действия над постами (делегирование) ---------- */
document.addEventListener('click',async e=>{
  const al=e.target.closest('[data-alb]');if(al){e.stopPropagation();openAlbum(+al.dataset.alb,+al.dataset.i||0);return}
  const lb=e.target.closest('[data-lb]');if(lb){const d=document.createElement('div');d.className='lb';const im=document.createElement('img');im.alt='';d.appendChild(im);blobOf(lb.dataset.lb).then(u=>{im.src=u}).catch(()=>{d.remove();toast('Не удалось открыть',1)});d.onclick=()=>d.remove();document.body.appendChild(d);return}
  const hr=e.target.closest('[data-href]');
  const act=e.target.closest('[data-act]');
  const card=e.target.closest('.post');
  if(act&&card&&['like','save','menu','dm'].includes(act.dataset.act)){e.stopPropagation();const id=+card.dataset.id;
    try{
      if(act.dataset.act==='like'){const was=act.classList.contains('on'),sp=act.lastElementChild,t0=sp.textContent,n0=/^\d+$/.test(t0)?+t0:(t0===''?0:NaN);
        act.classList.toggle('on',!was);if(!was)pop(act);if(!isNaN(n0))sp.textContent=num(Math.max(0,n0+(was?-1:1)));      // лайк виден сразу
        try{const r=await post_('/like',{kind:'p',id});act.classList.toggle('on',r.liked);sp.textContent=num(r.count)}catch(x2){act.classList.toggle('on',was);sp.textContent=t0;throw x2}}
      else if(act.dataset.act==='save'){const was=act.classList.contains('on');act.classList.toggle('on',!was);if(!was)pop(act);toast(!was?'Сохранено в закладки':'Убрано из закладок');
        try{const r=await post_('/bookmark',{post_id:id});act.classList.toggle('on',r.saved)}catch(x2){act.classList.toggle('on',was);throw x2}}
      else if(act.dataset.act==='dm'){const pd=await api('/post?id='+id);replyToPost(pd.post)}
      else if(act.dataset.act==='menu'){const pd=await api('/post?id='+id);const p=pd.post;const items=[];
        if(!p.mine)items.push({t:'Ответить автору в личку',k:'dm',ic:'dm'});
        if(p.can_edit)items.push({t:'Редактировать',k:'edit'});
        if(S.me.staff)items.push({t:p.pinned?'Открепить':'Закрепить',k:'pin'});
        if(!p.mine)items.push({t:'Пожаловаться',k:'rep'});
        if(p.can_edit)items.push({t:'Удалить',k:'del',bad:true});
        const c=await sheet(items);if(!c)return;
        if(c.k==='dm')replyToPost(p);
        else if(c.k==='edit')location.hash='#/edit/'+id;
        else if(c.k==='pin'){await post_('/post/pin',{id,pin:!p.pinned});toast('Готово');render()}

        else if(c.k==='del'&&await confirmBox('Удалить пост?')){await post_('/post/delete',{id});toast('Удалено');if(location.hash.startsWith('#/p/'))location.hash='#/';else render()}}
    }catch(x){toast(x.message,1)}return}
  if(hr&&!e.target.closest('a')){e.preventDefault();location.hash=hr.dataset.href}});

/* ---------- ответ на пост из ленты прямо в личку ---------- */
function postSnip(p){return p.body.replace(/\s+/g,' ').trim().slice(0,140)}
function replyToPost(p){
  if(!p||p.mine)return;
  const old=$('.sheet-bg.rps');if(old)old.remove();
  const sn=postSnip(p),bg=document.createElement('div');bg.className='sheet-bg rps';
  bg.innerHTML=`<div class="sheet rep"><div class="sh-t">Ответить в личку</div>
    <div class="pq pqs">${p.imgs[0]?`<img data-bsrc="/forum/api/img/${p.imgs[0]}" alt="">`:''}<div class="pqt"><span class="pqa">Пост · ${esc(p.user.name)}</span><b>${esc(p.title||sn||'Пост')}</b>${p.title&&sn?`<span>${esc(sn)}</span>`:''}</div></div>
    <textarea class="inp" id="rpT" maxlength="3000" placeholder="Ваш ответ автору…"></textarea>
    <div class="rps-b"><button class="btn ghost" id="rpN" type="button">Отмена</button><button class="btn" id="rpS" type="button" disabled>${IC.send}Отправить</button></div></div>`;
  const T=$('#rpT',bg),S_=$('#rpS',bg),N=$('#rpN',bg);let busy=false;

  log.querySelectorAll('.lkp[data-lkp]:not([data-ok])').forEach(n=>{

    const put=d=>{if(!d||!d.ok||!n.isConnected)return false;n.innerHTML=lpCard(d,u);n.classList.add('on');return true};
    if(LPD.has(u)){put(LPD.get(u));return}                       // из кэша — сразу, без прыжка ленты

(function(){const kick=v=>{v.muted=true;const p=v.play&&v.play();if(p&&p.catch)p.catch(()=>{})};new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.tagName==='VIDEO')kick(n);else if(n.querySelectorAll)n.querySelectorAll('video[autoplay]').forEach(kick)}))).observe(document.documentElement,{childList:true,subtree:true})})();
function compress(file){return new Promise(res=>{if(file.type==='image/gif'||file.size<350000){res(file);return}const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const al=/^image\/(png|webp)$/i.test(file.type);c.toBlob(b=>{URL.revokeObjectURL(u);res(b?new File([b],al?'p.webp':'p.jpg',{type:b.type||'image/jpeg'}):file)},al?'image/webp':'image/jpeg',al?.88:.82)};im.onerror=()=>res(file);im.src=u})}

  const old=ed?mediaOf(ed).slice():[],rm=new Set();let busy=false;
  const MEDIA_MAX=10,VID_LIM=20*1048576,IMG_LIM=4*1048576,TOT_LIM=40*1048576;
  const keptOld=()=>old.filter(m=>!rm.has(m.id)),total=()=>keptOld().length+files.length;
  const url=f=>f._u||(f._u=URL.createObjectURL(f));

      return `<div class="${e_?'ed':''}" data-i="${i}">${k==='video'?`<video src="${url(f)}#t=0.1" muted playsinline preload="metadata"></video><span class="tv">${IC.play}</span>`:`<img src="${url(f)}" alt="">`}${e_?`<i class="sx-pe${big?' big':''}">${big?fsize(f.size):(f._ed?'изм.':IC.pencil)}</i>`:''}<button type="button" data-rm="${i}" aria-label="Убрать">✕</button></div>`});

KE.toast=(t,e)=>toast(t,e);
/* ---------- вложения в чате: фото / видео / файл ---------- */
const ATT_MAX=20*1024*1024;
const sleep_=ms=>new Promise(r=>setTimeout(r,ms));
/* сервер ограничивает частоту (too_fast) — при быстрой отправке подряд просто повторяем запрос, пользователь этого не видит */
const retryTF=async fn=>{for(let t=0;;t++){try{return await fn()}catch(e){if(e&&e.code==='too_fast'&&t<8){await sleep_(800);continue}throw e}}};
const LOCAL_URLS=[];          // blob-адреса локальных превью отправляемых файлов (освобождаем при смене экрана)
const CHATC=new Map();        // последний ответ сервера по каждому чату — чат открывается мгновенно, а свежие данные подтягиваются фоном
function fsize(n){n=+n||0;return n<1024?n+' Б':n<1048576?Math.round(n/1024)+' КБ':(n/1048576).toFixed(n<1.05e7?1:0)+' МБ'}
function kindOf(f){const t=(f.type||'').toLowerCase(),n=(f.name||'').toLowerCase();
  if(/^image\/(jpeg|png|webp|gif)$/.test(t)||(!t&&/\.(jpe?g|png|webp|gif)$/.test(n)))return 'image';
  if(/^video\/(mp4|webm|quicktime|x-m4v)$/.test(t)||(!t&&/\.(mp4|m4v|webm|mov)$/.test(n)))return 'video';return 'file'}
/* accept: 'image/*' откроет галерею фото, 'video/*' — галерею видео, без accept — файловый менеджер */
/* Галерея Android часто отдаёт PNG/WebP уже с белым фоном вместо прозрачности — это происходит до приложения.
   «Из файлов» открывает системный проводник и отдаёт файл как есть. */
async function fixType(f){if(f.type&&/^(image|video)\//.test(f.type))return f;

  (()=>{const TH=56;let sx=0,sy=0,node=null,dx=0,lock=0,timer=null,lpT=null,fired=false,hit=false,ico=null;

  const run=async()=>{const v=$('#q',el).value.trim();const r=$('#res',el);if(isLink(v)){location.replace('#/n/'+encodeURIComponent(linkName(v)));return}if(v.length<2){r.innerHTML=emptyBox('search','Введите минимум 2 символа');return}

/* ---------- уведомления на устройстве: баннер, звук, вибрация, системные ---------- */
let AC=null;document.addEventListener('pointerdown',()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function beep(){try{if(!AC)return;if(AC.state==='suspended')AC.resume();const t=AC.currentTime;[[880,0],[1320,.13]].forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.16,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.22);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.25)})}catch(e){}}
function nBanner(title,body,href){$$('.nbn').forEach(x=>x.remove());const d=document.createElement('div');d.className='nbn';d.innerHTML=`${IC.bell}<span class="t"><b>${esc(title)}</b><small>${esc(body)}</small></span>`;const close=()=>{d.classList.add('out');setTimeout(()=>d.remove(),260)};d.onclick=()=>{close();if(href)location.hash=href};document.body.appendChild(d);setTimeout(()=>{if(d.isConnected)close()},5500)}

  if(document.hidden){if(ls.get('sys')==='1'&&'Notification' in window&&Notification.permission==='granted')try{const n=new Notification(title,{body,tag:'kf-'+(href||'')});n.onclick=()=>{try{window.focus()}catch(e){}if(href)location.hash=href;n.close()}}catch(e){}}
  else nBanner(title,body,href)}
const NTXT={like_p:'оценил(а) ваш пост',like_c:'оценил(а) ваш комментарий',comment:'прокомментировал(а) ваш пост',reply:'ответил(а) на ваш комментарий',mention:'упомянул(а) вас',follow:'подписался(лась) на вас',gmention:'упомянул(а) вас в чате',greply:'ответил(а) вам в чате'};

  const key='nafter'+(S.me?S.me.id:''),a=ls.get(key),prev=S.counts.msgs||0,first=!S.pinged;

}catch(e){}}
function chrome(){const set=(sel,n)=>$$(sel).forEach(b=>{b.hidden=!n;b.textContent=n>99?'99+':n});set('.bellB',S.counts.notifs);set('.msgB',S.counts.msgs);
  const t=(S.counts.notifs||0)+(S.counts.msgs||0);document.title=(t?'('+(t>99?'99+':t)+') ':'')+'KMBP FORUM';
  try{if(navigator.setAppBadge){t?navigator.setAppBadge(t):navigator.clearAppBadge()}}catch(e){}}
/* ---------- звонки (WebRTC): личные и групповые ----------
   Звук и видео идут напрямую между участниками (mesh, до 8 человек), сервер только передаёт сигналы.
   Сигналы и входящие вызовы приходят по одному постоянному long-poll /calls/poll. */
const KI={
 phone:I('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>'),
 mic:I('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
 micOff:I('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/>'),
 cam:I('<rect x="3" y="6.5" width="13" height="11" rx="3"/><path d="m16 11 5-3v8l-5-3z"/>'),
 camOff:I('<rect x="3" y="6.5" width="13" height="11" rx="3"/><path d="m16 11 5-3v8l-5-3zM4 4l16 16"/>'),
 add:I('<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>'),
 screen:I('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8M12 16v5"/>'),
 flip:I('<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/>'),
 down:I('<path d="m6 9 6 6 6-6"/>'),
 check:I('<path d="m5 12.5 4.5 4.5L19 7.5"/>')
};
const CALL=(()=>{
  const st={seq:-1,boot:'',run:false,g:{},gb:null};
  let C=null,ring={},starting=false,evBuf=[],rtT=0,rtMode='',lvT=0,tmT=0,wl=null,declined=new Set();
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const nm=u=>u&&u.name?u.name:'Участник';
  const kav=(u,c)=>`<span class="av ${c||''}">${esc((u.name||'?').trim().charAt(0).toUpperCase())}${u.av?`<img data-bsrc="/forum/api/avatar/${u.id}" onerror="this.remove()" alt="">`:''}</span>`;
  const others=()=>C?Object.keys(C.parts).map(Number).filter(u=>u!==S.me.id):[];

  /* ----- звуки ----- */
  function tone(fs,dur,vol){if(!AC)return;try{if(AC.state==='suspended')AC.resume();const t=AC.currentTime;
    fs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.04);g.gain.setValueAtTime(vol,t+dur-.06);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)})}catch(e){}}
  function ringSync(){
    const want=C?(C.out&&!C.live&&Object.keys(C.inv).length?'out':''):(Object.keys(ring).some(k=>!ring[k].rejoin)?'in':'');
    if(want===rtMode)return;rtMode=want;clearInterval(rtT);rtT=0;
    if(!want||(want==='in'&&ls.get('snd')==='0'))return;
    const go=want==='in'?()=>{tone([880,1175],.32,.12);setTimeout(()=>tone([880,1175],.32,.12),440);if(ls.get('vib')!=='0'&&navigator.vibrate)try{navigator.vibrate([300,150,300])}catch(e){}}:()=>tone([425],1,.07);
    go();rtT=setInterval(go,want==='in'?2600:4000)}

  /* ----- постоянный опрос сервера: входящие вызовы + сигналы ----- */
  function ensure(){if(!S.token||!S.me){if(C&&!S.token)cleanup();return}if(!st.run)loop()}
  async function loop(){
    st.run=true;st.seq=-1;st.boot='';let fails=0;
    while(S.token&&S.me){
      try{
        const r=await api('/calls/poll?after='+st.seq);fails=0;
        if(st.boot&&r.boot!==st.boot){st.boot=r.boot;st.seq=-1;if(C)lost('Звонок прервался: сервер перезапустился');continue}
        st.boot=r.boot;const first=st.seq<0;st.seq=r.seq;
        syncRinging(r.ringing||[]);
        if(first){if(r.mine&&!C&&!starting)rejoinCard(r.mine)}else r.events.forEach(onEvent)
      }catch(e){fails++;await sleep(Math.min(800*fails,5000))}
    }
    st.run=false;if(C&&!S.token)cleanup()}

  /* ----- входящие ----- */
  function syncRinging(list){
    const ids=new Set(list.map(x=>x.call));let ch=false;
    Object.keys(ring).forEach(k=>{if(!ids.has(k)&&!ring[k].rejoin){delete ring[k];ch=true}});
    list.forEach(x=>{
      if(ring[x.call])return;
      if(C||starting){if(!C||x.call!==C.id){if(!declined.has(x.call)&&!starting){declined.add(x.call);post_('/calls/decline',{call:x.call}).catch(()=>{})}}return}
      ring[x.call]=x;ch=true;
      if(document.hidden)alertUser(x.kind==='group'?x.title:nm(x.by),x.video?'Входящий видеозвонок':'Входящий звонок','#/')});
    if(ch){cardsPaint();ringSync()}}
  function cardsPaint(){
    let box=$('#kcIn');
    if(!box){box=document.createElement('div');box.id='kcIn';document.body.appendChild(box);
      box.onclick=ev=>{const b=ev.target.closest('[data-a]'),c=ev.target.closest('[data-c]');if(!b||!c)return;const id=c.dataset.c,a=b.dataset.a;
        if(a==='dec'){delete ring[id];cardsPaint();ringSync();post_('/calls/decline',{call:id}).catch(()=>{})}
        else if(a==='x'){delete ring[id];cardsPaint()}
        else joinCall(id,a==='accv')}}
    box.innerHTML=Object.keys(ring).map(k=>{const x=ring[k];
      if(x.rejoin)return `<div class="kc-card" data-c="${esc(k)}"><span class="kc-gi">${KI.phone}</span><div class="t"><b>Вы были в звонке</b><small>Звонок ещё идёт</small></div><button class="btn sm" data-a="acc" type="button">Вернуться</button><button class="ib" data-a="x" type="button" aria-label="Скрыть">${IC.close}</button></div>`;
      const g=x.kind==='group',who=x.by||{name:'Участник'};
      return `<div class="kc-card" data-c="${esc(k)}">${kav(g?{name:x.title||'Группа'}:who,'m')}<div class="t"><b>${esc(g?x.title:nm(who))}</b><small>${g?esc(nm(who))+' зовёт в групповой '+(x.video?'видеозвонок':'звонок'):(x.video?'Входящий видеозвонок':'Входящий звонок')}</small></div>`
        +`<button class="kc-b dec" data-a="dec" type="button" aria-label="Отклонить">${KI.phone}</button>${x.video?`<button class="kc-b acc" data-a="accv" type="button" aria-label="Принять с видео">${KI.cam}</button>`:''}<button class="kc-b acc" data-a="acc" type="button" aria-label="Принять">${KI.phone}</button></div>`}).join('')}
  function rejoinCard(id){ring[id]={call:id,rejoin:true};cardsPaint();setTimeout(()=>{if(ring[id]&&ring[id].rejoin){delete ring[id];cardsPaint()}},40000)}

  /* ----- свой звук / видео ----- */
  const AUD={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
  const VID=f=>({facingMode:f||'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}});
  async function media(video){
    const md=navigator.mediaDevices;
    if(!md||!md.getUserMedia||!window.RTCPeerConnection){toast('Звонки не поддерживаются здесь — откройте форум в браузере по HTTPS',1);return null}
    let s=null,v=false;
    if(video){try{s=await md.getUserMedia({audio:AUD,video:VID('user')});v=true}catch(e){s=null}}
    if(!s){try{s=await md.getUserMedia({audio:AUD})}catch(e){toast(e&&e.name==='NotAllowedError'?'Нет доступа к микрофону — разрешите его в настройках':'Не удалось включить микрофон',1);return null}
      if(video)toast('Камера недоступна — звонок будет без видео',1)}
    return {audio:s.getAudioTracks()[0]||null,video:v?(s.getVideoTracks()[0]||null):null,screen:null}}
  const stopL=L=>{if(L)[L.audio,L.video,L.screen].forEach(t=>{try{t&&t.stop()}catch(e){}})};
  const vtrack=()=>C?(C.scr&&C.local.screen?C.local.screen:(C.cam?C.local.video:null)):null;

  /* ----- начать / войти ----- */
  async function begin(fn,video){
    if(C||starting){if(C)toast('Вы уже в звонке',1);return}
    starting=true;evBuf=[];let L=null;
    try{L=await media(video);if(!L)return;const r=await fn(L);open(r,L);L=null}
    catch(e){stopL(L);toast(e.message||'Не удалось начать звонок',1)}
    finally{starting=false;const b=evBuf;evBuf=[];if(C)b.forEach(onEvent)}}
  const start=o=>begin(L=>post_('/calls/start',{peer:o.peer||0,group:o.group||0,video:!!o.video}),!!o.video);
  const joinCall=(id,video)=>begin(L=>post_('/calls/join',{call:id,video:!!L.video}),!!video);

  function open(r,L){
    const cs=r.call;
    C={id:cs.id,kind:cs.kind,gid:cs.gid,title:cs.title,ice:r.ice,peers:{},users:{},parts:{},inv:{},early:{},sig:{},sigP:Promise.resolve(),sigT:0,local:L,
       mic:true,cam:!!L.video,scr:false,face:'user',out:!r.peers.length,live:false,t0:0,min:false};
    cs.parts.forEach(p=>{C.users[p.user.id]=p.user;C.parts[p.user.id]={muted:p.muted,video:p.video,screen:p.screen}});
    cs.inv.forEach(u=>{C.users[u.id]=u;C.inv[u.id]=u});
    delete ring[cs.id];cardsPaint();
    build();r.peers.forEach(uid=>connect(uid,true));
    paint();ringSync();lock();tmT=setInterval(tick,1000);lvT=setInterval(levels,250);tick();sendState();
    if(st.gb)st.gb.draw()}

  /* ----- соединения WebRTC ----- */
  function connect(uid,init){
    if(!C)return null;if(C.peers[uid])return C.peers[uid];
    const pc=new RTCPeerConnection({iceServers:C.ice,bundlePolicy:'max-bundle'});
    const p={uid,pc,init,pend:[],rd:false,ok:false,stream:new MediaStream(),sA:null,sV:null,rt:0};
    C.peers[uid]=p;
    if(init){
      const a=pc.addTransceiver('audio',{direction:'sendrecv'}),v=pc.addTransceiver('video',{direction:'sendrecv'});p.sA=a.sender;p.sV=v.sender;
      if(C.local.audio)a.sender.replaceTrack(C.local.audio).catch(()=>{});
      const vt=vtrack();if(vt)v.sender.replaceTrack(vt).catch(()=>{})}
    pc.ontrack=e=>{if(!p.stream.getTracks().includes(e.track))p.stream.addTrack(e.track);attach(p)};
    pc.onicecandidate=e=>{if(e.candidate)qsig(uid,{t:'ice',c:e.candidate.toJSON()})};
    pc.onconnectionstatechange=()=>pcState(p);
    (C.early[uid]||[]).forEach(c=>p.pend.push(c));delete C.early[uid];
    if(init)offer(p);
    return p}
  async function offer(p,restart){
    try{const o=await p.pc.createOffer(restart?{iceRestart:true}:undefined);await p.pc.setLocalDescription(o);qsig(p.uid,{t:'offer',sdp:p.pc.localDescription.sdp},1)}catch(e){}}
  function setupSenders(p){   // у принимающей стороны транспиверы создаются из чужого offer
    p.pc.getTransceivers().forEach(t=>{const k=t.receiver&&t.receiver.track?t.receiver.track.kind:'';
      try{t.direction='sendrecv'}catch(e){}
      if(k==='audio'){p.sA=t.sender;if(C.local.audio)t.sender.replaceTrack(C.local.audio).catch(()=>{})}
      else if(k==='video'){p.sV=t.sender;const vt=vtrack();if(vt)t.sender.replaceTrack(vt).catch(()=>{})}})}
  async function onSig(e){
    if(!C||e.call!==C.id)return;const d=e.data||{},uid=e.from;let p=C.peers[uid];
    try{
      if(d.t==='offer'){
        if(!p)p=connect(uid,false);const pc=p.pc;
        if(pc.signalingState!=='stable')await pc.setLocalDescription({type:'rollback'});
        await pc.setRemoteDescription({type:'offer',sdp:d.sdp});p.rd=true;setupSenders(p);flushPend(p);
        const a=await pc.createAnswer();await pc.setLocalDescription(a);qsig(uid,{t:'answer',sdp:pc.localDescription.sdp},1)}
      else if(d.t==='answer'){if(p&&p.pc.signalingState==='have-local-offer'){await p.pc.setRemoteDescription({type:'answer',sdp:d.sdp});p.rd=true;flushPend(p)}}
      else if(d.t==='ice'){if(!p){(C.early[uid]=C.early[uid]||[]).push(d.c);return}if(p.rd)p.pc.addIceCandidate(d.c).catch(()=>{});else p.pend.push(d.c)}
      else if(d.t==='restart'){if(p&&p.init)offer(p,true)}
    }catch(er){}}
  function flushPend(p){const a=p.pend;p.pend=[];a.forEach(c=>p.pc.addIceCandidate(c).catch(()=>{}))}
  function pcState(p){
    if(!C||C.peers[p.uid]!==p)return;const s=p.pc.connectionState;clearTimeout(p.rt);
    if(s==='connected'){p.ok=true;if(!C.live){C.live=true;C.t0=Date.now();C.out=false;ringSync()}tune();paint()}
    else if(s==='failed'||s==='disconnected'){p.ok=false;paint();
      p.rt=setTimeout(()=>{if(!C||C.peers[p.uid]!==p||p.pc.connectionState==='connected'||!C.parts[p.uid])return;if(p.init)offer(p,true);else qsig(p.uid,{t:'restart'},1)},s==='failed'?400:6000)}}
  function dropPeer(uid){const p=C&&C.peers[uid];if(!p)return;try{p.pc.close()}catch(e){}clearTimeout(p.rt);if(p.au)p.au.remove();delete C.peers[uid];delete C.early[uid]}
  function attach(p){
    if(!C)return;let box=$('#kcAud');if(!box){box=document.createElement('div');box.id='kcAud';document.body.appendChild(box)}
    if(!p.au){p.au=document.createElement('audio');p.au.autoplay=true;p.au.setAttribute('playsinline','');box.appendChild(p.au)}
    if(p.au.srcObject!==p.stream)p.au.srcObject=p.stream;try{const pr=p.au.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
    const v=$(`.kc-t[data-u="${p.uid}"] video`,C.el);if(v&&v.srcObject!==p.stream)v.srcObject=p.stream}
  function tune(){   // чем больше людей, тем меньше битрейт видео на каждого (mesh)
    if(!C)return;const n=Object.keys(C.peers).length,br=n<=1?1300000:n<=3?500000:220000;
    Object.values(C.peers).forEach(p=>{try{if(!p.sV)return;const pr=p.sV.getParameters();if(pr.encodings&&pr.encodings.length){pr.encodings[0].maxBitrate=br;p.sV.setParameters(pr).catch(()=>{})}}catch(e){}})}

  /* ----- сигналы на сервер (пачками, по порядку) ----- */
  function qsig(uid,d,now){
    if(!C)return;(C.sig[uid]=C.sig[uid]||[]).push(d);
    if(now||d.t!=='ice')flushSig(uid);
    else if(!C.sigT)C.sigT=setTimeout(()=>{if(!C)return;C.sigT=0;Object.keys(C.sig).forEach(flushSig)},80)}
  function flushSig(uid){
    const c=C;if(!c||!(c.sig[uid]||[]).length)return;const items=c.sig[uid];c.sig[uid]=[];
    c.sigP=c.sigP.then(()=>post_('/calls/sig',{call:c.id,to:+uid,items}).catch(()=>{}))}
  const sendState=()=>{if(C)post_('/calls/state',{call:C.id,muted:!C.mic,video:C.cam||C.scr,screen:C.scr}).catch(()=>{})};

  /* ----- события сервера ----- */
  function onEvent(e){
    if(e.t==='gcall'){st.g[e.group]=e.call?e:null;if(st.gb&&st.gb.gid===e.group&&!st.gb.draw())st.gb=null;return}
    if(e.t==='ring'||e.t==='ring_end')return;     // список вызовов берётся из ответа сервера целиком
    if(!C||e.call!==C.id){if(starting&&!C)evBuf.push(e);return}
    if(e.t==='sig'){onSig(e);return}
    if(e.t==='joined'){C.users[e.user.id]=e.user;C.parts[e.user.id]={muted:false,video:!!e.video,screen:false};delete C.inv[e.user.id];tone([660],.12,.06);paint();ringSync()}
    else if(e.t==='left'){dropPeer(e.uid);delete C.parts[e.uid];if(e.reason!=='rejoin')tone([440],.12,.06);paint();tune()}
    else if(e.t==='declined'||e.t==='noanswer'){const u=C.users[e.uid];delete C.inv[e.uid];if(C.kind==='group'||others().length)toast(e.t==='declined'?nm(u)+' отклонил(а) звонок':nm(u)+' не отвечает');paint();ringSync()}
    else if(e.t==='invited'){e.users.forEach(u=>{C.users[u.id]=u;if(!C.parts[u.id])C.inv[u.id]=u});paint();ringSync()}
    else if(e.t==='state'){const p=C.parts[e.uid]||(C.parts[e.uid]={});p.muted=e.muted;p.video=e.video;p.screen=e.screen;paint()}
    else if(e.t==='end')finish(e.reason)}

  /* ----- экран звонка ----- */
  function build(){
    const el=document.createElement('div');el.className='kc';
    const canScr=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)&&!/Android|iPhone|iPad/i.test(navigator.userAgent);
    el.innerHTML=`<div class="kc-top"><button class="ib round" data-a="min" type="button" aria-label="Свернуть">${KI.down}</button><div class="kc-ti"><b id="kcT"></b><small id="kcS"></small></div><span style="width:42px"></span></div><div class="kc-grid" id="kcG"></div>`

  function setMin(on){if(!C)return;C.min=on;C.el.classList.toggle('min',on);C.pill.hidden=!on;if(!on)paint()}
  function mkTile(u){

  function paint(){

  function levels(){   // подсветка того, кто сейчас говорит

      if(p.an===undefined&&p.stream.getAudioTracks().length){try{const src=AC.createMediaStreamSource(p.stream),a=AC.createAnalyser();a.fftSize=256;src.connect(a);p.an=a;p.buf=new Uint8Array(a.frequencyBinCount)}catch(e){p.an=null}}

  async function pick(){

    const bg=document.createElement('div');bg.className='sheet-bg kc-pk';
    bg.innerHTML=`<div class="sheet"><div class="sh-m">Добавить в звонок</div><div style="padding:0 10px 8px"><input class="kc-q" type="search" placeholder="Найти человека" autocomplete="off"></div><div class="kc-pl"><div class="spin"></div></div><div style="padding:10px 10px 0"><button class="btn" id="kpGo" type="button" style="width:100%" disabled>Позвать</button></div></div>`;

    const sel=new Set(),list=$('.kc-pl',bg),go=$('#kpGo',bg),q=$('.kc-q',bg);let base=[],tk=0,sT=0;
    const row=u=>{const inn=!C||C.parts[u.id]||C.inv[u.id]||u.id===S.me.id;
      return `<div class="crow kc-r${inn?' dis':''}" data-u="${u.id}">${kav(u,'m')}<span class="t"><b>${esc(u.name)}</b><small>${inn?'уже в звонке':(u.username?'@'+esc(u.username):'')}</small></span><i class="kc-ck${sel.has(u.id)?' on':''}">${KI.check}</i></div>`};

    bg.onclick=ev=>{if(ev.target===bg)bg.remove()};

    go.onclick=async()=>{if(!sel.size||!C)return;go.disabled=true;

  const row=(g,k,t,s,on)=>`<div class="grow glass" data-g="${g}" data-k="${k}"><span class="t"><b>${t}</b><small>${s}</small></span><i class="sw ${on?'on':''}"></i></div>`;

  ${canSys?row('d','sys','Системные уведомления','Показывать, когда приложение свёрнуто',sysOn()):`<div class="grow glass" style="cursor:default"><span class="t"><b>Системные уведомления</b><small>В этом приложении недоступны — включите дублирование в Telegram</small></span></div>`}

    }catch(x){toast(x.message,1)}}}
